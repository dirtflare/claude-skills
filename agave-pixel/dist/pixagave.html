<title>PIXAGAVE — 育てた実物が、そのままキャラクターになる</title>
<style>
/* PIXAGAVE — design system
 *
 * 方向性: 植物図譜の「標本台紙」。生成りの紙、細い罫、明朝の見出し。
 * 主役はドット絵なので、周囲は色を使わず余白と階層だけで整える。
 * 既定は明るいベージュ。閲覧環境がダークの場合は同じ性格のまま焦茶へ寄せる。
 */

:root {
  /* 紙 — わずかに黄みを含んだ生成り。純白・純グレーは使わない */
  --paper: #f3ebdc;
  --paper-2: #ece2d0;
  --card: #fcf7ee;
  --card-2: #f7f0e2;
  --line: #e0d5c2;
  --line-2: #cdbfa6;

  --ink: #2a2721;
  --ink-2: #57503f;
  --ink-3: #8b8171;

  /* 植物由来のアクセント。彩度は抑える */
  --leaf: #3f7a5a;
  --terra: #b0603a;
  --rose: #a8557a;
  --gold: #b08324;
  --danger: #a8443c;
  --info: #3c7186;
  --accent: var(--leaf);

  --shadow: 0 1px 2px rgba(60, 45, 25, 0.06), 0 8px 24px rgba(60, 45, 25, 0.07);
  --shadow-sm: 0 1px 2px rgba(60, 45, 25, 0.08);

  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", Georgia, "Times New Roman", serif;
  --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic Medium", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --rail: 224px;
  --r: 4px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1c1a16;
    --paper-2: #16140f;
    --card: #262319;
    --card-2: #2e2a1f;
    --line: #3b3527;
    --line-2: #574e3a;
    --ink: #f0e9db;
    --ink-2: #cbc0a9;
    --ink-3: #948a76;
    --leaf: #79bb95;
    --terra: #dc9364;
    --rose: #d68aa8;
    --gold: #dcb455;
    --danger: #e0857c;
    --info: #7cb6cc;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.34);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1a16; --paper-2: #16140f; --card: #262319; --card-2: #2e2a1f;
  --line: #3b3527; --line-2: #574e3a;
  --ink: #f0e9db; --ink-2: #cbc0a9; --ink-3: #948a76;
  --leaf: #79bb95; --terra: #dc9364; --rose: #d68aa8; --gold: #dcb455;
  --danger: #e0857c; --info: #7cb6cc;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --paper: #f3ebdc; --paper-2: #ece2d0; --card: #fcf7ee; --card-2: #f7f0e2;
  --line: #e0d5c2; --line-2: #cdbfa6;
  --ink: #2a2721; --ink-2: #57503f; --ink-3: #8b8171;
  --leaf: #3f7a5a; --terra: #b0603a; --rose: #a8557a; --gold: #b08324;
  --danger: #a8443c; --info: #3c7186;
  --shadow: 0 1px 2px rgba(60,45,25,.06), 0 8px 24px rgba(60,45,25,.07);
  --shadow-sm: 0 1px 2px rgba(60,45,25,.08);
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

/* ---------- 文字の役割 ---------- */

.label {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
.serif { font-family: var(--serif); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- レイアウト ---------- */

.app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }

.rail {
  border-right: 1px solid var(--line);
  background: var(--paper-2);
  padding: 24px 16px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; height: 100dvh;
}

.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 22px; }
.brand .mark {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 34% 32%, var(--leaf), #2c5b41 70%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
}
.brand strong {
  display: block; font-family: var(--serif); font-size: 16px;
  letter-spacing: 0.14em; font-weight: 600;
}
.brand span { font-size: 9px; color: var(--ink-3); letter-spacing: 0.16em; }

.rail nav { display: flex; flex-direction: column; gap: 1px; }
.rail nav button {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 12px; border-radius: var(--r);
  color: var(--ink-2); text-align: left; font-size: 13.5px;
  transition: background 0.15s, color 0.15s;
}
.rail nav button .ico { width: 15px; text-align: center; color: var(--ink-3); }
.rail nav button:hover { background: rgba(63, 122, 90, 0.08); color: var(--ink); }
.rail nav button[aria-current="true"] {
  background: var(--card); color: var(--ink); font-weight: 600;
  box-shadow: var(--shadow-sm); border: 1px solid var(--line);
}
.rail nav button[aria-current="true"] .ico { color: var(--leaf); }
.rail nav .badge {
  margin-left: auto; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--terra); color: #fff;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  display: grid; place-items: center;
}

.rail-foot { margin-top: auto; display: grid; gap: 8px; }
.wallet {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card);
}
.wallet b { font-family: var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; }

.main { min-width: 0; padding: 34px 40px 110px; max-width: 1180px; }

/* ---------- 見出し ---------- */

.page-head {
  display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;
  padding-bottom: 18px; margin-bottom: 26px;
  border-bottom: 1px solid var(--line);
}
.page-head h1 {
  margin: 6px 0 0; font-family: var(--serif);
  font-size: clamp(28px, 3.6vw, 40px); line-height: 1.2; letter-spacing: 0.01em;
}
.page-head .lead { color: var(--ink-2); font-size: 13.5px; margin: 8px 0 0; max-width: 64ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- パネル ---------- */

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  padding: 22px 24px;
  position: relative;
}
.panel > h2 {
  margin: 0 0 16px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 700;
  display: flex; align-items: center; gap: 12px;
}
.panel > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.panel h3 { margin: 22px 0 10px; font-size: 14px; font-family: var(--serif); }

.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 18px; }

/* ---------- ボタン ---------- */

.btn {
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink);
  padding: 9px 17px; border-radius: var(--r);
  font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow-sm);
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}
.btn:hover { background: var(--card-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: #fdfaf3; }
.btn.primary:hover { background: #35664c; border-color: #35664c; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fffdf6; }
.btn.gold:hover { filter: brightness(0.94); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--ink-2); box-shadow: none; }
.btn.ghost:hover { background: var(--card-2); }
.btn.sm { padding: 5px 11px; font-size: 12px; box-shadow: none; }
.btn.big { padding: 13px 28px; font-size: 15.5px; }
.btn.block { width: 100%; }
select.btn { padding-right: 10px; }

/* ---------- チップ / タイプ ---------- */

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--line-2);
  font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); background: var(--card);
}
.chip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.type-badge {
  display: inline-block; padding: 3px 11px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
  color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.22);
}

/* ---------- メーター ---------- */

.meter { display: grid; gap: 6px; }
.meter .lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
.meter .lab b { font-family: var(--mono); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.track {
  height: 8px; border-radius: 999px; overflow: hidden;
  background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--line);
}
.track > span { display: block; height: 100%; background: var(--mc, var(--leaf)); transition: width 0.4s ease; }
.track.sm { height: 6px; }

/* ---------- スプライト ---------- */

.sprite { image-rendering: pixelated; display: block; width: 100%; height: auto; }
.sprite-frame {
  position: relative; aspect-ratio: 1; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r);
  background:
    radial-gradient(circle at 50% 62%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 62%),
    linear-gradient(180deg, var(--card-2), var(--card));
  display: grid; place-items: center; padding: 5px;
}
.sprite-frame.hero { padding: 12px; }

/* ---------- やることリスト ---------- */

.todo { counter-reset: step; display: grid; gap: 2px; }
.todo li {
  list-style: none; display: flex; gap: 14px; align-items: center;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
}
.todo li:last-child { border-bottom: 0; }
.todo .no {
  width: 26px; height: 26px; flex: none; border-radius: 50%;
  border: 1px solid var(--line-2); color: var(--ink-3);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; font-weight: 700;
}
.todo li.done .no { background: var(--leaf); border-color: var(--leaf); color: #fff; }
.todo li.done .txt { color: var(--ink-3); text-decoration: line-through; }
.todo li.now .no { background: var(--gold); border-color: var(--gold); color: #fff; }
.todo li.now { background: color-mix(in srgb, var(--gold) 9%, transparent); border-radius: var(--r); }
.todo .txt { flex: 1; font-size: 14px; }
.todo .go { margin-left: auto; }

/* ---------- 次にやること ---------- */

.next {
  border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  background: linear-gradient(100deg, color-mix(in srgb, var(--accent) 9%, var(--card)), var(--card) 60%);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 24px 26px;
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.next .n-sprite { width: 104px; flex: none; }
.next .n-body { flex: 1; min-width: 230px; }
.next h2 { margin: 8px 0 8px; font-family: var(--serif); font-size: clamp(20px, 2.4vw, 26px); }
.next p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 58ch; }

/* ---------- 手持ち ---------- */

.party { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.party .plant-card { width: 168px; flex: none; }

/* ---------- 株カード ---------- */

.plant-card {
  position: relative; text-align: left; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-sm); padding: 12px;
  display: grid; gap: 10px;
  transition: box-shadow 0.16s, transform 0.12s, border-color 0.16s;
}
.plant-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--line-2); }
.plant-card .name { font-size: 15px; font-weight: 700; font-family: var(--serif); }
.plant-card .meta { font-size: 11px; color: var(--ink-3); }
.plant-card .alert {
  position: absolute; top: 8px; right: 8px; border-radius: 999px;
  background: var(--terra); color: #fff; font-size: 10px; font-weight: 700;
  padding: 1px 8px; letter-spacing: 0.06em;
}

/* ---------- 進化系統図 ---------- */

.evoline { display: grid; gap: 14px; }
.evoline .chain { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.evo-node { flex: none; width: 96px; text-align: center; }
.evo-node.cur .sprite-frame { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.evo-node.locked .sprite { filter: brightness(0) saturate(0); opacity: 0.22; }
.evo-node .nm { font-size: 11.5px; margin-top: 6px; color: var(--ink-2); }
.evo-node.locked .nm { color: var(--ink-3); }
.evo-arrow { color: var(--ink-3); font-size: 15px; flex: none; }
.evo-branches { display: grid; gap: 8px; }

/* ---------- 図鑑 ---------- */

.dex-cell {
  width: 100%; text-align: center; padding: 12px 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s, box-shadow 0.16s;
}
.dex-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.dex-cell.locked { background: var(--card-2); }
.dex-cell.locked .sprite { filter: brightness(0) saturate(0); opacity: 0.2; }
.dex-cell .no { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.12em; }
.dex-cell .nm { font-size: 13.5px; margin-top: 6px; font-weight: 600; font-family: var(--serif); }
.forms { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
.forms i { width: 8px; height: 8px; border-radius: 50%; display: block; background: var(--line); }

/* ---------- 個性値 ---------- */

.gene-row {
  display: grid; grid-template-columns: 86px 1fr 56px; gap: 12px; align-items: center;
  font-size: 12.5px; margin-bottom: 9px;
}
.gene-row .val { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.gene-row .delta { font-size: 10px; }

/* ---------- 助言 ---------- */

.advice { display: grid; gap: 8px; margin: 0; padding: 0; }
.advice li {
  list-style: none; padding: 10px 14px; border-radius: var(--r);
  border: 1px solid var(--line); border-left: 3px solid var(--line-2);
  font-size: 13px; background: var(--card-2);
}
.advice li.warn { border-left-color: var(--gold); }
.advice li.danger { border-left-color: var(--danger); }
.advice li.good { border-left-color: var(--leaf); }
.advice li.info { border-left-color: var(--info); }

/* ---------- タイムライン ---------- */

.timeline .item {
  display: grid; grid-template-columns: 96px 1fr; gap: 18px;
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
.timeline .when { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-bottom: 6px; }
.timeline img.thumb { border: 1px solid var(--line); border-radius: var(--r); }

.compare {
  position: relative; aspect-ratio: 1; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r);
  user-select: none; touch-action: none; cursor: ew-resize;
}
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .after { clip-path: inset(0 0 0 var(--split, 50%)); }
.compare .handle { position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.compare .handle::after {
  content: "◀▶"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 10px; color: var(--ink); background: #fff; padding: 4px 7px; border-radius: 999px;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.compare .cap {
  position: absolute; bottom: 8px; padding: 2px 9px; border-radius: 999px;
  background: rgba(255, 253, 247, 0.9); color: var(--ink);
  font-family: var(--mono); font-size: 10px;
}
.compare .cap.l { left: 8px; }
.compare .cap.r { right: 8px; }

/* ---------- モーダル / トースト ---------- */

.modal-back {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(42, 34, 22, 0.42); backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 20px;
  animation: fade 0.16s ease;
}
.modal {
  width: min(780px, 100%); max-height: 88vh; overflow: auto;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 6px;
  box-shadow: 0 24px 60px rgba(40, 30, 15, 0.28);
  padding: 26px 28px;
}
.modal header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.modal h2 { margin: 0; font-family: var(--serif); font-size: 21px; }

.toasts {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  display: grid; gap: 8px; z-index: 80; width: min(460px, calc(100vw - 28px));
}
.toast {
  background: var(--card); border: 1px solid var(--line-2); border-left: 4px solid var(--leaf);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 11px 15px; font-size: 13.5px;
  animation: rise 0.18s ease;
}
.toast.bad { border-left-color: var(--danger); }
.toast.gold { border-left-color: var(--gold); }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* ---------- 進化演出 ---------- */

.evolve-scene { text-align: center; display: grid; gap: 18px; justify-items: center; }
.evolve-pair { display: flex; align-items: center; gap: 22px; }
.evolve-pair .sprite-frame { width: 148px; }
.evolve-pair .arrow { font-size: 26px; color: var(--gold); animation: blink 1s steps(2, end) infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.flash {
  position: fixed; inset: 0; z-index: 70; pointer-events: none;
  background: radial-gradient(circle at 50% 42%, #fff, rgba(255, 245, 220, 0.85) 34%, transparent 66%);
  opacity: 0; animation: flash 1s ease;
}
@keyframes flash { 0% { opacity: 0; } 22% { opacity: 0.95; } 100% { opacity: 0; } }

/* ---------- フォーム ---------- */

.field { display: grid; gap: 7px; margin-bottom: 16px; }
.field > label { font-size: 12px; color: var(--ink-3); }
.field input[type="text"], .field input[type="number"], .field select, .field textarea {
  background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r);
  padding: 10px 12px; width: 100%;
}
.field input[type="range"] { width: 100%; accent-color: var(--leaf); }
.dropzone {
  border: 1.5px dashed var(--line-2); border-radius: 6px; padding: 34px; text-align: center;
  color: var(--ink-2); background: var(--card-2); cursor: pointer;
}
.dropzone.over { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 8%, var(--card)); }

.pick { display: grid; gap: 8px; }
.pick button {
  display: grid; gap: 2px; text-align: left; width: 100%;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--card); padding: 12px 15px;
}
.pick button:hover { border-color: var(--line-2); }
.pick button[aria-pressed="true"] {
  border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 8%, var(--card));
  box-shadow: inset 0 0 0 1px var(--leaf);
}
.pick button b { font-size: 14px; }
.pick button span { font-size: 12px; color: var(--ink-3); }

/* ---------- 最初の1株を選ぶ ---------- */

.starter { max-width: 940px; margin: 0 auto; text-align: center; padding: 20px 0 60px; }
.starter h1 { font-family: var(--serif); font-size: clamp(28px, 4vw, 42px); margin: 12px 0 10px; }
.starter .lead { color: var(--ink-2); max-width: 56ch; margin: 0 auto 32px; }
.starter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; text-align: left; }
.starter-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow-sm); padding: 16px;
  transition: transform 0.12s, box-shadow 0.16s, border-color 0.16s;
  width: 100%; text-align: left;
}
.starter-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--leaf); }

/* ---------- 下部ナビ ---------- */

.tabbar { display: none; }

@media (max-width: 940px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .main { padding: 16px 16px 110px; }
  .page-head { margin-bottom: 20px; }
  .next { padding: 18px; gap: 16px; }
  .next .n-sprite { width: 80px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    color: var(--ink-3); padding: 9px 2px 8px;
    display: grid; gap: 2px; justify-items: center; font-size: 10px;
  }
  .tabbar button .ico { font-size: 16px; }
  .tabbar button[aria-current="true"] { color: var(--leaf); box-shadow: inset 0 2px 0 var(--leaf); }
  .mobile-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
}
@media (min-width: 941px) { .mobile-head { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

const __m_store = (() => {

/* PIXAGAVE — 永続化層
 * ゲーム状態は localStorage、画像(元写真 / スプライト)は IndexedDB。
 * 画像を localStorage に入れると 5MB 制限を即座に超えるため分離している。
 */

const DB_NAME = 'pixagave';
const DB_VERSION = 1;
const IMG_STORE = 'images';
const SAVE_KEY = 'pixagave.save.v1';

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in globalThis)) {
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IMG_STORE)) {
        db.createObjectStore(IMG_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

/* IndexedDB が使えない環境(プライベートモード等)向けのメモリフォールバック */
const memoryImages = new Map();

async function putImage(key, dataUrl) {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).put(dataUrl, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    memoryImages.set(key, dataUrl);
  }
  return key;
}

async function getImage(key) {
  if (!key) return null;
  if (memoryImages.has(key)) return memoryImages.get(key);
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).get(key);
      req.onsuccess = () => resolve(req.result ?? null);
      req.onerror = () => reject(req.error);
    });
  } catch {
    return null;
  }
}

async function deleteImage(key) {
  memoryImages.delete(key);
  try {
    const db = await openDB();
    await new Promise((resolve) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).delete(key);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch {
    /* noop */
  }
}

async function allImageKeys() {
  try {

  } catch {

  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    return true;
  } catch (err) {
    console.warn('[pixagave] save failed', err);
    return false;
  }

}

async function exportAll(state) {
  const keys = await allImageKeys();
  const images = {};
  for (const k of keys) {
    const v = await getImage(k);
    if (v) images[k] = v;
  }
  return JSON.stringify({ format: 'pixagave-export', version: 1, state, images });

async function importAll(json) {
  const parsed = JSON.parse(json);
  if (parsed.format !== 'pixagave-export') throw new Error('形式が違います');
  for (const [k, v] of Object.entries(parsed.images || {})) {

  if (!points.length) return [];
  k = Math.min(k, points.length);
  // 輝度順に等間隔サンプリングして初期中心を決める(k-means++ の簡易版)
  const sorted = [...points].sort((a, b) => lumaOf(a[0], a[1], a[2]) - lumaOf(b[0], b[1], b[2]));
  const centers = [];
  for (let i = 0; i < k; i++) {
    centers.push([...sorted[Math.floor(((i + 0.5) / k) * (sorted.length - 1))]]);
  }
  const assign = new Int32Array(points.length);
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let p = 0; p < points.length; p++) {
      let bi = 0, bd = Infinity;
      for (let c = 0; c < centers.length; c++) {
        const dr = points[p][0] - centers[c][0];
        const dg = points[p][1] - centers[c][1];
        const db = points[p][2] - centers[c][2];
        const d = dr * dr + dg * dg + db * db;
        if (d < bd) { bd = d; bi = c; }
      }
      if (assign[p] !== bi) { assign[p] = bi; moved = true; }
    }
    const sums = centers.map(() => [0, 0, 0, 0]);
    for (let p = 0; p < points.length; p++) {
      const s = sums[assign[p]];
      s[0] += points[p][0]; s[1] += points[p][1]; s[2] += points[p][2]; s[3]++;
    }
    for (let c = 0; c < centers.length; c++) {
      if (sums[c][3] > 0) {
        centers[c] = [sums[c][0] / sums[c][3], sums[c][1] / sums[c][3], sums[c][2] / sums[c][3]];
      }
    }
    if (!moved && it > 2) break;
  }
  const weights = new Array(centers.length).fill(0);
  for (let p = 0; p < points.length; p++) weights[assign[p]]++;
  return centers.map((c, i) => ({ rgb: c, weight: weights[i] / points.length }));
}

/* 中心色を「ドット絵らしい」色に整える。
 * 元写真の色相は残しつつ、彩度と明度を段階化して情報量を落とす。 */
function stylize(rgb, speciesHue, strength = 0.14) {
  let [h, s, l] = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  // 種の基調色相へ少しだけ引き寄せる(個体差は残す)
  let gap = speciesHue - h;
  if (gap > 180) gap -= 360;
  if (gap < -180) gap += 360;
  h += gap * strength;
  s = clamp01(Math.round(clamp01(s * 1.22) * 6) / 6);
  l = clamp(Math.round(l * 9) / 9, 0.06, 0.95);
  return hslToRgb(h, s, l);
}

const BAYER4 = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5],
];

/* ---------- 4. 個性値の解析 ---------- */

function analyze(cells, grid, species) {
  const inside = [];
  let area = 0, perimeter = 0;
  const rows = new Array(grid).fill(0);
  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const c = cells[y * grid + x];
      if (c.cover < 0.42) continue;
      area++;
      rows[y]++;
      inside.push({ x, y, ...c });
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        const n = nx < 0 || ny < 0 || nx >= grid || ny >= grid ? null : cells[ny * grid + nx];
        if (!n || n.cover < 0.42) perimeter++;
      }
    }
  }
  if (!area) {
    return { raw: {}, hue: speciesHueOf(species), area: 0 };
  }

  const lums = inside.map((c) => lumaOf(c.r, c.g, c.b));
  const meanL = lums.reduce((a, b) => a + b, 0) / lums.length;
  const sd = Math.sqrt(lums.reduce((a, b) => a + (b - meanL) ** 2, 0) / lums.length);

  let hx = 0, hy = 0, satSum = 0;
  let brightPale = 0, highlight = 0;
  for (const c of inside) {
    const [h, s, l] = rgbToHsl(c.r, c.g, c.b);
    hx += Math.cos((h * Math.PI) / 180) * s;
    hy += Math.sin((h * Math.PI) / 180) * s;
    satSum += s;
    if (l > 0.62 && s < 0.24) brightPale++;              // 白粉・粉質
    if (lumaOf(c.r, c.g, c.b) > meanL + sd * 1.05 && s > 0.16) highlight++; // 斑・覆輪
  }
  const meanHue = ((Math.atan2(hy, hx) * 180) / Math.PI + 360) % 360;
  const meanSat = satSum / inside.length;

  // 締まり: 外接円に対する充填率が高いほど「詰まっている」
  const bboxArea = grid * grid;
  const compactness = area / bboxArea;
  // 棘・鋸歯: 面積あたりの輪郭長。ギザギザなほど大きい
  const roughness = perimeter / (4 * Math.sqrt(area));
  // 葉幅: 行ごとの被覆長の平均(幅広ほど大)
  const meanRow = rows.filter((r) => r > 0).reduce((a, b) => a + b, 0) / rows.filter((r) => r > 0).length;
  const leafiness = meanRow / grid;

  const raw = {
    leaf: clamp(leafiness * 150 - 10, 0, 100),
    compact: clamp(compactness * 210, 0, 100),
    spine: clamp((roughness - 1.05) * 118, 0, 100),
    variegation: clamp((highlight / area) * 330, 0, 100),
    bloom: clamp((brightPale / area) * 280, 0, 100),
    vigor: clamp(meanSat * 105 + compactness * 45, 0, 100),
  };
  return { raw, hue: meanHue, area, contrast: sd / 64, meanSat };
}

/* 解析値と種のバイアスを合成して確定した個性値にする */
function mixGenes(raw, species, luck = Math.random) {
  const out = {};
  for (const key of ['leaf', 'compact', 'spine', 'variegation', 'bloom', 'vigor']) {
    const photo = raw && Number.isFinite(raw[key]) ? raw[key] : 50;
    const bias = species.bias[key];
    const jitter = (luck() - 0.5) * 12;
    out[key] = Math.round(clamp(photo * 0.55 + bias * 0.45 + jitter, 1, 100));
  }
  return out;
}

/* ---------- 5. 本体 ---------- */

/**
 * 写真をドット絵スプライトに変換する。
 * @param {HTMLImageElement} img
 * @param {{species: object, grid?: number, colors?: number, dither?: boolean}} opts
 * @returns {{sprite: string, thumb: string, grid: number, analysis: object}}
 */
function pixelizePhoto(img, opts = {}) {
  const species = opts.species || { hue: 150, bias: {} };
  const hue = speciesHueOf(species);
  const grid = opts.grid || 44;
  const colors = opts.colors || 8;
  const dither = opts.dither !== false;

  const imageData = squareCrop(img, WORK);
  const data = imageData.data;

  let { mask } = buildMask(data, WORK);
  mask = morph(mask, WORK, 'dilate', 1);
  mask = morph(mask, WORK, 'erode', 2);
  mask = morph(mask, WORK, 'dilate', 1);
  mask = largestComponent(mask, WORK);
  mask = fillHoles(mask, WORK);

  // マスクが小さすぎる / 大きすぎる場合は主題抽出に失敗しているので中央円にフォールバック
  let covered = 0;
  for (let p = 0; p < mask.length; p++) covered += mask[p];
  const ratio = covered / mask.length;
  if (ratio < 0.045 || ratio > 0.97) {
    mask = new Uint8Array(WORK * WORK);
    const r = WORK * 0.42;
    for (let y = 0; y < WORK; y++) {
      for (let x = 0; x < WORK; x++) {
        if (Math.hypot(x - WORK / 2, y - WORK / 2) <= r) mask[y * WORK + x] = 1;
      }
    }
  }

  const { cells } = downsample(data, WORK, mask, grid);
  const analysis = analyze(cells, grid, species);

  const points = cells.filter((c) => c.cover >= 0.42).map((c) => [c.r, c.g, c.b]);
  const centers = kmeans(points, colors);
  const palette = centers.map((c) => stylize(c.rgb, hue));

  // --- 描画 ---
  const out = makeCanvas(grid, grid);
  const octx = out.getContext('2d', { willReadFrequently: true });
  const outData = octx.createImageData(grid, grid);

  const nearest = (r, g, b) => {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < centers.length; i++) {
      const dr = r - centers[i].rgb[0], dg = g - centers[i].rgb[1], db = b - centers[i].rgb[2];
      const d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  };

  const solid = (x, y) =>
    x >= 0 && y >= 0 && x < grid && y < grid && cells[y * grid + x].cover >= 0.42;

  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const idx = (y * grid + x) * 4;
      const c = cells[y * grid + x];
      if (c.cover < 0.42) {
        // 輪郭: 実体に隣接する空白セルを暗色で縁取る
        const touching = solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1);
        if (touching && c.cover > 0.12) {
          outData.data[idx] = 12;
          outData.data[idx + 1] = 26;
          outData.data[idx + 2] = 20;
          outData.data[idx + 3] = 235;
        } else {
          outData.data[idx + 3] = 0;
        }
        continue;
      }
      let r = c.r, g = c.g, b = c.b;
      if (dither) {
        const t = (BAYER4[y & 3][x & 3] / 16 - 0.5) * 26;
        r += t; g += t; b += t;
      }
      const pi = nearest(r, g, b);
      let [pr, pg, pb] = palette[pi] || [80, 120, 90];

      // 擬似ライティング: 左上から光が当たっている前提で縁を持ち上げ、右下を落とす
      const upLeftOpen = !solid(x - 1, y) || !solid(x, y - 1);
      const downRightOpen = !solid(x + 1, y) || !solid(x, y + 1);
      if (upLeftOpen && !downRightOpen) {
        const [h, s, l] = rgbToHsl(pr, pg, pb);
        [pr, pg, pb] = hslToRgb(h, s * 0.92, clamp01(l + 0.11));
      } else if (downRightOpen && !upLeftOpen) {
        const [h, s, l] = rgbToHsl(pr, pg, pb);
        [pr, pg, pb] = hslToRgb(h, clamp01(s * 1.05), clamp01(l - 0.1));
      }

      outData.data[idx] = pr;
      outData.data[idx + 1] = pg;
      outData.data[idx + 2] = pb;
      outData.data[idx + 3] = 255;
    }
  }
  octx.putImageData(outData, 0, 0);

  // サムネイル(元写真の縮小版。アルバム表示用に 320px の JPEG で保持)
  const thumbSize = 320;
  const tc = makeCanvas(thumbSize, thumbSize);
  const tctx = tc.getContext('2d');
  const side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
  tctx.drawImage(
    img,
    ((img.naturalWidth || img.width) - side) / 2,
    ((img.naturalHeight || img.height) - side) / 2,
    side, side, 0, 0, thumbSize, thumbSize
  );

  return {
    sprite: out.toDataURL('image/png'),
    thumb: tc.toDataURL('image/jpeg', 0.72),
    grid,
    analysis,
    palette: palette.map(([r, g, b]) => `rgb(${r},${g},${b})`),
  };
}

/* 与えられたスプライト dataURL を n 倍に拡大した canvas を返す(共有画像生成用) */
async function scaleSprite(dataUrl, scale) {
  const img = await loadImageFromUrl(dataUrl);
  const c = makeCanvas(img.width * scale, img.height * scale);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

return { loadImageFromFile, loadImageFromUrl, mixGenes, pixelizePhoto, scaleSprite };

/* PIXAGAVE — ゲーム本体

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const round1 = (v) => Math.round(v * 10) / 10;
const dayKey = (t) => new Date(t).toISOString().slice(0, 10);

/* ---------- 季節 ---------- */

const SEASONS = [
  { key: 'spring', ja: '春', icon: '❀', growth: 1.0 },
  { key: 'summer', ja: '夏', icon: '☀', growth: 1.25 },
  { key: 'autumn', ja: '秋', icon: '☂', growth: 0.95 },
  { key: 'winter', ja: '冬', icon: '❄', growth: 0.6 },
];

/* 冬型の品種は夏に緩み、冬に伸びる */
const WINTER_GROWERS = new Set(['elephantipes', 'lithops']);

function seasonAt(clock) {
  const i = Math.floor(clock / DAYS_PER_SEASON) % 4;
  const s = SEASONS[((i % 4) + 4) % 4];
  const into = clock % DAYS_PER_SEASON;
  return { ...s, daysLeft: round1(DAYS_PER_SEASON - into) };
}

function growthFactor(species, season) {
  if (!WINTER_GROWERS.has(species.id)) return season.growth;
  return { spring: 1.0, summer: 0.6, autumn: 1.15, winter: 1.1 }[season.key];
}

/* 成長が鈍る時期。進化を止めることはしない(ゲームとして待たされすぎるため) */
const isSlowSeason = (species, season) => growthFactor(species, season) < 0.8;

/* ---------- 初期状態 ---------- */

function freshState() {

  return {

}

function createPlant(speciesId, opts = {}) {
  const species = SPECIES_BY_ID[speciesId];
  const clock = opts.clock ?? 0;
  const seed = opts.seed || `${speciesId}:${Date.now()}:${Math.random()}`;
  const rnd = seededRandom(seed);
  const genes = opts.genes || defaultGenes(species, rnd);
  const nature = opts.nature || NATURES[Math.floor(rnd() * NATURES.length)];
  return {
    id: uid('pl'),
    speciesId,
    nickname: opts.nickname || species.ja,
    seed,
    nature,
    createdAt: Date.now(),
    bornDay: clock,
    stage: 0,
    branch: null,
    exp: 0,
    genes,
    baseGenes: { ...genes },
    care: { hydration: 78, nutrition: 60, health: 92 },
    light: species.light,
    lux: 0,
    lightHours: 0,
    lastWaterDay: clock,
    lastPhotoDay: -99,
    pest: 0,
    metrics: { diameter: 0, leaves: 0, height: 0 },
    baseline: { diameter: 0, stageAtDay: clock },
    album: [],
    events: [{ t: Date.now(), day: clock, type: 'birth', text: `${species.ja} を棚に迎えた` }],
    spriteId: null,
    photoId: null,
    parents: opts.parents || null,
    hybrid: opts.hybrid || null,
    gen: opts.gen || 1,
    waterIntervals: [],
    note: '',
  };
}

function defaultGenes(species, rnd) {
  const g = {};
  for (const k of GENE_KEYS) g[k] = Math.round(clamp(species.bias[k] + (rnd() - 0.5) * 26, 1, 100));
  return g;
}

class Game extends EventTarget {
  LEAGUES = [
    { ja: '棚デビュー', min: 0, reward: 120 },
    { ja: '地区大会', min: 240, reward: 240 },
    { ja: '県大会', min: 400, reward: 420 },
    { ja: '全国大会', min: 580, reward: 700 },
    { ja: '世界選手権', min: 780, reward: 1200 },
  ];

  constructor() {
    super();
    this.state = loadSave() || freshState();
    this.migrate();
  }

  migrate() {
    const base = freshState();
    this.state = { ...base, ...this.state };
    for (const key of ['stats', 'items', 'settings', 'tutorial']) {
      this.state[key] = { ...base[key], ...this.state[key] };
    }
    // v1(実時間ベース)からの移行
    if (typeof this.state.clock !== 'number') this.state.clock = 0;
    if (typeof this.state.lastRealMs !== 'number') this.state.lastRealMs = Date.now();
    for (const p of this.state.plants) {
      p.baseGenes ||= { ...p.genes };
      p.waterIntervals ||= [];
      p.album ||= [];
      p.events ||= [];
      p.metrics ||= { diameter: 0, leaves: 0, height: 0 };
      p.nature ||= NATURES[0];
      p.seed ||= p.id;
      if (typeof p.bornDay !== 'number') p.bornDay = 0;
      if (typeof p.lastWaterDay !== 'number') p.lastWaterDay = this.state.clock;
      if (typeof p.lastPhotoDay !== 'number') p.lastPhotoDay = -99;
      p.baseline = { diameter: p.baseline?.diameter || 0, stageAtDay: p.baseline?.stageAtDay ?? 0 };
    }
  }

  save() {
    writeSave(this.state);
    this.emit('change');
  }

  emit(type, detail) {
    this.dispatchEvent(new CustomEvent(type, { detail }));
  }

  /* ---- 時間 ---- */

  get pace() {
    return PACES[this.state.settings.pace] || PACES.normal;
  }
  get msPerGameDay() {
    return this.pace.realMinutesPerDay * 60000;
  }
  get clock() {
    return this.state.clock;
  }
  /** ゲーム日数 → 人間が読める実時間 */
  realTimeText(gameDays) {
    const min = Math.max(0, gameDays) * this.pace.realMinutesPerDay;
    if (min < 1) return 'まもなく';
    if (min < 60) return `約${Math.ceil(min)}分`;
    if (min < 60 * 24) return `約${Math.round(min / 60 * 10) / 10}時間`;
    return `約${Math.round(min / 1440 * 10) / 10}日`;
  }
  season() {
    return seasonAt(this.state.clock);
  }

  /* ---- 参照系 ---- */
  plant(id) { return this.state.plants.find((p) => p.id === id) || null; }
  species(p) { return SPECIES_BY_ID[p.speciesId]; }
  stageInfo(p) { return STAGES[p.stage]; }
  ageDays(p) { return Math.max(0, this.state.clock - p.bornDay); }

  displayName(p) {
    const sp = this.species(p);
    if (p.hybrid) {
      const a = SPECIES_BY_ID[p.hybrid.a]?.ja ?? '?';
      const b = SPECIES_BY_ID[p.hybrid.b]?.ja ?? '?';
      return p.branch ? `${a}×${b}・${BRANCHES[p.branch].ja}` : `${a}×${b}`;
    }
    if (p.branch) return `${sp.ja}・${BRANCHES[p.branch].ja}`;
    return `${sp.ja} ${STAGES[p.stage].ja}`;
  }

  /** その株の現在のタイプ(品種タイプ + 系統タイプ) */
  typesOf(p) {
    const list = [...this.species(p).types];
    if (p.branch && !list.includes(BRANCHES[p.branch].type)) list.push(BRANCHES[p.branch].type);
    return list;
  }

  score(p) {
    const g = p.genes;
    const sp = this.species(p);
    const gene = (g.leaf * 0.9 + g.compact * 1.6 + g.spine * 1.2 + g.variegation * 1.4 +
      g.bloom * 0.7 + g.vigor * 0.9) / 6.7;
    return Math.round(clamp(
      gene * 3.4 + p.stage * 34 + sp.rarity * 12 + Math.min(60, p.album.length * 5) +
      this.careQuality(p) * 0.9 + (p.care.health - 60) * 0.5, 0, 1200));
  }

  careQuality(p) {
    const sp = this.species(p);
    let s = 50;
    const iv = p.waterIntervals.slice(-8);
    if (iv.length >= 2) {
      const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
      const sd = Math.sqrt(iv.reduce((a, b) => a + (b - mean) ** 2, 0) / iv.length);
      s += clamp(22 - Math.abs(mean - sp.water) * 3.4, -18, 22);
      s += clamp(14 - sd * 3.2, -10, 14);
    }
    s += clamp(18 - Math.abs(p.light - sp.light) * 0.55, -20, 18);
    s += (p.care.health - 70) * 0.35;
    s -= p.pest * 0.25;
    s += Math.min(12, p.album.length * 1.5);
    return Math.round(clamp(s, 0, 100));
  }

  avgWaterInterval(p) {
    if (!p.waterIntervals.length) return null;
    const iv = p.waterIntervals.slice(-10);
    return round1(iv.reduce((a, b) => a + b, 0) / iv.length);

    return p.lux || Math.round(p.light * 1180 + 800);

  /* ---- シミュレーション ---- */

  tick(force = false) {
    const now = Date.now();

    if (elapsed <= 0.0008 && !force) return false;
    this.state.clock += Math.max(0, elapsed);
    this.state.lastRealMs = now;
    const season = this.season();

    for (const p of this.state.plants) {
      const sp = this.species(p);
      const gf = growthFactor(sp, season);
      const d = Math.max(0, elapsed);

      const dryRate = (100 / sp.water) * (gf < 0.8 ? 0.6 : 1) * (0.85 + p.light / 220);
      p.care.hydration = clamp(p.care.hydration - dryRate * d, 0, 120);
      p.care.nutrition = clamp(p.care.nutrition - 3.6 * d * (gf < 0.8 ? 0.5 : 1), 0, 100);

      const pestRisk = (p.care.hydration > 88 ? 1.6 : 0.35) *
        (p.light < sp.light - 22 ? 1.9 : 0.7) * (this.state.items.shade > 0 ? 0.7 : 1);
      p.pest = clamp(p.pest + pestRisk * 1.4 * d, 0, 100);

      const over = p.care.hydration > 100 ? (p.care.hydration - 100) * 1.4 : 0;
      const under = p.care.hydration < 12 ? (12 - p.care.hydration) * 2.4 : 0;
      const lightPenalty = Math.abs(p.light - sp.light) * 0.75;
      const target = clamp(100 - over - under - lightPenalty - p.pest * 0.55 +
        (p.care.nutrition > 40 ? 6 : -6), 5, 100);
      p.care.health += (target - p.care.health) * clamp(d * 0.6, 0, 1);
      p.care.health = clamp(p.care.health, 1, 100);

      this.driftGenes(p, sp, d * gf);

      if (p.care.health > 55) {
        p.exp += 18 * d * gf * (this.state.items.pot > 0 ? 1.15 : 1);
      }
    }

    this.checkLogin();
    this.checkQuests();
    writeSave(this.state);
    this.emit('tick');
    return true;
  }

  /* 育て方が姿に出る。性格で伸びやすさが変わる */
  driftGenes(p, sp, days) {
    const g = p.genes, base = p.baseGenes;
    const lightGap = p.light - sp.light;
    const dry = p.care.hydration < 45;
    const move = (key, delta) => {
      let d = delta;
      if (p.nature.up === key) d *= 1.5;
      if (p.nature.down === key) d *= 0.5;
      g[key] = Math.round(clamp(g[key] + d * days, clamp(base[key] - 30, 1, 100), clamp(base[key] + 30, 1, 100)) * 10) / 10;
    };
    if (Math.abs(lightGap) <= 8 && dry) move('compact', 1.4);
    else if (lightGap < -18) move('compact', -1.6);
    else if (lightGap > 18) move('compact', 0.3);
    if (lightGap > -5 && p.care.health > 55) move('spine', 0.6);
    if (p.care.nutrition > 55 && p.care.hydration > 35) { move('vigor', 0.9); move('leaf', 0.5); }
    else if (p.care.nutrition < 15) move('vigor', -0.6);
    if (dry && lightGap > -4) move('bloom', 0.5);
    if (p.pest > 45) { move('leaf', -0.8); move('compact', -0.6); }
  }

  checkLogin() {
    const key = dayKey(Date.now());
    const st = this.state.stats;
    if (st.lastLoginDay !== key) {
      const diff = Math.round((new Date(key) - new Date(st.lastLoginDay)) / 86400000);
      st.streak = diff === 1 ? st.streak + 1 : 1;
      st.lastLoginDay = key;
      const bonus = 30 + Math.min(70, st.streak * 5);
      this.state.coins += bonus;
      this.pushLog(`ログインボーナス +${bonus} コイン(${st.streak}日連続)`);
    }
  }

  pushLog(text) {
    this.state.log.unshift({ t: Date.now(), day: round1(this.state.clock), text });
    this.state.log = this.state.log.slice(0, 60);
  }

  /* ---- ケア ---- */

  water(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const sp = this.species(p);
    const interval = this.state.clock - p.lastWaterDay;
    const over = p.care.hydration > 70;
    if (interval > 0.25) p.waterIntervals = [...p.waterIntervals, round1(interval)].slice(-20);
    p.lastWaterDay = this.state.clock;
    p.care.hydration = over ? clamp(p.care.hydration + 20, 0, 118) : 100;
    let gain = 8, msg = `${p.nickname} に水をやった`, kind = '';
    if (over) {
      p.care.health = clamp(p.care.health - 5, 1, 100);
      p.pest = clamp(p.pest + 7, 0, 100);
      gain = 2;
      msg = '用土がまだ湿っている。根腐れに注意';
      kind = 'bad';
    } else if (Math.abs(interval - sp.water) <= 1.5) {
      gain = 20;
      msg = '完璧なタイミングの潅水！';
      kind = 'gold';
    }
    this.gainExp(p, gain);
    this.state.stats.waterings++;
    this.state.tutorial.water = true;
    this.pushLog(msg);
    this.save();
    return { ok: true, message: `${msg} (+${gain} EXP)`, kind, exp: gain };
  }

  fertilize(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    if (this.state.items.fertilizer <= 0) return { ok: false, message: '活力剤がありません(ショップで購入できます)' };
    this.state.items.fertilizer--;
    p.care.nutrition = clamp(p.care.nutrition + 45, 0, 100);
    this.gainExp(p, 12);
    this.pushLog(`${p.nickname} に活力剤を与えた`);
    this.save();
    return { ok: true, message: '養分 +45 (+12 EXP)' };
  }

  treat(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    if (p.pest < 1) return { ok: false, message: '害虫は見当たりません' };
    if (this.state.items.medicine <= 0) return { ok: false, message: '殺虫剤がありません(ショップで購入できます)' };
    this.state.items.medicine--;
    p.pest = 0;
    p.care.health = clamp(p.care.health + 6, 1, 100);
    this.gainExp(p, 14);
    this.pushLog(`${p.nickname} の害虫を駆除した`);
    this.save();
    return { ok: true, message: '害虫を駆除した (+14 EXP)' };
  }

  setLight(id, value) {
    const p = this.plant(id);
    if (p) { p.light = clamp(Math.round(value), 0, 100); this.save(); }
  }

  setLightMeasure(id, { lux, hours }) {
    const p = this.plant(id);
    if (!p) return;
    if (Number.isFinite(lux)) p.lux = Math.max(0, Math.round(lux));
    if (Number.isFinite(hours)) p.lightHours = clamp(hours, 0, 24);
    this.gainExp(p, 6);
    this.save();
  }

  addPhoto(id, { photoId, spriteId, analysis, note }) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    p.album.unshift({
      id: uid('al'), t: Date.now(), day: round1(this.state.clock),
      photoId, spriteId, note: note || '', stage: p.stage, metrics: { ...p.metrics },
    });
    p.photoId = photoId;
    p.spriteId = spriteId;
    p.lastPhotoDay = this.state.clock;
    if (analysis && analysis.raw) {
      for (const k of GENE_KEYS) {
        if (!Number.isFinite(analysis.raw[k])) continue;
        p.genes[k] = Math.round(clamp(p.genes[k] * 0.78 + analysis.raw[k] * 0.22, 1, 100));
      }
    }
    this.state.stats.photos++;
    this.state.tutorial.photo = true;
    this.gainExp(p, 30);
    this.registerDex(p);
    this.pushLog(`${p.nickname} の写真を記録した (${p.album.length}枚目)`);
    this.checkQuests();
    this.save();
    return { ok: true };
  }

  measure(id, { diameter, leaves, height }) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const prev = { ...p.metrics };
    if (Number.isFinite(diameter) && diameter > 0) p.metrics.diameter = diameter;
    if (Number.isFinite(leaves) && leaves > 0) p.metrics.leaves = Math.round(leaves);
    if (Number.isFinite(height) && height > 0) p.metrics.height = height;
    if (!p.baseline.diameter) p.baseline.diameter = p.metrics.diameter;
    const grew = Math.max(0, (p.metrics.diameter || 0) - (prev.diameter || 0));
    const gain = 18 + Math.round(grew * 14);
    this.gainExp(p, gain);
    this.state.stats.measures++;
    p.events.unshift({
      t: Date.now(), day: round1(this.state.clock), type: 'measure',
      text: `実測 幅 ${p.metrics.diameter}cm / 葉 ${p.metrics.leaves}枚${grew ? ` (+${round1(grew)}cm)` : ''}`,
    });
    this.checkQuests();
    this.save();
    return { ok: true, exp: gain, grew };
  }

  gainExp(p, amount) {
    p.exp = Math.round(p.exp + amount * (this.state.items.pot > 0 ? 1.15 : 1));
  }

  /* ---- 進化 ---- */

  evolveCheck(p) {
    if (p.stage >= 4) return { ok: false, done: true, missing: [] };
    const req = STAGE_REQUIREMENTS[p.stage + 1];
    const days = this.ageDays(p);
    const missing = [];
    if (p.exp < req.exp) missing.push({ key: 'exp', label: '経験値', have: Math.floor(p.exp), need: req.exp });
    if (days < req.days) missing.push({ key: 'days', label: '育成日数', have: round1(days), need: req.days, unit: '日' });
    if (p.album.length < req.photos) {
      missing.push({ key: 'photos', label: '記録写真', have: p.album.length, need: req.photos, unit: '枚' });
    }
    if (p.care.health < 50) missing.push({ key: 'health', label: '健康', have: Math.round(p.care.health), need: 50 });
    return { ok: missing.length === 0, done: false, missing, req };
  }

  /** 次の進化までの見込み。実時間の目安つき */
  evolveEta(p) {
    const c = this.evolveCheck(p);
    if (c.done || c.ok) return null;
    let days = 0;
    for (const m of c.missing) {
      if (m.key === 'days') days = Math.max(days, m.need - m.have);
      if (m.key === 'exp') {
        // 健康なら概ね 1 ゲーム日で 18 EXP + 世話の分
        days = Math.max(days, (m.need - m.have) / 24);
      }
    }
    const blockers = c.missing.filter((m) => m.key === 'photos' || m.key === 'health');
    return { days: round1(days), real: this.realTimeText(days), blockers };
  }

  decideBranch(p) {
    const g = p.genes, base = p.baseGenes, care = this.careQuality(p);
    const cand = {
      compact: g.compact + (g.compact - base.compact) * 2.4 + (care > 70 ? 12 : 0),
      nishiki: g.variegation * 1.2 + (g.bloom - 50) * 0.3,
      fang: g.spine + (g.spine - base.spine) * 2.2,
      titan: g.vigor + (g.leaf - 50) * 0.6 + (p.metrics.diameter || 0) * 1.2,
    };
    return Object.entries(cand).sort((a, b) => b[1] - a[1])[0][0];
  }

  branchLean(p) {
    const g = p.genes, base = p.baseGenes, care = this.careQuality(p);
    const raw = {
      compact: g.compact + (g.compact - base.compact) * 2.4 + (care > 70 ? 12 : 0),
      nishiki: g.variegation * 1.2 + (g.bloom - 50) * 0.3,
      fang: g.spine + (g.spine - base.spine) * 2.2,
      titan: g.vigor + (g.leaf - 50) * 0.6 + (p.metrics.diameter || 0) * 1.2,
    };
    const total = Object.values(raw).reduce((a, b) => a + Math.max(1, b), 0);
    return Object.fromEntries(Object.entries(raw).map(([k, v]) => [k, Math.round((Math.max(1, v) / total) * 100)]));
  }

  evolve(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const check = this.evolveCheck(p);
    if (!check.ok) return { ok: false, message: '進化条件を満たしていません', missing: check.missing };
    const before = this.displayName(p);
    p.stage += 1;
    let branch = null;
    if (p.stage >= 3 && !p.branch) {
      p.branch = this.decideBranch(p);
      branch = BRANCHES[p.branch];
      p.genes[branch.stat] = Math.round(clamp(p.genes[branch.stat] + 16, 1, 100));
      p.baseGenes[branch.stat] = p.genes[branch.stat];
    }
    p.baseline = { diameter: p.metrics.diameter, stageAtDay: this.state.clock };
    p.events.unshift({
      t: Date.now(), day: round1(this.state.clock), type: 'evolve',
      text: `${before} → ${this.displayName(p)}`,
    });
    this.state.stats.evolutions++;
    this.state.tutorial.evolve = true;
    this.state.coins += 120 + p.stage * 60;
    this.registerDex(p);
    this.pushLog(`${this.displayName(p)} に進化！`);
    this.checkQuests();
    this.save();
    return { ok: true, plant: p, before, after: this.displayName(p), branch };
  }

  /* ---- 図鑑 ---- */

  registerDex(p) {
    const d = (this.state.dex[p.speciesId] ||= { seen: 1, forms: {}, stages: {}, firstAt: Date.now() });
    d.stages[p.stage] = true;
    if (p.branch) d.forms[p.branch] = true;
  }

  dexProgress() {
    const seen = Object.keys(this.state.dex).length;
    const forms = Object.values(this.state.dex).reduce((a, d) => a + Object.keys(d.forms || {}).length, 0);
    return {
      total: SPECIES.length, seen, forms,
      maxForms: SPECIES.length * BRANCH_KEYS.length,
      percent: Math.round((seen / SPECIES.length) * 100),
    };
  }

  /* ---- 導線: 次にやること ---- */

  nextAction() {
    const s = this.state;
    if (!s.plants.length) {
      return {
        step: 1, title: 'まずは株を1つ迎えよう',
        body: '無償で迎えられる品種が4つあります。棚に置いた瞬間から育成が始まります。',
        cta: { label: '株を迎える', action: 'adopt' },
      };
    }
    const byUrgency = [...s.plants].sort((a, b) => this.urgency(b) - this.urgency(a));
    const worst = byUrgency[0];

    if (worst.pest > 45) {
      return {
        step: null, title: `${worst.nickname} に害虫が出ている`,
        body: '放っておくと葉幅と締まりが削られます。殺虫剤で駆除してください。',
        cta: { label: '個体を開く', action: 'plant', param: worst.id }, tone: 'danger',
      };
    }
    if (worst.care.hydration < 15) {
      return {
        step: null, title: `${worst.nickname} が乾いている`,
        body: '適正間隔に近いタイミングで水をやると経験値が多くもらえます。',
        cta: { label: '水をやる', action: 'water', param: worst.id }, tone: 'warn',
      };
    }
    const evolvable = s.plants.find((p) => this.evolveCheck(p).ok);
    if (evolvable) {
      return {
        step: null, title: `${evolvable.nickname} が進化できる！`,
        body: `${STAGES[evolvable.stage + 1].ja} へ進化します。${evolvable.stage + 1 >= 3 && !evolvable.branch ? 'ここで系統が確定します。' : ''}`,
        cta: { label: '進化させる', action: 'evolve', param: evolvable.id }, tone: 'gold',
      };
    }
    const noPhoto = s.plants.find((p) => !p.album.length);
    if (noPhoto) {
      return {
        step: 2, title: `${noPhoto.nickname} の写真を記録しよう`,
        body: '実物の写真を1枚入れると、背景を落としてドット絵になり、その株の個性値が写真から決まります。',
        cta: { label: '写真を記録', action: 'photo', param: noPhoto.id },
      };
    }
    // 進化に写真が足りない株
    for (const p of s.plants) {
      const c = this.evolveCheck(p);
      const need = c.missing.find((m) => m.key === 'photos');
      if (need) {
        return {
          step: null, title: `${p.nickname} は写真があと ${need.need - need.have} 枚`,
          body: '成長の記録を残すほど早く進化します。',
          cta: { label: '写真を記録', action: 'photo', param: p.id },
        };
      }
    }
    // 待ち時間の案内
    const withEta = s.plants
      .map((p) => ({ p, eta: this.evolveEta(p) }))
      .filter((x) => x.eta)
      .sort((a, b) => a.eta.days - b.eta.days)[0];
    if (withEta) {
      return {
        step: null, title: `${withEta.p.nickname} の進化まであと ${withEta.eta.days} 日`,
        body: `実時間で ${withEta.eta.real}。水やりや実測で経験値を足すと、その分だけ早まります。`,
        cta: { label: '個体を開く', action: 'plant', param: withEta.p.id },
      };
    }
    return {
      step: null, title: '棚は落ち着いています',
      body: '品評会に出したり、ラボで交配したり、図鑑の空欄を埋めにいきましょう。',
      cta: { label: '品評会へ', action: 'nav', param: 'contest' },
    };
  }

  urgency(p) {
    return (p.care.hydration < 15 ? 3 : 0) + (p.pest > 45 ? 3 : 0) +
      (p.care.health < 50 ? 2 : 0) + (this.evolveCheck(p).ok ? 1 : 0);
  }

  /* ---- コミュニティ(端末内生成の推定値) ---- */

  communityFor(speciesId) {
    const sp = SPECIES_BY_ID[speciesId];
    const rnd = seededRandom(`${speciesId}:${Math.floor(Date.now() / (86400000 * 7))}`);
    const mine = this.state.plants.filter((p) => p.speciesId === speciesId);
    const myWater = mine.map((p) => this.avgWaterInterval(p)).filter(Boolean);
    return {
      growers: 40 + Math.round((rnd() * 900) / sp.rarity),
      waterMean: round1(sp.water + (rnd() - 0.5) * 2.2),
      luxMean: Math.round(sp.light * 1150 + (rnd() - 0.5) * 12000),
      hoursMean: round1(6 + (sp.light / 100) * 7 + (rnd() - 0.5) * 1.6),
      myWater: myWater.length ? round1(myWater.reduce((a, b) => a + b, 0) / myWater.length) : null,
    };
  }

  communityTotals() {
    const rnd = seededRandom(`totals:${Math.floor(Date.now() / (86400000 * 7))}`);
    const trainers = 4200 + Math.round(rnd() * 900);
    return {
      species: SPECIES.length, trainers,
      photos: trainers * 23 + this.state.stats.photos,
      mySpecies: Object.keys(this.state.dex).length,
      myPhotos: this.state.stats.photos,
    };
  }

  /* ---- 品評会 ---- */

  makeRival(league, salt = '') {
    const lg = this.LEAGUES[league];
    const rnd = seededRandom(`rival:${league}:${salt}`);
    const sp = SPECIES[Math.floor(rnd() * SPECIES.length)];
    const target = lg.min + 110 + rnd() * 170;
    const genes = {};
    for (const k of GENE_KEYS) {
      genes[k] = Math.round(clamp(sp.bias[k] * (0.7 + target / 900) + (rnd() - 0.5) * 20, 5, 100));
    }
    return {
      name: `${RIVAL_PREFIX[Math.floor(rnd() * RIVAL_PREFIX.length)]}の${sp.ja}`,
      speciesId: sp.id, genes, types: sp.types,
      stage: clamp(2 + Math.floor(league / 2), 0, 4),
      score: Math.round(target),
    };
  }

  /** タイプ相性: 審査員の好みに合うと加点、苦手だと減点 */
  typeBonus(types, judgeLikes) {
    if (types.includes(judgeLikes)) return 1.35;
    const like = TYPES[judgeLikes];
    if (like && types.some((t) => like.strong.includes(t))) return 0.78;
    if (like && types.some((t) => like.weak.includes(t))) return 1.12;
    return 1;
  }

  contest(id, league) {
    const p = this.plant(id);
    const lg = this.LEAGUES[league];
    if (!p || !lg) return { ok: false };
    if (this.score(p) < lg.min) return { ok: false, message: `${lg.ja} は総合スコア ${lg.min} 以上が必要です` };

    const salt = `${p.id}:${this.state.stats.contests}`;
    const rnd = seededRandom(`judge:${salt}`);
    const judge = JUDGES[Math.floor(rnd() * JUDGES.length)];
    const rival = this.makeRival(league, salt);
    const myBonus = this.typeBonus(this.typesOf(p), judge.likes);
    const rivalBonus = this.typeBonus(rival.types, judge.likes);
    const g = p.genes;

    const categories = [
      { ja: '姿', mine: (g.compact * 1.4 + g.leaf * 0.6) / 2, theirs: (rival.genes.compact * 1.4 + rival.genes.leaf * 0.6) / 2 },
      { ja: '気迫', mine: g.spine, theirs: rival.genes.spine },
      { ja: '色', mine: (g.variegation + g.bloom) / 2, theirs: (rival.genes.variegation + rival.genes.bloom) / 2 },
      { ja: '貫禄', mine: g.vigor * 0.6 + p.stage * 14, theirs: rival.genes.vigor * 0.6 + rival.stage * 14 },
      { ja: '管理', mine: this.careQuality(p), theirs: 45 + league * 9 },
    ].map((c) => {
      const mine = Math.round(c.mine * myBonus);
      const theirs = Math.round(c.theirs * rivalBonus);
      return { ja: c.ja, mine, theirs, win: mine >= theirs };
    });

    const wins = categories.filter((c) => c.win).length;
    const won = wins >= 3;
    const reward = won ? lg.reward : Math.round(lg.reward * 0.25);
    this.state.coins += reward;
    this.state.stats.contests++;
    if (won) {
      this.state.stats.contestWins++;
      this.state.stats.league = Math.max(this.state.stats.league, Math.min(league + 1, this.LEAGUES.length - 1));
      this.gainExp(p, 60 + league * 40);
    }
    p.events.unshift({
      t: Date.now(), day: round1(this.state.clock), type: 'contest',
      text: `${lg.ja} ${won ? '優勝' : `${wins}/5部門`}(審査員: ${judge.ja})`,
    });
    this.pushLog(`${lg.ja}: ${won ? '優勝' : '入賞ならず'} — ${p.nickname}`);
    this.checkQuests();
    this.save();
    return { ok: true, won, wins, categories, rival, reward, league: lg, judge, myBonus };
  }

  /* ---- ラボ ---- */

  cross(idA, idB) {
    const a = this.plant(idA), b = this.plant(idB);
    if (!a || !b || a.id === b.id) return { ok: false, message: '異なる2株を選んでください' };
    if (a.stage < 3 || b.stage < 3) return { ok: false, message: '交配には成株以上が2株必要です' };
    if (this.state.items.seed <= 0) return { ok: false, message: '交配用種子がありません(ショップで購入できます)' };
    this.state.items.seed--;

    const rnd = seededRandom(`cross:${a.id}:${b.id}:${Date.now()}`);
    const genes = {};
    for (const k of GENE_KEYS) {
      genes[k] = Math.round(clamp((a.genes[k] + b.genes[k]) / 2 + (rnd() - 0.5) * 22, 1, 100));
    }
    let mutation = null;
    const roll = rnd();
    if (roll < 0.09) { genes.variegation = clamp(genes.variegation + 38, 1, 100); mutation = '斑入りが覚醒した'; }
    else if (roll < 0.15) { genes.vigor = clamp(genes.vigor + 30, 1, 100); genes.leaf = clamp(genes.leaf + 16, 1, 100); mutation = '巨大化の素質が出た'; }
    else if (roll < 0.2) { genes.compact = clamp(genes.compact + 32, 1, 100); mutation = '極端な矮性が出た'; }

    const child = createPlant(rnd() < 0.5 ? a.speciesId : b.speciesId, {
      genes, clock: this.state.clock,
      nickname: `${SPECIES_BY_ID[a.speciesId].ja}×${SPECIES_BY_ID[b.speciesId].ja}`,
      parents: [
        { id: a.id, name: this.displayName(a), speciesId: a.speciesId },
        { id: b.id, name: this.displayName(b), speciesId: b.speciesId },
      ],
      hybrid: { a: a.speciesId, b: b.speciesId },
      gen: Math.max(a.gen, b.gen) + 1,
    });
    if (mutation) child.events.unshift({ t: Date.now(), day: round1(this.state.clock), type: 'mutation', text: mutation });
    this.state.plants.push(child);
    this.registerDex(child);
    this.pushLog(`交配成功: ${child.nickname}${mutation ? ` — ${mutation}` : ''}`);
    this.checkQuests();
    this.save();
    return { ok: true, child, mutation };
  }

  /* ---- 経済 ---- */

  buy(itemId) {
    const item = SHOP.find((i) => i.id === itemId);
    if (!item) return { ok: false };
    if (this.state.coins < item.price) return { ok: false, message: 'コインが足りません' };
    this.state.coins -= item.price;
    this.state.items[item.id] = (this.state.items[item.id] || 0) + 1;
    this.save();
    return { ok: true, message: `${item.ja} を購入しました` };
  }

  sell(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const price = Math.round(this.score(p) * 1.1 + this.species(p).rarity * 40);
    this.state.coins += price;
    this.state.plants = this.state.plants.filter((x) => x.id !== id);
    this.pushLog(`${this.displayName(p)} を ${price} コインで譲渡した`);
    this.save();
    return { ok: true, price };
  }

  adopt(speciesId) {
    const p = createPlant(speciesId, { clock: this.state.clock });
    this.state.plants.push(p);
    this.state.tutorial.adopt = true;
    this.registerDex(p);
    this.pushLog(`${SPECIES_BY_ID[speciesId].ja} を迎えた`);
    this.checkQuests();
    this.save();
    return p;
  }

  rename(id, name) {
    const p = this.plant(id);
    if (p) { p.nickname = String(name).slice(0, 24) || p.nickname; this.save(); }
  }

  /* ---- クエスト ---- */

  checkQuests() {
    const done = [];
    let earned = 0;
    for (const q of QUESTS) {
      if (this.state.quests[q.id]) continue;
      let ok = false;
      try { ok = q.check(this.state); } catch { ok = false; }
      if (ok) {
        this.state.quests[q.id] = { at: Date.now() };
        this.state.coins += q.reward;
        earned += q.reward;
        done.push(q);
      }
    }
    if (done.length) this.emit('quest', { done, earned });
    return done;
  }

  /* ---- 助言 ---- */

  advice(p) {
    const sp = this.species(p);
    const season = this.season();
    const out = [];
    if (p.pest > 35) out.push({ level: 'danger', text: `害虫レベル ${Math.round(p.pest)}。放置すると葉幅と締まりが削られます。` });
    if (p.care.hydration < 12) out.push({ level: 'warn', text: '完全に乾いています。いま水をやると経験値が多く入ります。' });
    else if (p.care.hydration > 102) out.push({ level: 'warn', text: '過湿ぎみ。根腐れと害虫のリスクが上がっています。' });
    if (p.light < sp.light - 20) out.push({ level: 'warn', text: `日照不足。徒長して締まりが落ちています(適正 ${sp.light})。` });
    if (p.light > sp.light + 20) out.push({ level: 'warn', text: `日照が強すぎます。葉焼けの恐れ(適正 ${sp.light})。` });
    if (p.care.nutrition < 18) out.push({ level: 'info', text: '養分が切れかけています。活力剤で成長力の伸びを支えられます。' });
    if (isSlowSeason(sp, season)) out.push({ level: 'info', text: `いまは${season.ja}。${sp.ja}にとっては成長が緩む時期です(あと ${season.daysLeft} 日)。` });
    if (!p.album.length) out.push({ level: 'info', text: '写真を1枚入れると、ドット絵と個性値が実物に同期します。' });
    if (this.evolveCheck(p).ok) out.push({ level: 'good', text: '進化条件を満たしています。' });
    return out;
  }

  /* ---- 体験用 ---- */
  warp(days) {
    this.state.clock += days;
    this.state.lastRealMs = Date.now();
    this.tick(true);
    this.pushLog(`時間を ${days} ゲーム日進めた`);
    this.save();
  }

  setPace(key) {
    if (!PACES[key]) return;
    this.state.settings.pace = key;
    this.state.lastRealMs = Date.now();
    this.save();
  }

  reset() {
    this.state = freshState();
    this.save();
  }
}

const game = new Game();


return { seasonAt, growthFactor, isSlowSeason, createPlant, game, SPECIES, SPECIES_BY_ID, STAGES, STAGE_REQUIREMENTS, BRANCHES, BRANCH_KEYS, SHOP, QUESTS, STARTERS, PACES, NATURES, TYPES, JUDGES };
})();

const JP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,monospace';

const INK = '#e8f6ec';
const DIM = '#7fa694';
const BG0 = '#061410';
const BG1 = '#0d2119';

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function backdrop(ctx, w, h, accent) {
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, BG0);
  g.addColorStop(0.55, BG1);
  g.addColorStop(1, '#08190f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 目に見えるか見えないかの方眼(標本台紙のイメージ)
  ctx.strokeStyle = '#ffffff08';
  ctx.lineWidth = 1;
  const step = Math.round(w / 26);
  for (let x = step; x < w; x += step) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
  }
  for (let y = step; y < h; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
  }
  // 上端のスペクトル帯
  const bar = ctx.createLinearGradient(0, 0, w, 0);
  bar.addColorStop(0, accent);
  bar.addColorStop(0.5, '#ffd166');
  bar.addColorStop(1, '#f28fb0');
  ctx.fillStyle = bar;
  ctx.fillRect(0, 0, w, Math.max(4, Math.round(h / 190)));
}

function label(ctx, text, x, y, { size = 22, color = DIM, font = MONO, align = 'left', spacing = 0 } = {}) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = spacing ? 'left' : align;
  ctx.textBaseline = 'alphabetic';
  if (spacing) {
    let cx = x;
    if (align === 'center') {
      const total = [...text].reduce((a, ch) => a + ctx.measureText(ch).width + spacing, -spacing);
      cx = x - total / 2;
    } else if (align === 'right') {
      const total = [...text].reduce((a, ch) => a + ctx.measureText(ch).width + spacing, -spacing);
      cx = x - total;
    }
    for (const ch of text) {
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + spacing;
    }
  } else {
    ctx.fillText(text, x, y);
  }
  ctx.restore();
}

function panel(ctx, x, y, w, h, accent = '#5fe3c0') {
  ctx.fillStyle = '#0c1f18cc';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ffffff14';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = accent;
  ctx.fillRect(x, y, 4, h);
}

function drawSprite(ctx, img, cx, cy, size, accent) {
  const glow = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.72);
  glow.addColorStop(0, `${accent}33`);
  glow.addColorStop(1, '#00000000');
  ctx.fillStyle = glow;
  ctx.fillRect(cx - size, cy - size, size * 2, size * 2);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
  ctx.imageSmoothingEnabled = true;
}

function radar(ctx, cx, cy, r, genes, accent) {
  const keys = GENE_KEYS;
  const n = keys.length;
  const pt = (i, v) => {
    const a = (-Math.PI / 2) + (i / n) * Math.PI * 2;
    return [cx + Math.cos(a) * r * v, cy + Math.sin(a) * r * v];
  };
  ctx.strokeStyle = '#ffffff18';
  ctx.lineWidth = 1.5;
  for (const ring of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const [x, y] = pt(i % n, ring);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, Math.max(0.06, genes[keys[i]] / 100));
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = `${accent}44`;
  ctx.fill();
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, 1.2);
    label(ctx, GENES[keys[i]].ja, x, y + 6, { size: r * 0.15, color: DIM, font: JP, align: 'center' });
  }
}

function statRow(ctx, x, y, w, name, value, accent) {
  label(ctx, name, x, y, { size: 22, color: DIM, font: JP });
  label(ctx, value, x + w, y, { size: 26, color: INK, font: MONO, align: 'right' });
  ctx.fillStyle = '#ffffff12';
  ctx.fillRect(x, y + 12, w, 1);
}

async function spriteImage(plant, override) {

    if (!sp) return null;
    data = proceduralSprite(sp, plant.genes, plant.seed || plant.id, plant.stage);
  }
  return loadImageFromUrl(data);
}

  label(ctx, `${entries.length} RECORDS`, W - 44, 78, { size: 22, color: DIM, align: 'right', spacing: 3 });

  const t0 = entries[0].t;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const x = 40 + i * cell;
    panel(ctx, x, 120, cell - 20, 380, accent);

    if (spriteData) {

    const dayN = Math.max(0, Math.round((e.t - t0) / 86400000));
    label(ctx, `DAY ${dayN}`, x + (cell - 20) / 2, 430, { size: 24, color: INK, align: 'center', spacing: 3 });
    label(ctx, new Date(e.t).toISOString().slice(0, 10), x + (cell - 20) / 2, 462, {
      size: 19, color: DIM, align: 'center', spacing: 1,
    });

      label(ctx, `${e.metrics.diameter}cm`, x + (cell - 20) / 2, 488, { size: 19, color: accent, align: 'center' });
    }
    if (i > 0) {
      label(ctx, '›', x - 12, 285, { size: 40, color: DIM, align: 'center' });
    }
  }
  label(ctx, 'PIXAGAVE', W / 2, H - 24, { size: 22, color: DIM, align: 'center', spacing: 6 });
  return c.toDataURL('image/png');
}

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const pct = (v, max = 100) => `${clamp((v / max) * 100, 0, 100).toFixed(1)}%`;

/* ---------- 文言 ---------- */

function t(key, vars) {
  const lang = game.state.lang || 'ja';
  let s = (I18N[lang] && I18N[lang][key]) || I18N.ja[key] || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}
const isJa = () => (game.state.lang || 'ja') === 'ja';

/* 品種名・説明・分類は言語で切り替える */
const spName = (sp) => (isJa() ? sp.ja : sp.en);
const spDex = (sp) => (isJa() ? sp.dex : (SPECIES_EN[sp.id]?.dex || sp.dex));
const spCategory = (sp) => (isJa() ? sp.category : (SPECIES_EN[sp.id]?.category || sp.category));
const worldName = (w) => (isJa() ? WORLDS[w].ja : WORLDS[w].en);
const stageName = (i) => (isJa() ? STAGES[i].ja : STAGES[i].en);
const branchName = (k) => (isJa() ? BRANCHES[k].ja : BRANCHES[k].en);
const geneName = (k) => (isJa() ? GENES[k].ja : GENES[k].en);

const fmtDate = (ts) => new Date(ts).toLocaleDateString(isJa() ? 'ja-JP' : 'en-GB', { month: 'numeric', day: 'numeric' });

function toast(message, kind = '') {
  if (!message) return;
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = message;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3400);
}

/* ---------- モーダル ---------- */

let modalCleanup = null;

function openModal(title, bodyHtml, onMount, opts = {}) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"
      ${opts.width ? `style="width:min(${opts.width},100%)"` : ''}>
    <header><h2>${esc(title)}</h2><button class="btn sm ghost" data-close>${esc(t('action.close'))}</button></header>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
  $('#modal-root').appendChild(back);
  back.addEventListener('click', (e) => {
    if (e.target === back || e.target.hasAttribute('data-close')) closeModal();
  });
  const onKey = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', onKey);
  modalCleanup = () => document.removeEventListener('keydown', onKey);
  if (onMount) onMount($('.modal-body', back), back);
  mountSprites(back);
  return back;
}

function closeModal() {
  if (modalCleanup) { modalCleanup(); modalCleanup = null; }
  $('#modal-root').innerHTML = '';
}

/* ---------- スプライト ---------- */

const charCache = new Map();

async function plantSpriteData(p, stage = p.stage) {
  if (p.spriteId) {
    const stored = await getImage(p.spriteId);
    if (stored) return stored;
  }
  return proceduralSprite(game.species(p), p.genes, p.seed || p.id, stage);
}

async function characterUrl(p, stage = p.stage, branch = p.branch) {
  const key = `${p.id}:${p.spriteId || 'proc'}:${stage}:${branch}:${Math.round(p.pest / 25)}`;
  if (charCache.has(key)) return charCache.get(key);
  const img = await loadImageFromUrl(await plantSpriteData(p, stage));
  const url = composeCharacter(img, {
    stage, branch, genes: p.genes, world: game.species(p).world, pest: p.pest, seed: p.seed || p.id,
  }).toDataURL('image/png');
  charCache.set(key, url);
  return url;
}

async function speciesCharUrl(sp, stage = 3) {
  const key = `sp:${sp.id}:${stage}`;
  if (charCache.has(key)) return charCache.get(key);
  const img = await loadImageFromUrl(proceduralSprite(sp, sp.bias, `dex:${sp.id}`, stage));
  const url = composeCharacter(img, {
    stage, branch: null, genes: sp.bias, world: sp.world, pest: 0, seed: sp.id,
  }).toDataURL('image/png');
  charCache.set(key, url);
  return url;
}

async function mountSprites(root = document) {
  for (const el of $$('img[data-plant]', root)) {
    const p = game.plant(el.dataset.plant);
    if (!p) continue;
    const stage = el.dataset.stage !== undefined ? Number(el.dataset.stage) : p.stage;
    const branch = el.dataset.branch || (stage >= 3 ? p.branch : null);
    try { el.src = await characterUrl(p, stage, branch); } catch { /* noop */ }
  }
  for (const el of $$('img[data-species]', root)) {
    const sp = SPECIES_BY_ID[el.dataset.species];
    if (sp) el.src = await speciesCharUrl(sp, el.dataset.stage ? Number(el.dataset.stage) : 3);
  }
  for (const el of $$('img[data-image]', root)) {
    const data = await getImage(el.dataset.image);
    if (data) el.src = data;
  }
}

const accentOf = (p) => (p.branch ? BRANCHES[p.branch].color : WORLDS[game.species(p).world].color);

/* ---------- 共通パーツ ---------- */

function meter(label, value, max, color) {
  return `<div class="meter">
    <div class="lab"><span>${esc(label)}</span><b>${Math.round(value)}</b></div>
    <div class="track"><span style="--mc:${color};width:${pct(value, max)}"></span></div>
  </div>`;
}

const typeBadges = (types) => types.map((ty) =>
  `<span class="type-badge" style="background:${TYPES[ty]?.color || '#888'}">${esc(ty)}</span>`).join(' ');

function plantCard(p) {
  const accent = accentOf(p);
  const alerts = [];
  if (game.evolveCheck(p).ok) alerts.push(isJa() ? '進化可' : 'Ready');
  else if (p.care.hydration < 15) alerts.push(isJa() ? '水切れ' : 'Dry');
  else if (p.pest > 45) alerts.push(isJa() ? '害虫' : 'Pests');
  return `<button class="plant-card" data-open-plant="${p.id}" style="--accent:${accent}">
    ${alerts.length ? `<span class="alert">${esc(alerts[0])}</span>` : ''}
    <div class="sprite-frame" style="--accent:${accent}">
      <img class="sprite" data-plant="${p.id}" alt="${esc(p.nickname)}" />
    </div>
    <div>
      <div class="name">${esc(p.nickname)}</div>
      <div class="meta">${esc(stageName(p.stage))}${p.branch ? ` · ${esc(branchName(p.branch))}` : ''} · ${game.score(p)}pts</div>
    </div>
    <div class="track sm"><span style="--mc:var(--info);width:${pct(p.care.hydration, 110)}"></span></div>
  </button>`;
}

function evolutionLine(p) {
  const nodes = STAGES.map((st, i) => {
    const reached = i <= p.stage;
    const showBranch = i >= 3 ? p.branch : null;
    const name = i > p.stage ? '???' : (i >= 3 && p.branch ? `${stageName(i)}・${branchName(p.branch)}` : stageName(i));
    return `<div class="evo-node ${i === p.stage ? 'cur' : ''} ${reached ? '' : 'locked'}">
      <div class="sprite-frame" style="--accent:${accentOf(p)}">
        <img class="sprite" data-plant="${p.id}" data-stage="${i}" ${showBranch ? `data-branch="${showBranch}"` : ''} alt="" />
      </div>
      <div class="nm">${esc(name)}</div>
    </div>`;
  }).join('<span class="evo-arrow">▶</span>');

  const lean = p.stage < 3 ? game.branchLean(p) : null;
  return `<div class="evoline">
    <div class="chain">${nodes}</div>
    ${p.branch
      ? `<p class="hint">${esc(t('evolve.fixed', { branch: branchName(p.branch) }))} ${isJa() ? esc(BRANCHES[p.branch].ja_desc) : ''}</p>`
      : `<p class="hint">${esc(t('evolve.branchHint'))}</p>
         <div class="evo-branches">
           ${Object.entries(lean).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
             <div class="meter">
               <div class="lab"><span style="color:${BRANCHES[k].color}">${esc(branchName(k))}</span><b>${v}%</b></div>
               <div class="track sm"><span style="--mc:${BRANCHES[k].color};width:${v}%"></span></div>
             </div>`).join('')}
         </div>`}
  </div>`;
}

/* ---------- ホーム ---------- */

function todoList() {
  const s = game.state;
  const tut = s.tutorial;
  const firstPlant = s.plants[0];
  const steps = [
    { k: 'adopt', text: t('todo.adopt'), done: tut.adopt || s.plants.length > 0, cta: 'data-adopt-dialog', label: t('action.adopt') },
    { k: 'photo', text: t('todo.photo'), done: tut.photo, cta: firstPlant ? `data-photo="${firstPlant.id}"` : '', label: t('action.photo') },
    { k: 'water', text: t('todo.water'), done: tut.water, cta: firstPlant ? `data-water="${firstPlant.id}"` : '', label: t('action.water') },
    { k: 'evolve', text: t('todo.evolve'), done: tut.evolve, cta: firstPlant ? `data-open-plant="${firstPlant.id}"` : '', label: t('action.open') },
    { k: 'contest', text: t('todo.contest'), done: s.stats.contests > 0, cta: 'data-nav="contest"', label: t('nav.contest') },
  ];
  if (steps.every((x) => x.done)) return '';
  const nowIdx = steps.findIndex((x) => !x.done);
  return `<section class="panel">
    <h2>${esc(t('home.todo'))}</h2>
    <p class="hint" style="margin:-6px 0 12px">${esc(t('todo.title'))}</p>
    <ol class="todo">
      ${steps.map((x, i) => `<li class="${x.done ? 'done' : ''} ${i === nowIdx ? 'now' : ''}">
        <span class="no">${x.done ? '✓' : i + 1}</span>
        <span class="txt">${esc(x.text)}</span>
        ${!x.done && i === nowIdx && x.cta ? `<button class="btn sm gold go" ${x.cta}>${esc(x.label)}</button>` : ''}
      </li>`).join('')}
    </ol>
  </section>`;
}

  return `

        <div>
          <div class="sprite-frame hero" style="--accent:${accent}">
            <img class="sprite" data-plant="${p.id}" alt="${esc(p.nickname)}" /></div>
          <div style="text-align:center;margin-top:12px">
            <b class="serif" style="font-size:18px">${esc(stageName(p.stage))}${p.branch ? `・${esc(branchName(p.branch))}` : ''}</b>

      <section class="panel">
        <h2>${esc(t('sec.advice'))}</h2>
        <ul class="advice">
          ${game.advice(p).map((x) => `<li class="${x.level}">${esc(x.text)}</li>`).join('')}

    <div class="grid g2">

           ['lux', `${game.estimatedLux(p).toLocaleString()}`, `${community.luxMean.toLocaleString()}`, game.estimatedLux(p), community.luxMean],
        ].map(([label, mine, theirs, mv, tv]) => `
          <div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)">

            <div class="track sm" style="margin-top:3px"><span style="--mc:var(--line-2);width:${pct(tv, Math.max(mv || 0, tv) * 1.25)}"></span></div>

    <section class="panel">
      <div class="row" style="justify-content:space-between">

        <div class="row">
          <button class="btn sm ghost" data-export="card" data-target="${p.id}">Card</button>

        </div>
      </div>
      ${a && b && a.id !== b.id ? `
        <div class="grid g2" style="margin-top:18px">
          <div class="compare" id="compare" style="--split:50%">
            <img data-image="${a.photoId}" alt="" /><img class="after" data-image="${b.photoId}" alt="" />
