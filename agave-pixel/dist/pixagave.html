<title>PIXAGAVE — 育てた実物が、そのままキャラクターになる</title>
<style>
/* PIXAGAVE — design system
 * 夜の温室をイメージしたダークテーマ。情報は「標本カード」として並べる。
 */

:root {
  --bg: #061410;
  --bg-deep: #030b08;
  --panel: #0c1e17;
  --panel-2: #10281f;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.18);
  --ink: #e8f6ec;
  --dim: #7fa694;
  --dim-2: #557a6c;

  --agave: #5fe3c0;
  --caudex: #f2b05c;
  --succulent: #f28fb0;
  --gold: #ffd166;
  --danger: #ff7a7a;
  --accent: var(--agave);

  --r: 14px;
  --r-sm: 8px;
  --rail: 232px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-deep);
  color: var(--ink);
  font-family: var(--jp);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body::before {
  /* 上端の光のスペクトル */
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, var(--agave), var(--gold) 45%, var(--succulent) 75%, #8ab6ff);
  z-index: 100;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
a { color: var(--agave); }

.mono { font-family: var(--mono); }
.tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---------- レイアウト ---------- */

.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  background:
    radial-gradient(900px 600px at 12% -10%, #0f3327 0%, transparent 62%),
    radial-gradient(700px 500px at 100% 0%, #16342a 0%, transparent 55%),
    var(--bg);
}

.rail {
  border-right: 1px solid var(--line);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  background: linear-gradient(180deg, #08191300, #08191388);
  backdrop-filter: blur(6px);
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 16px;
}
.brand .mark {
  width: 34px; height: 34px; flex: none;
  image-rendering: pixelated;
  border-radius: 6px;
  background: linear-gradient(140deg, #123a2c, #0a241b);
  border: 1px solid var(--line-strong);
}
.brand strong {
  font-family: var(--mono);
  letter-spacing: 0.18em;
  font-size: 14px;
}
.brand span { display: block; font-size: 10px; color: var(--dim-2); letter-spacing: 0.1em; }

.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 10px 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  color: var(--dim);
  text-align: left;
  transition: background 0.15s, color 0.15s;
}
.rail nav button .ico { width: 18px; text-align: center; opacity: 0.85; }
.rail nav button:hover { background: #ffffff08; color: var(--ink); }
.rail nav button[aria-current="true"] {
  background: linear-gradient(90deg, #5fe3c01f, transparent);
  border-color: #5fe3c033;
  color: var(--ink);
}
.rail nav button[aria-current="true"] .ico { color: var(--agave); }

.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.wallet {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: #ffffff06;
}
.wallet b { font-family: var(--mono); color: var(--gold); }

.main { min-width: 0; padding: 26px 30px 90px; }

.topbar {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.topbar h1 { margin: 2px 0 0; font-size: 26px; letter-spacing: 0.01em; }
.topbar .sub { color: var(--dim); font-size: 13px; }

/* ---------- 汎用パーツ ---------- */

.card {
  background: linear-gradient(160deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  position: relative;
  overflow: hidden;
}
.card::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}
.card h2, .card h3 { margin: 0 0 12px; font-size: 15px; letter-spacing: 0.02em; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn {
  border: 1px solid var(--line-strong);
  background: #ffffff0a;
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 9px 14px;
  font-size: 13px;
  letter-spacing: 0.03em;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
}
.btn:hover { background: #ffffff16; border-color: var(--line-strong); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(160deg, #1b5c4a, #10453a);
  border-color: #5fe3c055;
  color: #d8fff2;
}
.btn.primary:hover { background: linear-gradient(160deg, #21725b, #135045); }
.btn.gold { border-color: #ffd16655; color: var(--gold); background: #ffd1661a; }
.btn.danger { border-color: #ff7a7a44; color: var(--danger); background: #ff7a7a12; }
.btn.sm { padding: 6px 10px; font-size: 12px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  color: var(--dim);
}
.chip.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* メーター(ドット区切り) */
.meter { display: grid; gap: 5px; }
.meter .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
.meter .lab b { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.track {
  height: 9px;
  border-radius: 3px;
  background: #ffffff0e;
  overflow: hidden;
  position: relative;
}
.track > span {
  display: block; height: 100%;
  background: var(--mc, var(--agave));
  box-shadow: 0 0 12px color-mix(in srgb, var(--mc, var(--agave)) 55%, transparent);
  transition: width 0.4s ease;
}
.track::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 6px, #06141033 6px 8px);
  pointer-events: none;
}

/* スプライト */
.sprite {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  width: 100%;
  height: auto;
}
.sprite-frame {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--r-sm);
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
    repeating-conic-gradient(#ffffff05 0% 25%, transparent 0% 50%) 0 0 / 12px 12px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 6px;
  overflow: hidden;
}

/* ---------- 株カード ---------- */

.plant-card {
  background: linear-gradient(165deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
  display: grid;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s;
  text-align: left;
  width: 100%;
}
.plant-card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow: 0 14px 34px #00120c66;
}
.plant-card .name { font-size: 14px; font-weight: 600; }
.plant-card .meta { font-size: 11px; color: var(--dim); font-family: var(--mono); letter-spacing: 0.06em; }
.plant-card .bars { display: grid; gap: 4px; }
.plant-card .mini { height: 4px; border-radius: 2px; background: #ffffff0e; overflow: hidden; }
.plant-card .mini > span { display: block; height: 100%; background: var(--mc); }

.badge-alert {
  position: absolute; top: 8px; right: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 10px var(--danger);
}

/* ---------- 詳細 ---------- */

.detail-hero {
  display: grid;
  grid-template-columns: minmax(200px, 300px) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}
.stage-track { display: flex; gap: 6px; align-items: center; margin: 10px 0 4px; }
.stage-track .node {
  flex: 1;
  height: 26px;
  border-radius: 4px;
  border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 10px;
  color: var(--dim-2);
  background: #ffffff05;
}
.stage-track .node.done { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.stage-track .node.cur { box-shadow: 0 0 0 1px var(--accent) inset, 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent); color: var(--ink); }

.gene-list { display: grid; gap: 8px; }
.gene-row { display: grid; grid-template-columns: 74px 1fr 40px; gap: 10px; align-items: center; font-size: 12px; }
.gene-row .val { font-family: var(--mono); text-align: right; color: var(--dim); }
.gene-row .delta { color: var(--agave); font-size: 10px; }

.advice { display: grid; gap: 8px; }
.advice li {
  list-style: none;
  padding: 9px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  font-size: 13px;
  background: #ffffff05;
  border-left-width: 3px;
}
.advice li.warn { border-left-color: var(--gold); }
.advice li.danger { border-left-color: var(--danger); }
.advice li.good { border-left-color: var(--agave); }
.advice li.info { border-left-color: var(--dim-2); }

.timeline { display: grid; gap: 0; }
.timeline .item {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.timeline .when { font-family: var(--mono); font-size: 11px; color: var(--dim-2); }
.timeline .thumb { width: 84px; border-radius: 6px; border: 1px solid var(--line); }

/* 比較スライダー */
.compare {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--line);
  user-select: none;
  touch-action: none;
}
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .after { clip-path: inset(0 0 0 var(--split, 50%)); }
.compare .handle {
  position: absolute; top: 0; bottom: 0; left: var(--split, 50%);
  width: 2px; background: var(--agave); box-shadow: 0 0 14px var(--agave);
}
.compare .handle::after {
  content: "◄ ►"; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 10px; color: #04140f; background: var(--agave);
  padding: 3px 6px; border-radius: 999px; letter-spacing: 0.05em;
}
.compare .cap {
  position: absolute; bottom: 8px; padding: 3px 8px; border-radius: 4px;
  background: #04140fcc; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
}
.compare .cap.l { left: 8px; }
.compare .cap.r { right: 8px; }

/* ---------- 図鑑 ---------- */

.dex-cell {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 10px;
  background: #ffffff05;
  text-align: center;
  cursor: pointer;
}
.dex-cell.locked { opacity: 0.4; filter: grayscale(1); }
.dex-cell .no { font-family: var(--mono); font-size: 10px; color: var(--dim-2); }
.dex-cell .nm { font-size: 12px; margin-top: 4px; }
.forms { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
.forms i {
  width: 7px; height: 7px; border-radius: 2px; display: block;
  background: #ffffff14;
}

/* ---------- モーダル / トースト ---------- */

.modal-back {
  position: fixed; inset: 0;
  background: #020b07d0;
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 60;
  animation: fade 0.16s ease;
}
.modal {
  width: min(720px, 100%);
  max-height: 88vh;
  overflow: auto;
  background: linear-gradient(160deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  padding: 20px;
}
.modal header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal h2 { margin: 0; font-size: 17px; }

.toasts {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
  display: grid; gap: 8px; z-index: 80; width: min(440px, calc(100vw - 32px));
}
.toast {
  background: #0c241bee;
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--agave);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  font-size: 13px;
  animation: rise 0.2s ease;
}
.toast.bad { border-left-color: var(--danger); }
.toast.gold { border-left-color: var(--gold); }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- 進化演出 ---------- */

.evolve-stage {
  display: grid; place-items: center; gap: 14px; padding: 10px 0 4px;
  text-align: center;
}
.evolve-sprites { display: flex; align-items: center; gap: 18px; }
.evolve-sprites .sprite-frame { width: 140px; }
.evolve-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 70;
  background: radial-gradient(circle at 50% 45%, #ffffff, #5fe3c0 30%, transparent 62%);
  opacity: 0;
  animation: flash 1.1s ease;
}
@keyframes flash {
  0% { opacity: 0; }
  22% { opacity: 0.85; }
  100% { opacity: 0; }
}
.arrow-evolve { font-size: 26px; color: var(--agave); animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ---------- フォーム ---------- */

.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--dim); }
.field input[type="text"], .field input[type="number"], .field select, .field textarea {
  background: #ffffff08;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 9px 11px;
  width: 100%;
}
.field input[type="range"] { width: 100%; accent-color: var(--agave); }
.hint { font-size: 11px; color: var(--dim-2); }

.dropzone {
  border: 1px dashed var(--line-strong);
  border-radius: var(--r);
  padding: 26px;
  text-align: center;
  color: var(--dim);
  background: #ffffff04;
  cursor: pointer;
}
.dropzone.over { border-color: var(--agave); background: #5fe3c012; color: var(--ink); }

/* ---------- 下部ナビ(モバイル) ---------- */

.tabbar { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .main { padding: 18px 16px 96px; }
  .detail-hero { grid-template-columns: 1fr; }
  .tabbar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #061410f2;
    border-top: 1px solid var(--line);
    backdrop-filter: blur(10px);
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    background: none; border: 0; color: var(--dim);
    padding: 9px 2px 8px;
    display: grid; gap: 2px; justify-items: center;
    font-size: 10px;
  }
  .tabbar button .ico { font-size: 16px; }
  .tabbar button[aria-current="true"] { color: var(--agave); }
  .mobile-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
}
@media (min-width: 901px) { .mobile-head { display: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

<script type="module">
/* ---- data.js ---- */
const __m_data = (() => {

/* ---- store.js ---- */
const __m_store = (() => {

/* PIXAGAVE — 永続化層
 * ゲーム状態は localStorage、画像(元写真 / スプライト)は IndexedDB。
 * 画像を localStorage に入れると 5MB 制限を即座に超えるため分離している。
 */

const DB_NAME = 'pixagave';
const DB_VERSION = 1;
const IMG_STORE = 'images';
const SAVE_KEY = 'pixagave.save.v1';

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in globalThis)) {
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IMG_STORE)) {
        db.createObjectStore(IMG_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

/* IndexedDB が使えない環境(プライベートモード等)向けのメモリフォールバック */
const memoryImages = new Map();

async function putImage(key, dataUrl) {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).put(dataUrl, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    memoryImages.set(key, dataUrl);
  }
  return key;
}

async function getImage(key) {
  if (!key) return null;
  if (memoryImages.has(key)) return memoryImages.get(key);
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).get(key);
      req.onsuccess = () => resolve(req.result ?? null);
      req.onerror = () => reject(req.error);
    });
  } catch {
    return null;
  }
}

async function deleteImage(key) {
  memoryImages.delete(key);
  try {
    const db = await openDB();
    await new Promise((resolve) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).delete(key);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch {
    /* noop */
  }
}

async function allImageKeys() {
  try {
    const db = await openDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  } catch {
    return [...memoryImages.keys()];
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function writeSave(state) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    return true;
  } catch (err) {
    console.warn('[pixagave] save failed', err);
    return false;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch {
    /* noop */
  }
}

/* 書き出し: 状態 + 画像をひとつの JSON にまとめる(機種変更・バックアップ用) */
async function exportAll(state) {
  const keys = await allImageKeys();
  const images = {};
  for (const k of keys) {
    const v = await getImage(k);
    if (v) images[k] = v;
  }
  return JSON.stringify({ format: 'pixagave-export', version: 1, state, images });
}

async function importAll(json) {
  const parsed = JSON.parse(json);
  if (parsed.format !== 'pixagave-export') throw new Error('形式が違います');
  for (const [k, v] of Object.entries(parsed.images || {})) {
    await putImage(k, v);
  }
  writeSave(parsed.state);
  return parsed.state;
}

const uid = (prefix = 'id') =>
  `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;

return { putImage, getImage, deleteImage, allImageKeys, loadSave, writeSave, clearSave, exportAll, importAll, uid };
})();

/* PIXAGAVE — スプライト合成 / 手続き生成
 *
 * ・写真がまだ無い株のために、種と個性値からドット絵を手続き生成する
 * ・写真由来スプライトと共通の「キャラクター枠」(鉢・影・段階演出)に合成する
 * 進化しても写真は同じなので、段階差はスケール・鉢・演出・彩度で表現する。
 */



const CHAR = 64; // キャラクター合成キャンバスの一辺

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

/* 決定論的乱数(同じ株はいつ描いても同じ形になる) */
function seededRandom(seedStr) {
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return () => {
    h ^= h << 13; h >>>= 0;
    h ^= h >> 17;
    h ^= h << 5; h >>>= 0;
    return (h >>> 0) / 4294967296;
  };
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

function hsl(h, s, l) {
  return `hsl(${((h % 360) + 360) % 360} ${clamp(s, 0, 100)}% ${clamp(l, 0, 100)}%)`;
}

/* ---------- 手続き生成 ---------- */

function proceduralSprite(species, genes, seed, grid = 44) {
  const rnd = seededRandom(seed || species.id);
  const c = canvas(grid, grid);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const hue = species.hue;

  if (species.world === 'caudex') drawCaudex(ctx, grid, hue, genes, rnd);
  else if (species.world === 'succulent') drawSucculent(ctx, grid, hue, genes, rnd);
  else drawAgave(ctx, grid, hue, genes, rnd);

  outline(ctx, grid);
  return c.toDataURL('image/png');
}

function px(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
}

function drawAgave(ctx, g, hue, genes, rnd) {
  const cx = g / 2;
  const cy = g * 0.82;
  const leaves = Math.round(9 + (genes.leaf / 100) * 5 + (genes.vigor / 100) * 4);
  const spread = 0.78 + (1 - genes.compact / 100) * 0.5; // 締まりが低いほど開帳する
  const maxLen = g * (0.40 + (genes.vigor / 100) * 0.12);
  const width = 1.6 + (genes.leaf / 100) * 3.4;

  for (let i = 0; i < leaves; i++) {
    const t = leaves === 1 ? 0.5 : i / (leaves - 1);
    const angle = -Math.PI / 2 + (t - 0.5) * Math.PI * spread + (rnd() - 0.5) * 0.14;
    const len = maxLen * (0.66 + 0.34 * Math.sin(Math.PI * t)) * (0.9 + rnd() * 0.2);
    const shade = -8 + Math.abs(t - 0.5) * 22 + rnd() * 6;
    const light = 34 - Math.abs(t - 0.5) * 12 + (genes.bloom / 100) * 12;
    const sat = 44 + (genes.vigor / 100) * 24 - (genes.bloom / 100) * 18;
    const base = hsl(hue + shade, sat, light);
    const edge = hsl(hue + shade - 6, sat + 8, light - 12);
    const varieg = hsl(hue + 34, 62, 74);

    for (let s = 0; s <= len; s++) {
      const p = s / len;
      const x = cx + Math.cos(angle) * s;
      const y = cy + Math.sin(angle) * s * 0.94;
      const half = Math.max(0.5, (width * (1 - p * 0.82)) / 2);
      for (let w = -half; w <= half; w += 0.5) {
        const ox = x + Math.cos(angle + Math.PI / 2) * w;
        const oy = y + Math.sin(angle + Math.PI / 2) * w;
        let col = base;
        if (Math.abs(w) > half - 0.6) col = edge;
        // 中斑: 葉の中心線を明色で抜く
        if (genes.variegation > 55 && Math.abs(w) < half * 0.34 && p > 0.15 && (i % 2 === 0)) col = varieg;
        px(ctx, ox, oy, col);
      }
      // 鋸歯
      if (genes.spine > 40 && s > len * 0.28 && s % Math.max(2, Math.round(6 - genes.spine / 25)) < 1) {
        const tooth = hsl(hue - 40, 30, 22 + (genes.spine / 100) * 16);
        px(ctx, x + Math.cos(angle + Math.PI / 2) * (half + 0.6), y + Math.sin(angle + Math.PI / 2) * (half + 0.6), tooth);
        px(ctx, x - Math.cos(angle + Math.PI / 2) * (half + 0.6), y - Math.sin(angle + Math.PI / 2) * (half + 0.6), tooth);
      }
    }
    // 葉先の爪
    const tipX = cx + Math.cos(angle) * len;
    const tipY = cy + Math.sin(angle) * len * 0.94;
    px(ctx, tipX, tipY, hsl(hue - 60, 22, 16 + (genes.spine / 100) * 22));
  }
}

function drawCaudex(ctx, g, hue, genes, rnd) {
  const cx = g / 2;
  const cy = g * 0.72;
  const rx = g * (0.20 + (genes.compact / 100) * 0.13);
  const ry = rx * (0.78 + (1 - genes.compact / 100) * 0.3);

  for (let y = -ry; y <= ry; y += 0.5) {
    for (let x = -rx; x <= rx; x += 0.5) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) > 1) continue;
      const d = Math.hypot(x / rx, y / ry);
      const l = 46 - d * 18 - (x > 0 ? 4 : 0) + (y < 0 ? 6 : 0);
      const crack = rnd() < 0.06 + (genes.spine / 100) * 0.06 ? -14 : 0;
      px(ctx, cx + x, cy + y, hsl(hue + (rnd() - 0.5) * 10, 26 + (genes.vigor / 100) * 14, l + crack));
    }
  }
  // 枝と葉
  const branches = 2 + Math.round((genes.vigor / 100) * 3);
  for (let b = 0; b < branches; b++) {
    const a = -Math.PI / 2 + (b - (branches - 1) / 2) * 0.42 + (rnd() - 0.5) * 0.2;
    const len = g * (0.2 + rnd() * 0.16);
    let x = cx + Math.cos(a) * rx * 0.5;
    let y = cy - ry * 0.75;
    for (let s = 0; s < len; s++) {
      x += Math.cos(a) * 1 + (rnd() - 0.5) * 0.5;
      y += Math.sin(a) * 1;
      px(ctx, x, y, hsl(hue + 10, 24, 34));
      if (s > len * 0.45 && s % 3 === 0) {
        const leaf = hsl(hue + 42, 46 + (genes.vigor / 100) * 18, 40);
        px(ctx, x + 1, y, leaf);
        px(ctx, x - 1, y, leaf);
        px(ctx, x, y - 1, leaf);
      }
    }
  }
}

function drawSucculent(ctx, g, hue, genes, rnd) {
  const cx = g / 2;
  const cy = g * 0.56;
  const rings = 3 + Math.round((genes.leaf / 100) * 2);
  for (let ring = rings; ring >= 0; ring--) {
    const r = (g * 0.36) * (ring / rings) * (0.55 + (1 - genes.compact / 100) * 0.6) + 2;
    const count = 5 + ring * 4;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + ring * 0.5;
      const lx = cx + Math.cos(a) * r;
      const ly = cy + Math.sin(a) * r * 0.72;
      const size = 2.2 + (genes.leaf / 100) * 2.2 - ring * 0.15;
      const l = 40 + (rings - ring) * 4 + (genes.bloom / 100) * 12;
      const tipTint = genes.variegation > 50 ? 26 : 8;
      for (let y = -size; y <= size; y += 0.5) {
        for (let x = -size; x <= size; x += 0.5) {
          if ((x * x) / (size * size) + (y * y) / (size * size * 0.55) > 1) continue;
          const edge = Math.hypot(x / size, y / (size * 0.74)) > 0.72;
          px(ctx, lx + x, ly + y,
            hsl(hue + (edge ? tipTint : 0), 34 + (genes.vigor / 100) * 20, edge ? l - 10 : l));
        }
      }
    }
  }
}

/* 不透明部分の外周 1px を暗色で縁取る */
function outline(ctx, g) {
  const img = ctx.getImageData(0, 0, g, g);
  const d = img.data;
  const alphaAt = (x, y) => (x < 0 || y < 0 || x >= g || y >= g ? 0 : d[(y * g + x) * 4 + 3]);
  const out = new Uint8ClampedArray(d);
  for (let y = 0; y < g; y++) {
    for (let x = 0; x < g; x++) {
      const i = (y * g + x) * 4;
      if (d[i + 3] > 0) continue;
      if (alphaAt(x - 1, y) || alphaAt(x + 1, y) || alphaAt(x, y - 1) || alphaAt(x, y + 1)) {
        out[i] = 10; out[i + 1] = 24; out[i + 2] = 18; out[i + 3] = 230;
      }
    }
  }
  ctx.putImageData(new ImageData(out, g, g), 0, 0);
}

/* ---------- キャラクター合成 ---------- */

const STAGE_SCALE = [0.44, 0.60, 0.76, 0.92, 1.0];

/**
 * 株スプライトを鉢・影・演出つきのキャラクターに合成する。
 * @param {HTMLImageElement} plantImg
 * @param {{stage:number, branch:string|null, genes:object, world:string, pest:number, seed:string}} info
 * @returns {HTMLCanvasElement} CHAR×CHAR
 */
function composeCharacter(plantImg, info) {
  const c = canvas(CHAR, CHAR);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const rnd = seededRandom(info.seed || 'x');
  const stage = clamp(info.stage | 0, 0, 4);
  const branch = info.branch ? BRANCHES[info.branch] : null;

  // 背景の光だまり
  const glow = ctx.createRadialGradient(CHAR / 2, CHAR * 0.44, 2, CHAR / 2, CHAR * 0.44, CHAR * 0.55);
  glow.addColorStop(0, branch ? `${branch.color}22` : '#5fe3c012');
  glow.addColorStop(1, '#00000000');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, CHAR, CHAR);

  // 鉢
  const potW = Math.round(16 + stage * 3.4);
  const potH = Math.round(9 + stage * 1.6);
  const potX = Math.round((CHAR - potW) / 2);
  const potY = CHAR - potH - 5;

  // 影
  ctx.fillStyle = '#00120c66';
  ctx.fillRect(potX - 2, CHAR - 5, potW + 4, 2);
  ctx.fillRect(potX, CHAR - 3, potW, 1);

  // 株本体
  const scale = STAGE_SCALE[stage] * (info.branch === 'titan' ? 1.12 : 1);
  const squash = info.branch === 'compact' ? 0.88 : 1;
  const pw = Math.max(8, Math.round(plantImg.width * (CHAR / plantImg.width) * scale * 0.92));
  const ph = Math.max(8, Math.round(pw * squash));
  const pxx = Math.round((CHAR - pw) / 2);
  const pyy = Math.round(potY - ph + potH * 0.42);

  if (info.branch === 'nishiki') {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.filter = 'saturate(1.3)';
  }
  ctx.drawImage(plantImg, pxx, Math.max(0, pyy), pw, ph);
  if (info.branch === 'nishiki') {
    ctx.restore();
    ctx.globalAlpha = 0.65;
    ctx.drawImage(plantImg, pxx, Math.max(0, pyy), pw, ph);
    ctx.globalAlpha = 1;
  }

  // 鉢の描画(株より手前)
  const potBase = info.world === 'caudex' ? '#7d5a3c' : '#5c4636';
  ctx.fillStyle = potBase;
  for (let y = 0; y < potH; y++) {
    const inset = Math.round((y / potH) * 2);
    ctx.fillRect(potX + inset, potY + y, potW - inset * 2, 1);
  }
  ctx.fillStyle = '#00000044';
  ctx.fillRect(potX + potW - 4, potY + 2, 3, potH - 3);
  ctx.fillStyle = '#ffffff1f';
  ctx.fillRect(potX + 2, potY + 2, 2, potH - 4);
  // 鉢の縁
  ctx.fillStyle = info.world === 'caudex' ? '#966f4a' : '#6f5642';
  ctx.fillRect(potX - 1, potY, potW + 2, 2);
  // 用土
  ctx.fillStyle = '#3a2f26';
  ctx.fillRect(potX + 1, potY - 1, potW - 2, 2);
  for (let i = 0; i < potW / 3; i++) {
    px(ctx, potX + 2 + rnd() * (potW - 4), potY - 1 + rnd() * 2, '#55483b');
  }

  // 段階演出
  if (stage >= 3) {
    ctx.fillStyle = branch ? `${branch.color}` : '#5fe3c0';
    for (let i = 0; i < 3 + stage; i++) {
      const a = rnd() * Math.PI * 2;
      const r = CHAR * (0.3 + rnd() * 0.16);
      px(ctx, CHAR / 2 + Math.cos(a) * r, CHAR * 0.45 + Math.sin(a) * r * 0.8, ctx.fillStyle);
    }
  }
  if (stage === 4) {
    // 完成株の冠マーク
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(CHAR / 2 - 3, 3, 6, 1);
    ctx.fillRect(CHAR / 2 - 3, 2, 1, 1);
    ctx.fillRect(CHAR / 2 + 2, 2, 1, 1);
    ctx.fillRect(CHAR / 2, 1, 1, 2);
  }
  if (info.pest > 30) {
    ctx.fillStyle = '#c9f26a';
    for (let i = 0; i < Math.round(info.pest / 20); i++) {
      px(ctx, CHAR * 0.25 + rnd() * CHAR * 0.5, CHAR * 0.3 + rnd() * CHAR * 0.4, '#b7e05a');
    }
  }
  return c;
}

return { seededRandom, proceduralSprite, composeCharacter };

/* PIXAGAVE — 写真ピクセル化エンジン
 *
 * 実物の写真 1 枚から
 *   (1) 背景を落とした「株だけ」のドット絵スプライト
 *   (2) その株固有の個性値(遺伝子)
 * を生成する。すべてブラウザ内 canvas 処理で完結し、外部送信は一切しない。
 *
 * パイプライン:
 *   crop → 背景推定 → マスク生成 → モルフォロジー整形 → 最大連結成分抽出

 *   → ディザ → 陰影 + 輪郭 → PNG

const WORK = 160; // 解析用の作業解像度

/* ---------- 基本ユーティリティ ---------- */

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('画像を読み込めませんでした'));
    };
    img.src = url;
  });
}

function loadImageFromUrl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('画像を読み込めませんでした'));
    img.src = src;
  });
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

/* 中央を正方形に切り出して size×size に描画 */
function squareCrop(img, size) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
  const sx = ((img.naturalWidth || img.width) - side) / 2;
  const sy = ((img.naturalHeight || img.height) - side) / 2;
  ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
  return ctx.getImageData(0, 0, size, size);
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const clamp01 = (v) => clamp(v, 0, 1);

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  const d = max - min;
  if (d > 1e-6) {
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

const lumaOf = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;

/* ---------- 1. 背景推定 & マスク生成 ---------- */

function estimateBackground(data, size) {
  // 外周 12% のリングから中央値を取る(角だけだと空/机の片寄りに弱い)
  const band = Math.max(2, Math.round(size * 0.12));
  const rs = [], gs = [], bs = [];
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const edge = x < band || y < band || x >= size - band || y >= size - band;
      if (!edge) continue;
      const i = (y * size + x) * 4;
      rs.push(data[i]); gs.push(data[i + 1]); bs.push(data[i + 2]);
    }
  }
  const med = (a) => { a.sort((p, q) => p - q); return a[a.length >> 1] || 0; };
  return [med(rs), med(gs), med(bs)];
}

function buildMask(data, size) {
  const bg = estimateBackground(data, size);
  const [br, bgc, bb] = bg;
  const bgHsl = rgbToHsl(br, bgc, bb);
  const mask = new Uint8Array(size * size);

  // 背景との差の分布を見て閾値を自動調整する
  const diffs = new Float32Array(size * size);
  for (let p = 0; p < size * size; p++) {
    const i = p * 4;
    const dr = data[i] - br, dg = data[i + 1] - bgc, db = data[i + 2] - bb;
    diffs[p] = Math.sqrt(dr * dr + dg * dg + db * db);
  }
  const sorted = Float32Array.from(diffs).sort();
  const p60 = sorted[Math.floor(sorted.length * 0.6)];
  const p90 = sorted[Math.floor(sorted.length * 0.9)];
  const thr = clamp((p60 + p90) / 2, 26, 96);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const p = y * size + x;
      const i = p * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const [h, s, l] = rgbToHsl(r, g, b);
      // 植物寄りの色(緑〜黄緑〜青緑、あるいは彩度の高い色)を優遇
      const plantish = (h >= 55 && h <= 190 && s > 0.12) ? 1 : 0;
      // 背景の色相と大きく離れていれば主題とみなす
      let hueGap = Math.abs(h - bgHsl[0]);
      if (hueGap > 180) hueGap = 360 - hueGap;
      const score =
        diffs[p] / thr +
        plantish * 0.55 +
        (s > 0.22 ? 0.35 : 0) +
        (hueGap > 45 && s > 0.15 ? 0.3 : 0) -
        (l > 0.93 ? 0.6 : 0) - // 白飛びした背景
        (l < 0.06 ? 0.4 : 0);
      mask[p] = score >= 1 ? 1 : 0;
    }
  }
  return { mask, bg };
}

/* 3×3 モルフォロジー */
function morph(mask, size, op, times = 1) {
  let src = mask;
  for (let t = 0; t < times; t++) {
    const dst = new Uint8Array(size * size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let hit = op === 'erode' ? 1 : 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            const v = nx < 0 || ny < 0 || nx >= size || ny >= size ? 0 : src[ny * size + nx];
            if (op === 'erode') hit &= v;
            else hit |= v;
          }
        }
        dst[y * size + x] = hit;
      }
    }
    src = dst;
  }
  return src;
}

/* 中央に最も近い最大連結成分だけを残す */
function largestComponent(mask, size) {

  for (let start = 0; start < mask.length; start++) {
    if (!mask[start] || label[start] !== -1) continue;
    let sp = 0;
    stack[sp++] = start;
    label[start] = id;
    let count = 0;
    let sumx = 0, sumy = 0;
    while (sp > 0) {
      const p = stack[--sp];
      count++;
      const x = p % size, y = (p / size) | 0;
      sumx += x; sumy += y;
      for (let k = 0; k < 4; k++) {

        const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
        const np = ny * size + nx;
        if (mask[np] && label[np] === -1) {
          label[np] = id;
          stack[sp++] = np;
        }
      }
    }
    const dist = Math.hypot(sumx / count - cx, sumy / count - cy) / size;
    const weight = count * (1 - clamp01(dist) * 0.75); // 中央寄りを優遇
    if (!best || weight > best.weight) best = { id, weight, count };
    id++;

  if (!best) return mask;
  const out = new Uint8Array(size * size);
  for (let p = 0; p < out.length; p++) out[p] = label[p] === best.id ? 1 : 0;
  return out;
}

/* 穴埋め: 外周から到達できない 0 領域を 1 にする */
function fillHoles(mask, size) {
  const outside = new Uint8Array(size * size);
  const stack = [];
  for (let x = 0; x < size; x++) {
    stack.push(x, (size - 1) * size + x);
  }
  for (let y = 0; y < size; y++) {
    stack.push(y * size, y * size + size - 1);
  }
  while (stack.length) {
    const p = stack.pop();
    if (p < 0 || p >= mask.length || outside[p] || mask[p]) continue;
    outside[p] = 1;
    const x = p % size, y = (p / size) | 0;
    if (x > 0) stack.push(p - 1);
    if (x < size - 1) stack.push(p + 1);
    if (y > 0) stack.push(p - size);
    if (y < size - 1) stack.push(p + size);
  }
  const out = new Uint8Array(mask);
  for (let p = 0; p < out.length; p++) if (!outside[p]) out[p] = 1;
  return out;
}

/* ---------- 2. グリッド縮小 ---------- */

function downsample(data, size, mask, grid) {
  // マスクの外接矩形を正方形に整えてから grid×grid へ
  let minX = size, minY = size, maxX = -1, maxY = -1;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (mask[y * size + x]) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = size - 1; maxY = size - 1; }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const side = Math.max(w, h);
  const ox = minX - (side - w) / 2;
  const oy = minY - (side - h) / 2;

  const cells = new Array(grid * grid);
  const cell = side / grid;
  for (let gy = 0; gy < grid; gy++) {
    for (let gx = 0; gx < grid; gx++) {
      let r = 0, g = 0, b = 0, n = 0, tot = 0;
      const x0 = Math.floor(ox + gx * cell), x1 = Math.ceil(ox + (gx + 1) * cell);
      const y0 = Math.floor(oy + gy * cell), y1 = Math.ceil(oy + (gy + 1) * cell);
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          if (x < 0 || y < 0 || x >= size || y >= size) { tot++; continue; }
          tot++;
          if (!mask[y * size + x]) continue;
          const i = (y * size + x) * 4;
          r += data[i]; g += data[i + 1]; b += data[i + 2];
          n++;
        }
      }
      const cover = tot ? n / tot : 0;
      cells[gy * grid + gx] = n
        ? { r: r / n, g: g / n, b: b / n, cover }
        : { r: 0, g: 0, b: 0, cover: 0 };
    }
  }
  return { cells, bbox: { minX, minY, maxX, maxY, side } };
}

/* ---------- 3. 減色 (k-means) ---------- */

function kmeans(points, k, iterations = 14) {
  if (!points.length) return [];
  k = Math.min(k, points.length);
  // 輝度順に等間隔サンプリングして初期中心を決める(k-means++ の簡易版)
  const sorted = [...points].sort((a, b) => lumaOf(a[0], a[1], a[2]) - lumaOf(b[0], b[1], b[2]));
  const centers = [];
  for (let i = 0; i < k; i++) {
    centers.push([...sorted[Math.floor(((i + 0.5) / k) * (sorted.length - 1))]]);
  }
  const assign = new Int32Array(points.length);
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let p = 0; p < points.length; p++) {
      let bi = 0, bd = Infinity;
      for (let c = 0; c < centers.length; c++) {
        const dr = points[p][0] - centers[c][0];
        const dg = points[p][1] - centers[c][1];
        const db = points[p][2] - centers[c][2];
        const d = dr * dr + dg * dg + db * db;
        if (d < bd) { bd = d; bi = c; }
      }
      if (assign[p] !== bi) { assign[p] = bi; moved = true; }
    }
    const sums = centers.map(() => [0, 0, 0, 0]);
    for (let p = 0; p < points.length; p++) {
      const s = sums[assign[p]];
      s[0] += points[p][0]; s[1] += points[p][1]; s[2] += points[p][2]; s[3]++;
    }
    for (let c = 0; c < centers.length; c++) {
      if (sums[c][3] > 0) {
        centers[c] = [sums[c][0] / sums[c][3], sums[c][1] / sums[c][3], sums[c][2] / sums[c][3]];
      }
    }
    if (!moved && it > 2) break;
  }
  const weights = new Array(centers.length).fill(0);
  for (let p = 0; p < points.length; p++) weights[assign[p]]++;
  return centers.map((c, i) => ({ rgb: c, weight: weights[i] / points.length }));
}

/* 中心色を「ドット絵らしい」色に整える。
 * 元写真の色相は残しつつ、彩度と明度を段階化して情報量を落とす。 */
function stylize(rgb, speciesHue, strength = 0.14) {
  let [h, s, l] = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  // 種の基調色相へ少しだけ引き寄せる(個体差は残す)
  let gap = speciesHue - h;
  if (gap > 180) gap -= 360;
  if (gap < -180) gap += 360;
  h += gap * strength;
  s = clamp01(Math.round(clamp01(s * 1.22) * 6) / 6);
  l = clamp(Math.round(l * 9) / 9, 0.06, 0.95);
  return hslToRgb(h, s, l);
}

const BAYER4 = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5],
];

/* ---------- 4. 個性値の解析 ---------- */

function analyze(cells, grid, species) {
  const inside = [];
  let area = 0, perimeter = 0;
  const rows = new Array(grid).fill(0);
  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const c = cells[y * grid + x];
      if (c.cover < 0.42) continue;
      area++;
      rows[y]++;
      inside.push({ x, y, ...c });
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        const n = nx < 0 || ny < 0 || nx >= grid || ny >= grid ? null : cells[ny * grid + nx];
        if (!n || n.cover < 0.42) perimeter++;
      }
    }
  }
  if (!area) {
    return { raw: {}, hue: species.hue, area: 0 };
  }

  const lums = inside.map((c) => lumaOf(c.r, c.g, c.b));
  const meanL = lums.reduce((a, b) => a + b, 0) / lums.length;
  const sd = Math.sqrt(lums.reduce((a, b) => a + (b - meanL) ** 2, 0) / lums.length);

  let hx = 0, hy = 0, satSum = 0;
  let brightPale = 0, highlight = 0;
  for (const c of inside) {
    const [h, s, l] = rgbToHsl(c.r, c.g, c.b);
    hx += Math.cos((h * Math.PI) / 180) * s;
    hy += Math.sin((h * Math.PI) / 180) * s;
    satSum += s;
    if (l > 0.62 && s < 0.24) brightPale++;              // 白粉・粉質
    if (lumaOf(c.r, c.g, c.b) > meanL + sd * 1.05 && s > 0.16) highlight++; // 斑・覆輪
  }
  const meanHue = ((Math.atan2(hy, hx) * 180) / Math.PI + 360) % 360;
  const meanSat = satSum / inside.length;

  // 締まり: 外接円に対する充填率が高いほど「詰まっている」
  const bboxArea = grid * grid;
  const compactness = area / bboxArea;
  // 棘・鋸歯: 面積あたりの輪郭長。ギザギザなほど大きい
  const roughness = perimeter / (4 * Math.sqrt(area));
  // 葉幅: 行ごとの被覆長の平均(幅広ほど大)
  const meanRow = rows.filter((r) => r > 0).reduce((a, b) => a + b, 0) / rows.filter((r) => r > 0).length;
  const leafiness = meanRow / grid;

  const raw = {
    leaf: clamp(leafiness * 150 - 10, 0, 100),
    compact: clamp(compactness * 210, 0, 100),
    spine: clamp((roughness - 1.05) * 118, 0, 100),
    variegation: clamp((highlight / area) * 330, 0, 100),
    bloom: clamp((brightPale / area) * 280, 0, 100),
    vigor: clamp(meanSat * 105 + compactness * 45, 0, 100),
  };
  return { raw, hue: meanHue, area, contrast: sd / 64, meanSat };
}

/* 解析値と種のバイアスを合成して確定した個性値にする */
function mixGenes(raw, species, luck = Math.random) {
  const out = {};
  for (const key of ['leaf', 'compact', 'spine', 'variegation', 'bloom', 'vigor']) {
    const photo = raw && Number.isFinite(raw[key]) ? raw[key] : 50;
    const bias = species.bias[key];
    const jitter = (luck() - 0.5) * 12;
    out[key] = Math.round(clamp(photo * 0.55 + bias * 0.45 + jitter, 1, 100));
  }
  return out;
}

/* ---------- 5. 本体 ---------- */

/**
 * 写真をドット絵スプライトに変換する。
 * @param {HTMLImageElement} img
 * @param {{species: object, grid?: number, colors?: number, dither?: boolean}} opts
 * @returns {{sprite: string, thumb: string, grid: number, analysis: object}}
 */
function pixelizePhoto(img, opts = {}) {
  const species = opts.species || { hue: 150, bias: {} };
  const grid = opts.grid || 44;
  const colors = opts.colors || 8;
  const dither = opts.dither !== false;

  const imageData = squareCrop(img, WORK);
  const data = imageData.data;

  let { mask } = buildMask(data, WORK);
  mask = morph(mask, WORK, 'dilate', 1);
  mask = morph(mask, WORK, 'erode', 2);
  mask = morph(mask, WORK, 'dilate', 1);
  mask = largestComponent(mask, WORK);
  mask = fillHoles(mask, WORK);

  // マスクが小さすぎる / 大きすぎる場合は主題抽出に失敗しているので中央円にフォールバック
  let covered = 0;
  for (let p = 0; p < mask.length; p++) covered += mask[p];
  const ratio = covered / mask.length;
  if (ratio < 0.045 || ratio > 0.97) {
    mask = new Uint8Array(WORK * WORK);
    const r = WORK * 0.42;
    for (let y = 0; y < WORK; y++) {
      for (let x = 0; x < WORK; x++) {
        if (Math.hypot(x - WORK / 2, y - WORK / 2) <= r) mask[y * WORK + x] = 1;
      }
    }
  }

  const { cells } = downsample(data, WORK, mask, grid);
  const analysis = analyze(cells, grid, species);

  const points = cells.filter((c) => c.cover >= 0.42).map((c) => [c.r, c.g, c.b]);
  const centers = kmeans(points, colors);
  const palette = centers.map((c) => stylize(c.rgb, species.hue));

  // --- 描画 ---
  const out = makeCanvas(grid, grid);
  const octx = out.getContext('2d', { willReadFrequently: true });
  const outData = octx.createImageData(grid, grid);

  const nearest = (r, g, b) => {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < centers.length; i++) {
      const dr = r - centers[i].rgb[0], dg = g - centers[i].rgb[1], db = b - centers[i].rgb[2];
      const d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  };

  const solid = (x, y) =>
    x >= 0 && y >= 0 && x < grid && y < grid && cells[y * grid + x].cover >= 0.42;

  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const idx = (y * grid + x) * 4;
      const c = cells[y * grid + x];
      if (c.cover < 0.42) {
        // 輪郭: 実体に隣接する空白セルを暗色で縁取る
        const touching = solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1);
        if (touching && c.cover > 0.12) {
          outData.data[idx] = 12;
          outData.data[idx + 1] = 26;
          outData.data[idx + 2] = 20;
          outData.data[idx + 3] = 235;
        } else {
          outData.data[idx + 3] = 0;
        }
        continue;
      }
      let r = c.r, g = c.g, b = c.b;
      if (dither) {
        const t = (BAYER4[y & 3][x & 3] / 16 - 0.5) * 26;
        r += t; g += t; b += t;
      }
      const pi = nearest(r, g, b);
      let [pr, pg, pb] = palette[pi] || [80, 120, 90];

      // 擬似ライティング: 左上から光が当たっている前提で縁を持ち上げ、右下を落とす
      const upLeftOpen = !solid(x - 1, y) || !solid(x, y - 1);
      const downRightOpen = !solid(x + 1, y) || !solid(x, y + 1);
      if (upLeftOpen && !downRightOpen) {
        const [h, s, l] = rgbToHsl(pr, pg, pb);
        [pr, pg, pb] = hslToRgb(h, s * 0.92, clamp01(l + 0.11));
      } else if (downRightOpen && !upLeftOpen) {
        const [h, s, l] = rgbToHsl(pr, pg, pb);
        [pr, pg, pb] = hslToRgb(h, clamp01(s * 1.05), clamp01(l - 0.1));
      }

      outData.data[idx] = pr;
      outData.data[idx + 1] = pg;
      outData.data[idx + 2] = pb;
      outData.data[idx + 3] = 255;
    }
  }
  octx.putImageData(outData, 0, 0);

  // サムネイル(元写真の縮小版。アルバム表示用に 320px の JPEG で保持)
  const thumbSize = 320;
  const tc = makeCanvas(thumbSize, thumbSize);
  const tctx = tc.getContext('2d');
  const side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
  tctx.drawImage(
    img,
    ((img.naturalWidth || img.width) - side) / 2,
    ((img.naturalHeight || img.height) - side) / 2,
    side, side, 0, 0, thumbSize, thumbSize
  );

  return {
    sprite: out.toDataURL('image/png'),
    thumb: tc.toDataURL('image/jpeg', 0.72),
    grid,
    analysis,
    palette: palette.map(([r, g, b]) => `rgb(${r},${g},${b})`),
  };
}

/* 与えられたスプライト dataURL を n 倍に拡大した canvas を返す(共有画像生成用) */
async function scaleSprite(dataUrl, scale) {
  const img = await loadImageFromUrl(dataUrl);
  const c = makeCanvas(img.width * scale, img.height * scale);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

return { loadImageFromFile, loadImageFromUrl, mixGenes, pixelizePhoto, scaleSprite };

const __m_game = (() => {
const { SPECIES, SPECIES_BY_ID, STAGES, STAGE_REQUIREMENTS, BRANCHES, GENE_KEYS, QUESTS, STARTERS, SHOP } = __m_data;
const { loadSave, writeSave, uid } = __m_store;

/* PIXAGAVE — ゲーム本体

 */





const DAY = 86400000;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const round1 = (v) => Math.round(v * 10) / 10;

/* ---------- 季節 ---------- */
/* 実際の栽培に合わせ、月から成長期/休眠期を決める(北半球基準)。
 * 夏型(アガベ・多肉・多くの塊根)は冬に、冬型(亀甲竜など)は真夏に休眠する。 */
const WINTER_GROWERS = new Set(['elephantipes', 'lithops']);

function seasonOf(date = new Date()) {
  const m = date.getMonth() + 1;
  if (m >= 3 && m <= 5) return { key: 'spring', ja: '春', icon: '❀', temp: 18 };
  if (m >= 6 && m <= 8) return { key: 'summer', ja: '夏', icon: '☀', temp: 30 };
  if (m >= 9 && m <= 11) return { key: 'autumn', ja: '秋', icon: '☂', temp: 20 };
  return { key: 'winter', ja: '冬', icon: '❄', temp: 7 };
}

function growthFactor(species, season) {
  const winterType = WINTER_GROWERS.has(species.id);
  const table = winterType
    ? { spring: 0.8, summer: 0.15, autumn: 1.0, winter: 1.0 }
    : { spring: 1.0, summer: 1.2, autumn: 0.9, winter: 0.25 };
  return table[season.key];
}

function isDormant(species, season) {
  return growthFactor(species, season) <= 0.3;
}

/* ---------- 初期状態 ---------- */

function freshState() {
  const now = Date.now();
  return {
    v: 1,

    coins: 600,
    createdAt: now,

  };
}

const dayKey = (t) => new Date(t).toISOString().slice(0, 10);

function createPlant(speciesId, opts = {}) {
  const species = SPECIES_BY_ID[speciesId];
  const now = opts.now || Date.now();
  const genes = opts.genes || defaultGenes(species, opts.seed || speciesId + now);
  return {
    id: uid('pl'),

    spriteId: null,

    parents: opts.parents || null,
    hybrid: opts.hybrid || null,
    gen: opts.gen || 1,
    waterIntervals: [],
    favorite: false,
    note: '',
  };
}

function defaultGenes(species, seed) {
  const rnd = seededRandom(String(seed));
  const g = {};
  for (const k of GENE_KEYS) {
    g[k] = Math.round(clamp(species.bias[k] + (rnd() - 0.5) * 26, 1, 100));
  }
  return g;
}

/* ---------- ゲームクラス ---------- */

class Game extends EventTarget {
  constructor() {
    super();
    this.state = loadSave() || freshState();
    this.migrate();
  }

  migrate() {
    const base = freshState();
    this.state = { ...base, ...this.state };
    this.state.stats = { ...base.stats, ...this.state.stats };
    this.state.items = { ...base.items, ...this.state.items };
    this.state.settings = { ...base.settings, ...this.state.settings };
    for (const p of this.state.plants) {
      p.baseGenes ||= { ...p.genes };
      p.waterIntervals ||= [];
      p.album ||= [];
      p.events ||= [];
      p.metrics ||= { diameter: 0, leaves: 0, height: 0 };
      p.baseline ||= { diameter: 0, leaves: 0, stageAt: p.createdAt };
    }
  }

  save() {
    writeSave(this.state);
    this.emit('change');
  }

  emit(type, detail) {
    this.dispatchEvent(new CustomEvent(type, { detail }));
  }

  now() {
    return Date.now() + this.state.warpDays * DAY;
  }

  /* ---- 参照系 ---- */
  plant(id) {
    return this.state.plants.find((p) => p.id === id) || null;
  }
  species(p) {
    return SPECIES_BY_ID[p.speciesId];
  }
  stageInfo(p) {
    return STAGES[p.stage];
  }
  ageDays(p) {
    return Math.max(0, (this.now() - p.createdAt) / DAY);
  }

  displayName(p) {
    const sp = this.species(p);
    const stage = STAGES[p.stage];
    if (p.hybrid) {
      const a = SPECIES_BY_ID[p.hybrid.a]?.ja ?? '?';
      const b = SPECIES_BY_ID[p.hybrid.b]?.ja ?? '?';
      return `${a}×${b}`;
    }
    if (p.branch) return `${sp.ja}・${BRANCHES[p.branch].ja}`;
    return `${sp.ja} ${stage.ja}`;
  }

  /* 総合スコア: 品評会・売却価格・ランキングの共通指標 */
  score(p) {
    const g = p.genes;
    const sp = this.species(p);
    const care = this.careQuality(p);
    const gene = (g.leaf * 0.9 + g.compact * 1.6 + g.spine * 1.2 + g.variegation * 1.4 +
      g.bloom * 0.7 + g.vigor * 0.9) / 6.7;
    const stageBonus = p.stage * 34;
    const rarity = sp.rarity * 12;
    const record = Math.min(60, p.album.length * 4);
    const health = (p.care.health - 60) * 0.5;
    return Math.round(clamp(gene * 3.6 + stageBonus + rarity + record + care * 0.9 + health, 0, 1200));
  }

  /* 管理の質 0-100。潅水間隔の安定性・日照の適正・健康・害虫から算出 */
  careQuality(p) {
    const sp = this.species(p);
    let s = 50;
    const iv = p.waterIntervals.slice(-8);
    if (iv.length >= 2) {
      const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
      const sd = Math.sqrt(iv.reduce((a, b) => a + (b - mean) ** 2, 0) / iv.length);
      s += clamp(22 - Math.abs(mean - sp.water) * 3.4, -18, 22); // 適正間隔に近いほど加点
      s += clamp(14 - sd * 3.2, -10, 14);                        // ばらつきが小さいほど加点
    }
    s += clamp(18 - Math.abs(p.light - sp.light) * 0.55, -20, 18);
    s += (p.care.health - 70) * 0.35;
    s -= p.pest * 0.25;
    s += Math.min(12, p.album.length * 1.2);
    return Math.round(clamp(s, 0, 100));
  }

  /* 平均潅水間隔(日) */
  avgWaterInterval(p) {
    if (!p.waterIntervals.length) return null;
    const iv = p.waterIntervals.slice(-10);
    return round1(iv.reduce((a, b) => a + b, 0) / iv.length);
  }

  /* 推定 lux。実測が無ければ日照設定から換算する */
  estimatedLux(p) {
    if (p.lux) return p.lux;
    return Math.round(p.light * 1180 + 800);
  }

  /* ---- シミュレーション ---- */

  tick(force = false) {
    const now = this.now();
    const elapsed = (now - this.state.lastTickAt) / DAY;
    if (elapsed <= 0.0005 && !force) return false;
    const season = seasonOf(new Date(now));

    for (const p of this.state.plants) {
      const sp = this.species(p);
      const gf = growthFactor(sp, season);
      const dormant = gf <= 0.3;

      // 水分: 適正間隔で 100 → 0。休眠期は消費が落ちる
      const dryRate = (100 / sp.water) * (dormant ? 0.45 : 1) * (0.85 + p.light / 220);
      p.care.hydration = clamp(p.care.hydration - dryRate * elapsed, 0, 120);
      p.care.nutrition = clamp(p.care.nutrition - 3.6 * elapsed * (dormant ? 0.4 : 1), 0, 100);

      // 害虫: 過湿 + 弱日照 + 通気不良で増える
      const pestRisk =
        (p.care.hydration > 88 ? 1.6 : 0.35) *
        (p.light < sp.light - 22 ? 1.9 : 0.7) *
        (this.state.items.shade > 0 ? 0.85 : 1);
      p.pest = clamp(p.pest + pestRisk * 1.5 * elapsed - (p.pest > 0 ? 0.2 * elapsed : 0), 0, 100);

      // 健康: 水分帯・日照差・害虫から目標値を作り、そこへ寄せる
      const hydeal = p.care.hydration;
      const hydrationPenalty =
        hydeal > 100 ? (hydeal - 100) * 1.4 : hydeal < 12 ? (12 - hydeal) * 2.6 : 0;
      const lightPenalty = Math.abs(p.light - sp.light) * 0.75;
      const target = clamp(100 - hydrationPenalty - lightPenalty - p.pest * 0.55 +
        (p.care.nutrition > 40 ? 6 : -6), 5, 100);
      p.care.health += (target - p.care.health) * clamp(elapsed * 0.55, 0, 1);
      p.care.health = clamp(p.care.health, 1, 100);

      // 個性値のドリフト = 「育て方が姿に出る」
      if (!dormant) this.driftGenes(p, sp, elapsed);

      // 経過による微量の経験値(健康な株のみ)
      if (p.care.health > 62 && !dormant) {
        p.exp += 2.2 * elapsed * gf * (this.state.items.pot > 0 ? 1.15 : 1);
      }
      p.exp = Math.round(p.exp);
    }

    this.state.lastTickAt = now;
    this.checkLogin(now);
    this.checkQuests();
    writeSave(this.state);
    this.emit('tick');
    return true;
  }

  driftGenes(p, sp, days) {
    const g = p.genes;
    const base = p.baseGenes;
    const lightGap = p.light - sp.light;
    const dry = p.care.hydration < 45;
    const move = (key, delta) => {
      const lo = clamp(base[key] - 26, 1, 100);
      const hi = clamp(base[key] + 26, 1, 100);
      g[key] = Math.round(clamp(g[key] + delta * days, lo, hi) * 10) / 10;
    };
    // 強光 + 辛い水やり → 締まる。弱光 → 徒長して締まりが落ちる
    if (Math.abs(lightGap) <= 8 && dry) move('compact', 0.9);
    else if (lightGap < -18) move('compact', -1.1);
    else if (lightGap > 18) move('compact', 0.2);
    // 強光は棘・爪を伸ばす
    if (lightGap > -5 && p.care.health > 55) move('spine', 0.35);
    // 水と養分が潤沢なら成長力と葉幅が伸びる
    if (p.care.nutrition > 55 && p.care.hydration > 35) { move('vigor', 0.55); move('leaf', 0.3); }
    else if (p.care.nutrition < 15) move('vigor', -0.4);
    // 乾燥した強光下では白粉が乗る
    if (dry && lightGap > -4) move('bloom', 0.3);
    // 害虫の放置は全体を削る
    if (p.pest > 45) { move('leaf', -0.5); move('compact', -0.35); }
  }

  checkLogin(now) {
    const key = dayKey(Date.now());
    const st = this.state.stats;
    if (st.lastLoginDay !== key) {
      const prev = new Date(st.lastLoginDay);
      const diff = Math.round((new Date(key) - prev) / DAY);
      st.streak = diff === 1 ? st.streak + 1 : 1;
      st.lastLoginDay = key;
      st.days += 1;
      this.state.coins += 30 + Math.min(70, st.streak * 5);
      this.pushLog(`ログインボーナス +${30 + Math.min(70, st.streak * 5)} コイン(${st.streak}日連続)`);
    }
  }

  pushLog(text) {
    this.state.log.unshift({ t: this.now(), text });
    this.state.log = this.state.log.slice(0, 80);
  }

  /* ---- ケア操作 ---- */

  water(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const sp = this.species(p);
    const now = this.now();
    const interval = (now - p.lastWater) / DAY;
    const over = p.care.hydration > 72;
    if (interval > 0.3) p.waterIntervals.push(round1(interval));
    p.waterIntervals = p.waterIntervals.slice(-20);
    p.lastWater = now;
    p.care.hydration = clamp(p.care.hydration + (over ? 22 : 100 - p.care.hydration), 0, 118);
    let gain = 8;
    let msg = `${p.nickname} に水をやった`;
    if (over) {
      p.care.health = clamp(p.care.health - 5, 1, 100);
      p.pest = clamp(p.pest + 7, 0, 100);
      gain = 2;
      msg = `${p.nickname}: 用土がまだ湿っている。根腐れに注意`;
    } else if (Math.abs(interval - sp.water) <= 1.5) {
      gain = 16;
      msg = `${p.nickname}: 完璧なタイミングの潅水`;
    }
    this.gainExp(p, gain);
    this.state.stats.waterings++;
    this.pushLog(msg);
    this.save();
    return { ok: true, message: msg, exp: gain };
  }

  fertilize(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    if (this.state.items.fertilizer <= 0) return { ok: false, message: '活力剤がありません' };
    this.state.items.fertilizer--;
    p.care.nutrition = clamp(p.care.nutrition + 45, 0, 100);
    p.lastFert = this.now();
    this.gainExp(p, 10);
    this.pushLog(`${p.nickname} に活力剤を与えた`);
    this.save();
    return { ok: true, message: '養分 +45' };
  }

  treat(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    if (p.pest < 1) return { ok: false, message: '害虫は見当たりません' };
    if (this.state.items.medicine <= 0) return { ok: false, message: '殺虫剤がありません' };
    this.state.items.medicine--;
    p.pest = 0;
    p.care.health = clamp(p.care.health + 6, 1, 100);
    this.gainExp(p, 12);
    this.pushLog(`${p.nickname} の害虫を駆除した`);
    this.save();
    return { ok: true, message: '害虫を駆除した' };
  }

  setLight(id, value) {
    const p = this.plant(id);
    if (!p) return;
    const cap = this.state.items.shade > 0 ? 100 : 100;
    p.light = clamp(Math.round(value), 0, cap);
    this.save();
  }

  setLightMeasure(id, { lux, hours }) {
    const p = this.plant(id);
    if (!p) return;
    if (Number.isFinite(lux)) p.lux = Math.max(0, Math.round(lux));
    if (Number.isFinite(hours)) p.lightHours = clamp(hours, 0, 24);
    this.gainExp(p, 6);
    this.save();
  }

  /* 写真を1枚追加。個性値は「実物の最新の姿」に少しずつ寄っていく */
  addPhoto(id, { photoId, spriteId, analysis, note }) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const now = this.now();
    p.album.unshift({
      id: uid('al'), t: now, photoId, spriteId, note: note || '',
      stage: p.stage, metrics: { ...p.metrics },
    });
    p.photoId = photoId;
    p.spriteId = spriteId;
    p.lastPhoto = now;
    if (analysis && analysis.raw) {
      for (const k of GENE_KEYS) {
        if (!Number.isFinite(analysis.raw[k])) continue;
        // 写真の解析値へ 22% だけ寄せる(急激に人格が変わらないように)
        p.genes[k] = Math.round(clamp(p.genes[k] * 0.78 + analysis.raw[k] * 0.22, 1, 100));
      }
    }
    this.state.stats.photos++;
    this.gainExp(p, 25);
    this.registerDex(p);
    this.pushLog(`${p.nickname} の記録を追加した (${p.album.length}枚目)`);
    this.checkQuests();
    this.save();
    return { ok: true };
  }

  measure(id, { diameter, leaves, height }) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const prev = { ...p.metrics };
    if (Number.isFinite(diameter) && diameter > 0) p.metrics.diameter = diameter;
    if (Number.isFinite(leaves) && leaves > 0) p.metrics.leaves = Math.round(leaves);
    if (Number.isFinite(height) && height > 0) p.metrics.height = height;
    if (!p.baseline.diameter) p.baseline = { ...p.baseline, diameter: p.metrics.diameter, leaves: p.metrics.leaves };
    const grew = Math.max(0, (p.metrics.diameter || 0) - (prev.diameter || 0));
    const gain = 15 + Math.round(grew * 12);
    this.gainExp(p, gain);
    this.state.stats.measures++;
    p.events.unshift({
      t: this.now(), type: 'measure',
      text: `実測: 幅 ${p.metrics.diameter}cm / 葉 ${p.metrics.leaves}枚${grew ? ` (+${round1(grew)}cm)` : ''}`,
    });
    this.pushLog(`${p.nickname} の実測を記録 (+${gain} EXP)`);
    this.checkQuests();
    this.save();
    return { ok: true, exp: gain, grew };
  }

  gainExp(p, amount) {
    const mult = this.state.items.pot > 0 ? 1.15 : 1;
    p.exp = Math.round(p.exp + amount * mult);
  }

  /* ---- 進化 ---- */

  evolveCheck(p) {
    if (p.stage >= 4) return { ok: false, done: true, missing: [] };
    const req = STAGE_REQUIREMENTS[p.stage + 1];
    const days = this.ageDays(p);
    const photos = p.album.length;
    const grown = (p.metrics.diameter || 0) - (p.baseline.diameter || 0);
    const missing = [];
    if (p.exp < req.exp) missing.push({ key: 'exp', need: req.exp, have: Math.round(p.exp), label: '経験値' });
    if (days < req.days) missing.push({ key: 'days', need: req.days, have: Math.floor(days), label: '育成日数' });
    if (photos < req.photos) missing.push({ key: 'photos', need: req.photos, have: photos, label: '記録写真' });
    if (req.growth > 0) {
      // 実測がある場合はサイズの伸びを要求。無い場合は写真枚数で代替する
      if (p.metrics.diameter > 0) {
        if (grown < req.growth) {
          missing.push({ key: 'growth', need: req.growth, have: round1(Math.max(0, grown)), label: '実測の伸び(cm)' });
        }
      } else if (photos < req.photos + 2) {
        missing.push({ key: 'photos', need: req.photos + 2, have: photos, label: '記録写真(実測なしの場合)' });
      }
    }
    if (p.care.health < 55) missing.push({ key: 'health', need: 55, have: Math.round(p.care.health), label: '健康' });
    const season = seasonOf(new Date(this.now()));
    if (isDormant(this.species(p), season)) {
      missing.push({ key: 'season', need: 1, have: 0, label: `休眠期(${season.ja})は進化しない` });
    }
    return { ok: missing.length === 0, done: false, missing, req };
  }

  /* 系統の決定。育成の実績値が最も高い軸に寄る */
  decideBranch(p) {
    const g = p.genes;
    const base = p.baseGenes;
    const care = this.careQuality(p);
    const cand = {
      compact: g.compact + (g.compact - base.compact) * 2.2 + (care > 70 ? 12 : 0),
      nishiki: g.variegation * 1.15 + (g.bloom - 50) * 0.3,
      fang: g.spine + (g.spine - base.spine) * 2.0,
      titan: g.vigor + (g.leaf - 50) * 0.6 + (p.metrics.diameter > 0 ? p.metrics.diameter * 1.2 : 0),
    };
    return Object.entries(cand).sort((a, b) => b[1] - a[1])[0][0];
  }

  /* 系統の「今の傾き」。UI で誘導メーターとして見せる */
  branchLean(p) {
    const g = p.genes, base = p.baseGenes, care = this.careQuality(p);
    const raw = {
      compact: g.compact + (g.compact - base.compact) * 2.2 + (care > 70 ? 12 : 0),
      nishiki: g.variegation * 1.15 + (g.bloom - 50) * 0.3,
      fang: g.spine + (g.spine - base.spine) * 2.0,
      titan: g.vigor + (g.leaf - 50) * 0.6 + (p.metrics.diameter > 0 ? p.metrics.diameter * 1.2 : 0),
    };
    const total = Object.values(raw).reduce((a, b) => a + Math.max(1, b), 0);
    return Object.fromEntries(
      Object.entries(raw).map(([k, v]) => [k, Math.round((Math.max(1, v) / total) * 100)])
    );
  }

  evolve(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const check = this.evolveCheck(p);
    if (!check.ok) return { ok: false, message: '進化条件を満たしていません', missing: check.missing };
    const before = this.displayName(p);
    p.stage += 1;
    let branched = null;
    if (p.stage >= 3 && !p.branch) {
      p.branch = this.decideBranch(p);
      branched = BRANCHES[p.branch];
      // 系統確定時に該当能力が一段伸びる
      const key = branched.stat;
      p.genes[key] = Math.round(clamp(p.genes[key] + 14, 1, 100));
      p.baseGenes[key] = p.genes[key];
    }
    p.baseline = { diameter: p.metrics.diameter, leaves: p.metrics.leaves, stageAt: this.now() };
    p.events.unshift({
      t: this.now(), type: 'evolve',
      text: `${before} → ${this.displayName(p)} に進化した`,
    });
    this.state.stats.evolutions++;
    this.state.coins += 120 + p.stage * 60;
    this.registerDex(p);
    this.pushLog(`${this.displayName(p)} に進化！`);
    this.checkQuests();
    this.save();
    return { ok: true, plant: p, before, after: this.displayName(p), branch: branched };
  }

  /* ---- 図鑑 ---- */

  registerDex(p) {
    const d = (this.state.dex[p.speciesId] ||= {
      seen: 0, raised: 0, forms: {}, firstAt: this.now(), stages: {},
    });
    d.seen = Math.max(d.seen, 1);
    d.raised = this.state.plants.filter((x) => x.speciesId === p.speciesId).length;
    d.stages[p.stage] = true;
    if (p.branch) d.forms[p.branch] = true;
    if (p.spriteId) d.sprite = p.spriteId;
  }

  dexProgress() {
    const total = SPECIES.length;
    const seen = Object.keys(this.state.dex).length;
    const forms = Object.values(this.state.dex).reduce((a, d) => a + Object.keys(d.forms || {}).length, 0);
    return { total, seen, forms, maxForms: total * 4, percent: Math.round((seen / total) * 100) };
  }

  /* ---- コミュニティ統計 ----
   * バックエンドを持たないため、品種ごとに決定論的な擬似コホートを生成し、
   * そこへ自分の実データを合成して比較する。数値は「推定値」として表示する。 */
  communityFor(speciesId) {
    const sp = SPECIES_BY_ID[speciesId];
    const week = Math.floor(Date.now() / (DAY * 7));
    const rnd = seededRandom(`${speciesId}:${week}`);
    const growers = 40 + Math.round(rnd() * 900 / sp.rarity);
    const photos = growers * (6 + Math.round(rnd() * 14));
    const waterMean = round1(sp.water + (rnd() - 0.5) * 2.2);
    const luxMean = Math.round(sp.light * 1150 + (rnd() - 0.5) * 12000);
    const hoursMean = round1(6 + (sp.light / 100) * 7 + (rnd() - 0.5) * 1.6);
    const mine = this.state.plants.filter((p) => p.speciesId === speciesId);
    const myWater = mine.map((p) => this.avgWaterInterval(p)).filter(Boolean);
    return {
      growers, photos, waterMean, luxMean, hoursMean,
      myWater: myWater.length ? round1(myWater.reduce((a, b) => a + b, 0) / myWater.length) : null,
      myLux: mine.length ? Math.round(mine.reduce((a, p) => a + this.estimatedLux(p), 0) / mine.length) : null,
      myHours: mine.length ? round1(mine.reduce((a, p) => a + (p.lightHours || 0), 0) / mine.length) : null,
    };
  }

  communityTotals() {
    const week = Math.floor(Date.now() / (DAY * 7));
    const rnd = seededRandom(`totals:${week}`);
    const trainers = 4200 + Math.round(rnd() * 900);
    const photos = trainers * 23 + this.state.stats.photos;
    return {
      species: SPECIES.length,
      trainers,
      photos,
      mySpecies: Object.keys(this.state.dex).length,
      myPhotos: this.state.stats.photos,
    };
  }

  /* ---- 品評会 ---- */

  LEAGUES = [
    { ja: '棚デビュー', min: 0, reward: 120 },
    { ja: '地区大会', min: 260, reward: 240 },
    { ja: '県大会', min: 430, reward: 420 },
    { ja: '全国大会', min: 620, reward: 700 },
    { ja: '世界選手権', min: 830, reward: 1200 },
  ];

  makeRival(league, seedSalt = '') {
    const lg = this.LEAGUES[league];
    const rnd = seededRandom(`rival:${league}:${dayKey(Date.now())}:${seedSalt}`);
    const sp = SPECIES[Math.floor(rnd() * SPECIES.length)];
    const target = lg.min + 120 + rnd() * 190;
    const genes = {};
    for (const k of GENE_KEYS) {
      genes[k] = Math.round(clamp(sp.bias[k] * (0.7 + (target / 900)) + (rnd() - 0.5) * 20, 5, 100));
    }
    return {
      name: `${['棚主', '温室勢', 'ベランダ組', '実生沼', '遮光職人'][Math.floor(rnd() * 5)]}の${sp.ja}`,
      speciesId: sp.id, genes, score: Math.round(target),
      stage: clamp(2 + Math.floor(league / 2), 0, 4),
    };
  }

  contest(id, league) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const lg = this.LEAGUES[league];
    if (!lg) return { ok: false };
    if (this.score(p) < lg.min) return { ok: false, message: `${lg.ja} は総合スコア ${lg.min} 以上が必要です` };
    const rival = this.makeRival(league, p.id + this.state.stats.contests);
    const g = p.genes;
    const categories = [
      { ja: '姿', mine: (g.compact * 1.4 + g.leaf * 0.6) / 2, theirs: (rival.genes.compact * 1.4 + rival.genes.leaf * 0.6) / 2 },
      { ja: '気迫', mine: g.spine, theirs: rival.genes.spine },
      { ja: '色', mine: (g.variegation + g.bloom) / 2, theirs: (rival.genes.variegation + rival.genes.bloom) / 2 },
      { ja: '貫禄', mine: g.vigor * 0.6 + p.stage * 14, theirs: rival.genes.vigor * 0.6 + rival.stage * 14 },
      { ja: '管理', mine: this.careQuality(p), theirs: 45 + league * 9 },
    ].map((c) => ({ ...c, mine: Math.round(c.mine), theirs: Math.round(c.theirs), win: c.mine >= c.theirs }));
    const wins = categories.filter((c) => c.win).length;
    const won = wins >= 3;
    const reward = won ? lg.reward : Math.round(lg.reward * 0.25);
    this.state.coins += reward;
    this.state.stats.contests++;
    if (won) {
      this.state.stats.contestWins++;
      this.state.stats.league = Math.max(this.state.stats.league, Math.min(league + 1, this.LEAGUES.length - 1));
      this.gainExp(p, 60 + league * 40);
      p.events.unshift({ t: this.now(), type: 'contest', text: `${lg.ja} で優勝 (${wins}/5 部門)` });
    } else {
      p.events.unshift({ t: this.now(), type: 'contest', text: `${lg.ja} に出品 (${wins}/5 部門)` });
    }
    this.pushLog(`${lg.ja}: ${won ? '優勝' : '入賞ならず'} — ${p.nickname}`);
    this.checkQuests();
    this.save();
    return { ok: true, won, wins, categories, rival, reward, league: lg };
  }

  /* ---- ラボ(交配) ---- */

  cross(idA, idB) {
    const a = this.plant(idA), b = this.plant(idB);
    if (!a || !b || a.id === b.id) return { ok: false, message: '異なる2株を選んでください' };
    if (a.stage < 3 || b.stage < 3) return { ok: false, message: '交配には成株(段階4)以上が2株必要です' };
    if (this.state.items.seed <= 0) return { ok: false, message: '交配用種子がありません' };
    this.state.items.seed--;

    const rnd = seededRandom(`cross:${a.id}:${b.id}:${Date.now()}`);
    const genes = {};
    for (const k of GENE_KEYS) {
      const mid = (a.genes[k] + b.genes[k]) / 2;
      genes[k] = Math.round(clamp(mid + (rnd() - 0.5) * 22, 1, 100));
    }
    // 突然変異: 斑・巨大化・矮性のいずれかが稀に発現する
    let mutation = null;
    const roll = rnd();
    if (roll < 0.09) {
      genes.variegation = Math.round(clamp(genes.variegation + 38, 1, 100));
      mutation = '斑入りが覚醒した';
    } else if (roll < 0.15) {
      genes.vigor = Math.round(clamp(genes.vigor + 30, 1, 100));
      genes.leaf = Math.round(clamp(genes.leaf + 16, 1, 100));
      mutation = '巨大化の素質が出た';
    } else if (roll < 0.20) {
      genes.compact = Math.round(clamp(genes.compact + 32, 1, 100));
      mutation = '極端な矮性が出た';
    }

    const childSpecies = rnd() < 0.5 ? a.speciesId : b.speciesId;
    const child = createPlant(childSpecies, {
      genes,
      now: this.now(),
      nickname: `${SPECIES_BY_ID[a.speciesId].ja}×${SPECIES_BY_ID[b.speciesId].ja}`,
      parents: [
        { id: a.id, name: this.displayName(a), speciesId: a.speciesId },
        { id: b.id, name: this.displayName(b), speciesId: b.speciesId },
      ],
      hybrid: { a: a.speciesId, b: b.speciesId },
      gen: Math.max(a.gen, b.gen) + 1,
    });
    if (mutation) child.events.unshift({ t: this.now(), type: 'mutation', text: mutation });
    this.state.plants.push(child);
    this.registerDex(child);
    this.pushLog(`交配成功: ${child.nickname}${mutation ? ` — ${mutation}` : ''}`);
    this.checkQuests();
    this.save();
    return { ok: true, child, mutation };
  }

  /* ---- 所持品 / 経済 ---- */

  buy(itemId) {
    const item = SHOP.find((i) => i.id === itemId);
    if (!item) return { ok: false };
    if (this.state.coins < item.price) return { ok: false, message: 'コインが足りません' };
    this.state.coins -= item.price;
    this.state.items[item.id] = (this.state.items[item.id] || 0) + 1;
    this.pushLog(`${item.ja} を購入した`);
    this.save();
    return { ok: true };
  }

  sell(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const price = Math.round(this.score(p) * 1.1 + this.species(p).rarity * 40);
    this.state.coins += price;
    this.state.plants = this.state.plants.filter((x) => x.id !== id);
    this.pushLog(`${this.displayName(p)} を ${price} コインで譲渡した`);
    this.save();
    return { ok: true, price };
  }

  adopt(speciesId) {
    const p = createPlant(speciesId, { now: this.now() });
    this.state.plants.push(p);
    this.registerDex(p);
    this.pushLog(`${SPECIES_BY_ID[speciesId].ja} を迎えた`);
    this.checkQuests();
    this.save();
    return p;
  }

  rename(id, name) {
    const p = this.plant(id);
    if (!p) return;
    p.nickname = String(name).slice(0, 24) || p.nickname;
    this.save();
  }

  /* ---- クエスト ---- */

  checkQuests() {
    let earned = 0;
    const done = [];
    for (const q of QUESTS) {
      if (this.state.quests[q.id]) continue;
      let ok = false;
      try { ok = q.check(this.state); } catch { ok = false; }
      if (ok) {
        this.state.quests[q.id] = { at: this.now() };
        this.state.coins += q.reward;
        earned += q.reward;
        done.push(q);
      }
    }
    if (done.length) {
      this.pushLog(`ミッション達成: ${done.map((d) => d.ja).join(' / ')} (+${earned} コイン)`);
      this.emit('quest', { done, earned });
    }
    return done;
  }

  /* ---- 棚メイトの助言(ルールベース) ---- */
  advice(p) {
    const sp = this.species(p);
    const season = seasonOf(new Date(this.now()));
    const out = [];
    if (isDormant(sp, season)) {
      out.push({ level: 'info', text: `${season.ja}は${sp.ja}の休眠期。水は控えめに、進化は成長期まで待つ。` });
    }
    if (p.care.hydration < 12) out.push({ level: 'warn', text: '完全に乾いている。次の潅水のタイミング。' });
    else if (p.care.hydration > 102) out.push({ level: 'warn', text: '過湿ぎみ。根腐れと害虫のリスクが上がっている。' });
    if (p.pest > 35) out.push({ level: 'danger', text: `害虫レベル ${Math.round(p.pest)}。放置すると個性値が削られる。` });
    if (p.light < sp.light - 20) out.push({ level: 'warn', text: `日照が不足。徒長して締まりが落ちている(適正 ${sp.light})。` });
    if (p.light > sp.light + 20) out.push({ level: 'warn', text: `日照が強すぎる。葉焼けの恐れ(適正 ${sp.light})。` });
    if (p.care.nutrition < 18) out.push({ level: 'info', text: '養分が切れかけ。活力剤で成長力の伸びを支えられる。' });
    if (!p.album.length) out.push({ level: 'info', text: 'まだ写真がない。1枚記録するとドット絵と個性値が実物に同期する。' });
    else if (this.now() - p.lastPhoto > DAY * 14) out.push({ level: 'info', text: '前回の記録から2週間。定点撮影すると変化が比較しやすい。' });
    if (!p.metrics.diameter) out.push({ level: 'info', text: '株幅を実測すると、進化条件の「実測の伸び」が有効になる。' });
    const check = this.evolveCheck(p);
    if (check.ok) out.push({ level: 'good', text: '進化条件を満たしている。進化させられる。' });
    return out;
  }

  /* ---- 開発 / 体験用 ---- */
  warp(days) {
    this.state.warpDays += days;
    this.tick(true);
    this.pushLog(`タイムワープ: ${days}日進めた(体験用)`);
    this.save();
  }

  reset() {
    this.state = freshState();
    this.save();
  }
}

const game = new Game();


return { DAY, seasonOf, growthFactor, isDormant, createPlant, game, SPECIES, SPECIES_BY_ID, STAGES, BRANCHES, SHOP, QUESTS, STARTERS };
})();

/* PIXAGAVE — Creator
