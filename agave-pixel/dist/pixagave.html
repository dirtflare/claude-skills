<title>PIXAGAVE — 育てた実物が、そのままキャラクターになる</title>
<style>
/* PIXAGAVE — design system
 *
 * 方向性:「夜の温室に並んだ標本ラベル」+ ドット絵ゲームの HUD。
 * 角丸とヘアラインをやめ、太い輪郭とぼかしのない硬い影で、
 * 物としてのカード / ラベルの手触りを出す。主役はドット絵なので大きく置く。
 */

:root {
  /* 緑に寄せたニュートラル。純グレーは使わない */
  --bg: #07120e;
  --bg-2: #0a1a14;
  --panel: #0f231c;
  --panel-2: #17332a;
  --line: #27503f;
  --line-2: #3a6e57;

  --ink: #eaf6ee;
  --ink-2: #b6d4c4;
  --dim: #82a796;
  --dim-2: #5c7d6f;

  --agave: #57e0ae;
  --caudex: #f0a33f;
  --succulent: #f58bb0;
  --gold: #ffd25a;
  --danger: #ff6b6b;
  --info: #7fd8ff;
  --accent: var(--agave);

  --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
  --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic Medium", system-ui, sans-serif;

  --rail: 216px;
  --shadow: 6px 6px 0 #00000059;
  --shadow-sm: 3px 3px 0 #00000052;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--jp);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body {
  background-image:
    radial-gradient(900px 520px at 8% -8%, #12362a 0%, transparent 60%),
    radial-gradient(760px 460px at 100% 0%, #123528 0%, transparent 55%);
  background-attachment: fixed;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; }

:focus-visible { outline: 2px solid var(--agave); outline-offset: 2px; }

/* ---------- 文字の役割 ---------- */

.label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 600;
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12.5px; color: var(--dim); line-height: 1.65; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---------- レイアウト ---------- */

.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
}

.rail {
  border-right: 2px solid var(--line);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  background: linear-gradient(180deg, #0a1a1400, #0a1a14cc);
}

.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
.brand .mark {
  width: 32px; height: 32px; flex: none;
  background:
    conic-gradient(from 45deg, var(--agave) 0 25%, #0f231c 0 50%, var(--agave) 0 75%, #0f231c 0);
  border: 2px solid var(--line-2);
}
.brand strong { font-family: var(--mono); letter-spacing: 0.16em; font-size: 13px; display: block; }
.brand span { font-size: 9px; color: var(--dim-2); letter-spacing: 0.14em; font-family: var(--mono); }

.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 10px;
  background: none; border: 2px solid transparent;
  color: var(--dim); text-align: left; font-size: 13.5px;
}
.rail nav button .ico { width: 16px; text-align: center; }
.rail nav button:hover { color: var(--ink); background: #ffffff08; }
.rail nav button[aria-current="true"] {
  color: var(--ink);
  border-color: var(--line-2);
  background: linear-gradient(90deg, #57e0ae1f, transparent 80%);
  box-shadow: var(--shadow-sm);
}
.rail nav button[aria-current="true"] .ico { color: var(--agave); }
.rail nav .badge {
  margin-left: auto; min-width: 18px; height: 18px;
  background: var(--gold); color: #10231a;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  display: grid; place-items: center;
}

.rail-foot { margin-top: auto; display: grid; gap: 8px; }
.wallet {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 10px; border: 2px solid var(--line);
}
.wallet b { font-family: var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; }

.main { min-width: 0; padding: 26px 30px 100px; max-width: 1240px; }

/* ---------- 見出し ---------- */

.page-head { margin-bottom: 22px; display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.page-head h1 {
  margin: 4px 0 0;
  font-size: clamp(26px, 3.4vw, 38px);
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.page-head .lead { color: var(--dim); font-size: 13.5px; margin: 6px 0 0; max-width: 62ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- パネル ---------- */

.panel {
  position: relative;
  background: var(--panel);
  border: 2px solid var(--line);
  box-shadow: var(--shadow);
  padding: 18px;
}
.panel::before {
  content: ""; position: absolute; top: -2px; left: -2px; right: -2px; height: 3px;
  background: var(--accent);
}
.panel > h2 {
  margin: 0 0 14px;
  font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
  font-family: var(--mono); color: var(--ink-2);
  display: flex; align-items: center; gap: 8px;
}
.panel > h2::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.panel h3 { margin: 16px 0 8px; font-size: 14px; }

.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 18px; }

/* ---------- ボタン ---------- */

.btn {
  border: 2px solid var(--line-2);
  background: var(--panel-2);
  color: var(--ink);
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  transition: transform 0.08s, background 0.15s;
}
.btn:hover { background: #1f4133; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #00000052; }
.btn[disabled] { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
.btn.primary {
  background: var(--agave); color: #052018; border-color: #9df3d6;
  text-shadow: none;
}
.btn.primary:hover { background: #7ceec3; }
.btn.gold { background: var(--gold); color: #2a1d02; border-color: #ffe8a3; }
.btn.danger { background: #40201f; color: var(--danger); border-color: #7a3a38; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn.sm { padding: 6px 11px; font-size: 12px; box-shadow: none; }
.btn.big { padding: 14px 26px; font-size: 16px; }
.btn.block { width: 100%; justify-content: center; }

/* ---------- チップ / タイプ ---------- */

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border: 2px solid var(--line-2);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
  color: var(--dim);
}
.chip.on {
  color: #06150f; background: var(--accent); border-color: var(--accent); font-weight: 700;
}
.type-badge {
  display: inline-block; padding: 3px 10px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
  color: #08150f; border: 2px solid #00000033;
}

/* ---------- メーター ---------- */

.meter { display: grid; gap: 5px; }
.meter .lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); }
.meter .lab b { font-family: var(--mono); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.track {
  height: 12px;
  background: #061410;
  border: 2px solid var(--line);
  position: relative;
  overflow: hidden;
}
.track > span {
  display: block; height: 100%;
  background: var(--mc, var(--agave));
  transition: width 0.35s steps(12, end);
}
.track::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 5px, #07120e 5px 7px);
  pointer-events: none;
}
.track.sm { height: 7px; }

/* ---------- スプライト ---------- */

.sprite { image-rendering: pixelated; display: block; width: 100%; height: auto; }
.sprite-frame {
  position: relative;
  aspect-ratio: 1;
  border: 2px solid var(--line);
  background:
    radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 64%),
    repeating-conic-gradient(#ffffff06 0% 25%, transparent 0% 50%) 0 0 / 14px 14px,
    #0a1a14;
  display: grid; place-items: center; padding: 4px; overflow: hidden;
}
.sprite-frame.hero { border-width: 3px; box-shadow: var(--shadow); }
/* 角のしるし */
.sprite-frame::after {
  content: ""; position: absolute; inset: 4px;
  border: 1px solid #ffffff10;
  pointer-events: none;
}

/* ---------- 次にやること ---------- */

.next {
  position: relative;
  border: 3px solid var(--accent);
  background: linear-gradient(115deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--panel) 62%);
  box-shadow: var(--shadow);
  padding: 22px 24px;
  display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
}
.next .n-body { flex: 1; min-width: 240px; }
.next .n-kicker { color: var(--accent); }
.next h2 { margin: 6px 0 6px; font-size: clamp(19px, 2.4vw, 25px); letter-spacing: -0.01em; }
.next p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.next .n-sprite { width: 108px; flex: none; }

/* ---------- 株カード ---------- */

.plant-card {
  position: relative;
  background: var(--panel);
  border: 2px solid var(--line);
  box-shadow: var(--shadow-sm);
  padding: 12px;
  display: grid; gap: 10px;
  text-align: left; width: 100%;
  transition: transform 0.1s, border-color 0.15s;
}
.plant-card:hover { transform: translate(-2px, -2px); border-color: var(--accent); box-shadow: 8px 8px 0 #00000059; }
.plant-card .name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.plant-card .meta { font-size: 11px; color: var(--dim); font-family: var(--mono); }
.plant-card .alert {
  position: absolute; top: -2px; right: -2px;
  background: var(--danger); color: #2a0f0f;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  padding: 2px 6px; letter-spacing: 0.1em;
}

/* ---------- 進化系統図 ---------- */

.evoline { display: grid; gap: 10px; }
.evoline .chain { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.evo-node { flex: none; width: 92px; text-align: center; }
.evo-node .sprite-frame { border-color: var(--line); }
.evo-node.cur .sprite-frame { border-color: var(--accent); border-width: 3px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.evo-node.locked { opacity: 0.9; }
/* 未到達の段階はシルエットで見せる */
.evo-node.locked .sprite { filter: brightness(0.16) saturate(0); }
.dex-cell.locked .sprite { filter: brightness(0.18) saturate(0); }
.evo-node .nm { font-size: 11px; margin-top: 5px; color: var(--ink-2); }
.evo-node.locked .nm { color: var(--dim-2); }
.evo-arrow { color: var(--dim-2); font-size: 18px; flex: none; }
.evo-branches { display: grid; gap: 6px; }

/* ---------- 図鑑 ---------- */

.dex-cell {
  border: 2px solid var(--line);
  background: var(--panel);
  padding: 10px; text-align: center; width: 100%;
  box-shadow: var(--shadow-sm);
  transition: transform 0.1s;
}
.dex-cell:hover { transform: translate(-2px, -2px); border-color: var(--accent); }
.dex-cell.locked { opacity: 0.5; }
.dex-cell .no { font-family: var(--mono); font-size: 10px; color: var(--dim-2); letter-spacing: 0.1em; }
.dex-cell .nm { font-size: 13px; margin-top: 5px; font-weight: 600; }
.forms { display: flex; gap: 3px; justify-content: center; margin-top: 7px; }
.forms i { width: 9px; height: 9px; display: block; background: #ffffff14; border: 1px solid #00000040; }

/* ---------- 個性値 ---------- */

.gene-row {
  display: grid; grid-template-columns: 80px 1fr 52px; gap: 10px; align-items: center;
  font-size: 12.5px; margin-bottom: 7px;
}
.gene-row .val { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.gene-row .delta { font-size: 10px; }

/* ---------- 助言 ---------- */

.advice { display: grid; gap: 8px; margin: 0; padding: 0; }
.advice li {
  list-style: none; padding: 9px 12px;
  border: 2px solid var(--line); border-left-width: 5px;
  font-size: 13px; background: #ffffff05;
}
.advice li.warn { border-left-color: var(--gold); }
.advice li.danger { border-left-color: var(--danger); }
.advice li.good { border-left-color: var(--agave); }
.advice li.info { border-left-color: var(--dim-2); }

/* ---------- タイムライン ---------- */

.timeline .item {
  display: grid; grid-template-columns: 92px 1fr; gap: 14px;
  padding: 14px 0; border-bottom: 2px solid var(--line);
}
.timeline .when { font-family: var(--mono); font-size: 10.5px; color: var(--dim-2); margin-bottom: 5px; }
.timeline img.thumb { border: 2px solid var(--line); }

/* 比較スライダー */
.compare {
  position: relative; aspect-ratio: 1; overflow: hidden;
  border: 2px solid var(--line); user-select: none; touch-action: none; cursor: ew-resize;
}
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .after { clip-path: inset(0 0 0 var(--split, 50%)); }
.compare .handle { position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 3px; background: var(--agave); }
.compare .handle::after {
  content: "◀▶"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 10px; color: #052018; background: var(--agave); padding: 3px 6px;
}
.compare .cap {
  position: absolute; bottom: 8px; padding: 3px 8px; background: #04120dee;
  font-family: var(--mono); font-size: 10px;
}
.compare .cap.l { left: 8px; }
.compare .cap.r { right: 8px; }

/* ---------- モーダル / トースト ---------- */

.modal-back {
  position: fixed; inset: 0; z-index: 60;
  background: #020a07d8;
  display: grid; place-items: center; padding: 18px;
  animation: fade 0.15s ease;
}
.modal {
  width: min(760px, 100%); max-height: 88vh; overflow: auto;
  background: var(--panel);
  border: 3px solid var(--line-2);
  box-shadow: 10px 10px 0 #00000066;
  padding: 22px;
}
.modal header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.modal h2 { margin: 0; font-size: 19px; }

.toasts {
  position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
  display: grid; gap: 8px; z-index: 80; width: min(460px, calc(100vw - 28px));
}
.toast {
  background: var(--panel-2);
  border: 2px solid var(--line-2); border-left: 6px solid var(--agave);
  box-shadow: var(--shadow-sm);
  padding: 11px 14px; font-size: 13.5px;
  animation: rise 0.18s ease;
}
.toast.bad { border-left-color: var(--danger); }
.toast.gold { border-left-color: var(--gold); }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* ---------- 進化演出 ---------- */

.evolve-scene { text-align: center; display: grid; gap: 16px; justify-items: center; }
.evolve-pair { display: flex; align-items: center; gap: 20px; }
.evolve-pair .sprite-frame { width: 150px; }
.evolve-pair .arrow { font-size: 30px; color: var(--gold); animation: blink 0.9s steps(2, end) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.flash {
  position: fixed; inset: 0; z-index: 70; pointer-events: none;
  background: radial-gradient(circle at 50% 42%, #fff, var(--agave) 32%, transparent 64%);
  opacity: 0; animation: flash 1s ease;
}
@keyframes flash { 0% { opacity: 0; } 20% { opacity: 0.9; } 100% { opacity: 0; } }

/* ---------- フォーム ---------- */

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label { font-size: 12px; color: var(--dim); }
.field input[type="text"], .field input[type="number"], .field select, .field textarea {
  background: #061410; border: 2px solid var(--line); padding: 10px 12px; width: 100%;
}
.field input[type="range"] { width: 100%; accent-color: var(--agave); }
.dropzone {
  border: 3px dashed var(--line-2); padding: 30px; text-align: center;
  color: var(--dim); background: #ffffff04;
}
.dropzone.over { border-color: var(--agave); background: #57e0ae14; color: var(--ink); }

/* 選択式のカードラジオ */
.pick { display: grid; gap: 8px; }
.pick button {
  display: flex; gap: 12px; align-items: baseline; text-align: left;
  border: 2px solid var(--line); background: var(--panel); padding: 12px 14px; width: 100%;
}
.pick button[aria-pressed="true"] { border-color: var(--agave); background: #57e0ae14; }
.pick button b { font-size: 14px; }
.pick button span { font-size: 12px; color: var(--dim); }

/* ---------- チェックリスト ---------- */

.checks { display: grid; gap: 8px; }
.checks li { list-style: none; display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.checks .box {
  width: 20px; height: 20px; flex: none; border: 2px solid var(--line-2);
  display: grid; place-items: center; font-size: 12px; color: var(--bg);
}
.checks li.done .box { background: var(--agave); border-color: var(--agave); }
.checks li.done { color: var(--dim); text-decoration: line-through; }

/* ---------- 下部ナビ ---------- */

.tabbar { display: none; }

@media (max-width: 940px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .main { padding: 16px 14px 110px; }
  .next { padding: 18px; gap: 14px; }
  .next .n-sprite { width: 84px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: #08170f; border-top: 2px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    background: none; border: 0; color: var(--dim);
    padding: 10px 2px 9px; display: grid; gap: 3px; justify-items: center; font-size: 10px;
  }
  .tabbar button .ico { font-size: 17px; }
  .tabbar button[aria-current="true"] { color: var(--agave); box-shadow: inset 0 3px 0 var(--agave); }
  .mobile-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
}
@media (min-width: 941px) { .mobile-head { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>

<script type="module">
/* ---- data.js ---- */
const __m_data = (() => {

/* PIXAGAVE — 静的データ定義
 * 品種図鑑 / タイプ / 性格 / 遺伝子 / 進化系統 / 時間設定 / アイテム / 文言
 * すべてオリジナル定義。外部アセットへの依存なし。
 */

/* ---------- 時間 ---------- */

/* すべての育成日数は「ゲーム日」で数え、リアル時間との換算をここで決める。
 * 既定は「ふつう」= 1ゲーム日が 1 実時間。完成株まで実時間 16〜20 時間ほど。 */
const PACES = {

/* PIXAGAVE — 永続化層
 * ゲーム状態は localStorage、画像(元写真 / スプライト)は IndexedDB。
 * 画像を localStorage に入れると 5MB 制限を即座に超えるため分離している。
 */

const DB_NAME = 'pixagave';
const DB_VERSION = 1;
const IMG_STORE = 'images';
const SAVE_KEY = 'pixagave.save.v1';

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in globalThis)) {
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IMG_STORE)) {
        db.createObjectStore(IMG_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

/* IndexedDB が使えない環境(プライベートモード等)向けのメモリフォールバック */
const memoryImages = new Map();

async function putImage(key, dataUrl) {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).put(dataUrl, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    memoryImages.set(key, dataUrl);
  }
  return key;
}

async function getImage(key) {
  if (!key) return null;
  if (memoryImages.has(key)) return memoryImages.get(key);
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).get(key);
      req.onsuccess = () => resolve(req.result ?? null);
      req.onerror = () => reject(req.error);
    });
  } catch {
    return null;
  }
}

async function deleteImage(key) {
  memoryImages.delete(key);
  try {
    const db = await openDB();
    await new Promise((resolve) => {
      const tx = db.transaction(IMG_STORE, 'readwrite');
      tx.objectStore(IMG_STORE).delete(key);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch {
    /* noop */
  }
}

async function allImageKeys() {
  try {
    const db = await openDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(IMG_STORE, 'readonly');
      const req = tx.objectStore(IMG_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  } catch {
    return [...memoryImages.keys()];
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function writeSave(state) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    return true;
  } catch (err) {
    console.warn('[pixagave] save failed', err);
    return false;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch {
    /* noop */
  }
}

/* 書き出し: 状態 + 画像をひとつの JSON にまとめる(機種変更・バックアップ用) */
async function exportAll(state) {
  const keys = await allImageKeys();
  const images = {};
  for (const k of keys) {
    const v = await getImage(k);
    if (v) images[k] = v;
  }
  return JSON.stringify({ format: 'pixagave-export', version: 1, state, images });
}

async function importAll(json) {
  const parsed = JSON.parse(json);
  if (parsed.format !== 'pixagave-export') throw new Error('形式が違います');
  for (const [k, v] of Object.entries(parsed.images || {})) {

  return parsed.state;
}

  const grow = 0.5 + stage * 0.14;
  const h = n * 0.34 * grow;
  const wBot = n * 0.22 * grow, wTop = wBot * 0.42;

  const trunk = [
    [cx - wBot, base], [cx - wTop, base - h],
    [cx + wTop, base - h], [cx + wBot, base],
  ];
  g.poly(trunk, mid);
  g.poly([[cx - wBot * 0.9, base], [cx - wTop * 0.7, base - h * 0.95], [cx - wTop * 0.1, base - h * 0.95], [cx - wBot * 0.15, base]], light);
  g.poly([[cx + wBot * 0.3, base], [cx + wTop * 0.3, base - h * 0.9], [cx + wTop, base - h], [cx + wBot, base]], dark);
  // 荒れた樹皮
  for (let i = 0; i < h * 1.6; i++) {
    const y = base - rnd() * h;
    const w = wBot + (wTop - wBot) * ((base - y) / h);
    const x = cx + (rnd() - 0.5) * w * 1.7;
    g.line(x, y, x + (rnd() - 0.5) * 3, y + 1, mix(dark, edge, 0.5));
  }
  g.stroke(trunk, edge);
  // 枝と細かい葉
  const branches = 2 + Math.floor(stage / 2);
  for (let b = 0; b < branches; b++) {
    const a = -Math.PI / 2 + (b - (branches - 1) / 2) * 0.5;
    let x = cx + Math.cos(a) * wTop * 0.6, y = base - h;
    const len = n * 0.16 * grow;
    for (let s = 0; s < len; s++) {
      x += Math.cos(a); y += Math.sin(a);
      g.set(x, y, edge);
      if (s % 2 === 0 && s > 2) {
        g.set(x + 1, y - 1, leafC);
        g.set(x - 1, y - 1, mix(leafC, dark, 0.35));
      }
    }
  }
}

function drawAdenium(g, { sp, genes, stage, rnd }) {
  const [dark, mid, light, edge, flower] = sp.palette;
  const n = g.n;
  const cx = n / 2, base = n * 0.80;
  const grow = 0.5 + stage * 0.14;
  const rx = n * 0.19 * grow, ry = n * 0.15 * grow;

  // 二股の塊根
  g.ellipse(cx - rx * 0.45, base - ry * 0.7, rx * 0.75, ry, mid);
  g.ellipse(cx + rx * 0.45, base - ry * 0.7, rx * 0.75, ry, mid);
  g.ellipse(cx, base - ry * 1.5, rx * 0.85, ry * 1.1, mid);
  g.ellipse(cx - rx * 0.4, base - ry * 1.7, rx * 0.5, ry * 0.6, light);
  g.ellipse(cx + rx * 0.6, base - ry * 0.9, rx * 0.4, ry * 0.5, dark);

  // 枝
  const branches = 2 + Math.floor(stage * 0.8);
  for (let b = 0; b < branches; b++) {
    const a = -Math.PI / 2 + (b - (branches - 1) / 2) * 0.44;
    let x = cx + Math.cos(a) * rx * 0.4, y = base - ry * 2.2;
    const len = n * 0.14 * grow;
    for (let s = 0; s < len; s++) {

function drawTurtle(g, { sp, genes, stage, rnd }) {
  const [dark, mid, light, edge, vine] = sp.palette;
  const n = g.n;
  const cx = n / 2, base = n * 0.82;
  const grow = 0.5 + stage * 0.14;
  const rx = n * 0.26 * grow, ry = n * 0.20 * grow;

  // 蔓(奥)
  for (let b = 0; b < 2 + Math.floor(stage / 2); b++) {
    let x = cx + (b - 0.5) * rx * 0.7, y = base - ry * 1.6;
    let a = -Math.PI / 2 + (rnd() - 0.5) * 0.6;
    for (let s = 0; s < n * 0.2 * grow; s++) {
      a += (rnd() - 0.5) * 0.24;
      x += Math.cos(a); y += Math.sin(a);
      g.set(x, y, mix(vine, dark, 0.3));
      if (s % 4 === 0 && s > 3) {

  // 亀甲状の割れ目
  const plates = 4 + Math.floor(stage);
  for (let i = 0; i < plates; i++) {
    for (let j = 0; j < plates; j++) {
      const px = cx - rx + (i + 0.5) * (rx * 2 / plates);
      const py = base - ry * 2 + (j + 0.5) * (ry * 2 / plates);
      const dx = (px - cx) / rx, dy = (py - (base - ry)) / ry;
      if (dx * dx + dy * dy > 0.92) continue;
      const s = (rx / plates) * 0.78;
      g.poly([[px, py - s], [px + s, py], [px, py + s], [px - s, py]],
        mix(light, mid, 0.25 + rnd() * 0.4));
      g.stroke([[px, py - s], [px + s, py], [px, py + s], [px - s, py]], edge);
    }
  }
  g.ellipse(cx - rx * 0.5, base - ry * 1.35, rx * 0.3, ry * 0.3, mix(light, '#ffffff', 0.25));
}

function drawEcheveria(g, { sp, genes, stage, rnd }) {
  const [dark, mid, light, edgeC, tip] = sp.palette;
  const n = g.n;
  const cx = n / 2, cy = n * 0.56;
  const grow = 0.5 + stage * 0.135;
  const rings = 2 + Math.floor(stage * 0.7);
  const R = n * 0.34 * grow;

  for (let ring = rings; ring >= 0; ring--) {
    const rr = R * ((ring + 0.6) / (rings + 0.6));
    const count = 5 + ring * 4;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + ring * 0.6;
      const lx = cx + Math.cos(a) * rr * 0.78;
      const ly = cy + Math.sin(a) * rr * 0.56;
      const size = (2.4 + (genes.leaf / 100) * 2.6) * grow * (1 - ring * 0.06);
      const body = ring === rings ? dark : mix(mid, light, (rings - ring) / (rings + 1));
      const pts = leafPoly(lx - Math.cos(a) * size * 0.6, ly - Math.sin(a) * size * 0.42,

      g.poly(pts, body);
      g.poly(shrink(pts, 0.5, -0.4, -0.5), mix(body, light, 0.5));
      // 葉先の紅葉
      g.set(lx + Math.cos(a) * size * 1.1, ly + Math.sin(a) * size * 0.8, edgeC);
      if (genes.variegation > 50) g.set(lx + Math.cos(a) * size * 0.9, ly + Math.sin(a) * size * 0.65, tip);
      g.stroke(pts, mix(dark, edgeC, 0.25));
    }
  }
}

function drawHaworthia(g, { sp, genes, stage, rnd }) {
  const [dark, mid, light, window, windowLite] = sp.palette;
  const n = g.n;
  const cx = n / 2, cy = n * 0.80;
  const grow = 0.5 + stage * 0.14;
  const count = Math.round(7 + stage * 2);
  for (const layer of [0, 1]) {
    const c = layer === 0 ? Math.round(count * 0.6) : count;
    for (let i = 0; i < c; i++) {
      const t = c === 1 ? 0.5 : i / (c - 1);
      const angle = -Math.PI / 2 + (t - 0.5) * Math.PI * 0.72;
      const len = n * 0.36 * grow * (layer === 0 ? 0.8 : 1) * (0.78 + 0.22 * Math.sin(Math.PI * t));
      const pts = leafPoly(cx, cy, angle, len, 3.2 * grow, (t - 0.5) * 0.9, 0.1);
      g.poly(pts, layer === 0 ? dark : mid);

      g.poly(shrink(win, 0.5, -0.4, -0.8), windowLite);

function drawLithops(g, { sp, genes, stage, rnd }) {
  const [dark, mid, light, mark, flowerC] = sp.palette;
  const n = g.n;
  const cx = n / 2, cy = n * 0.72;
  const grow = 0.55 + stage * 0.12;
  const rx = n * 0.15 * grow, ry = n * 0.17 * grow;
  const pairs = 1 + Math.floor(stage / 2);

  for (let p = 0; p < pairs; p++) {
    const ox = cx + (p - (pairs - 1) / 2) * rx * 2.5;
    for (const side of [-1, 1]) {
      const bx = ox + side * rx * 0.55;
      g.ellipse(bx, cy, rx, ry, mid);
      g.ellipse(bx, cy - ry * 0.35, rx * 0.9, ry * 0.55, light);

      }
      g.set(ox, cy - ry * 0.5, '#FFF6D8');
    }
  }
}

  glow.addColorStop(0, branch ? `${branch.color}30` : '#57E0AE18');

  const potW = Math.round(26 + stage * 4);
  const potH = Math.round(14 + stage * 2);
  const potX = Math.round((CHAR - potW) / 2);
  const potY = CHAR - potH - 8;

  // 影
  ctx.fillStyle = '#00120c55';
  ctx.fillRect(potX - 3, CHAR - 8, potW + 6, 3);
  ctx.fillRect(potX - 1, CHAR - 5, potW + 2, 2);

  // 株
  const scale = (0.62 + stage * 0.095) * (info.branch === 'titan' ? 1.1 : 1);
  const squash = info.branch === 'compact' ? 0.9 : 1;
  const pw = Math.round(CHAR * scale);
  const ph = Math.round(pw * squash);
  const pxx = Math.round((CHAR - pw) / 2);
  const pyy = Math.round(potY - ph + potH * 0.45);
  ctx.drawImage(plantImg, pxx, Math.max(-4, pyy), pw, ph);

  // 鉢
  const clay = info.world === 'caudex' ? ['#8A6242', '#A0764F', '#5E4530'] : ['#5E4A3A', '#755C47', '#3F3126'];
  for (let y = 0; y < potH; y++) {
    const inset = Math.round((y / potH) * 3);
    ctx.fillStyle = clay[0];
    ctx.fillRect(potX + inset, potY + y, potW - inset * 2, 1);
  }
  ctx.fillStyle = clay[2];
  ctx.fillRect(potX + potW - 6, potY + 3, 4, potH - 4);
  ctx.fillStyle = '#ffffff22';
  ctx.fillRect(potX + 3, potY + 3, 3, potH - 6);
  ctx.fillStyle = clay[1];
  ctx.fillRect(potX - 2, potY, potW + 4, 3);
  // 用土
  ctx.fillStyle = '#3A2F26';
  ctx.fillRect(potX + 1, potY - 2, potW - 2, 3);
  for (let i = 0; i < potW / 2.5; i++) {
    ctx.fillStyle = ['#55483B', '#6B5A48', '#403428'][Math.floor(rnd() * 3)];
    ctx.fillRect(Math.round(potX + 2 + rnd() * (potW - 5)), Math.round(potY - 2 + rnd() * 3), 1, 1);
  }

  // 系統の演出
  if (stage >= 3 && branch) {
    ctx.fillStyle = branch.color;
    for (let i = 0; i < 5; i++) {
      const a = rnd() * Math.PI * 2;
      const r = CHAR * (0.3 + rnd() * 0.14);
      ctx.fillRect(Math.round(CHAR / 2 + Math.cos(a) * r), Math.round(CHAR * 0.44 + Math.sin(a) * r * 0.8), 2, 2);
    }
  }
  if (stage === 4) {
    ctx.fillStyle = '#FFD25A';
    ctx.fillRect(CHAR / 2 - 5, 5, 10, 2);
    ctx.fillRect(CHAR / 2 - 5, 3, 2, 2);
    ctx.fillRect(CHAR / 2 + 3, 3, 2, 2);
    ctx.fillRect(CHAR / 2 - 1, 1, 2, 3);
  }
  if (info.pest > 30) {
    for (let i = 0; i < Math.round(info.pest / 22); i++) {
      ctx.fillStyle = '#C6E85E';
      ctx.fillRect(Math.round(CHAR * 0.28 + rnd() * CHAR * 0.44), Math.round(CHAR * 0.3 + rnd() * CHAR * 0.36), 2, 2);
    }
  }
  return c;
}

    const dst = new Uint8Array(size * size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let hit = op === 'erode' ? 1 : 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            const v = nx < 0 || ny < 0 || nx >= size || ny >= size ? 0 : src[ny * size + nx];
            if (op === 'erode') hit &= v;
            else hit |= v;
          }
        }
        dst[y * size + x] = hit;
      }
    }
    src = dst;
  }
  return src;
}

/* 中央に最も近い最大連結成分だけを残す */
function largestComponent(mask, size) {
  const label = new Int32Array(size * size).fill(-1);
  const stack = new Int32Array(size * size);
  let best = null;
  let id = 0;
  const cx = size / 2, cy = size / 2;

  for (let start = 0; start < mask.length; start++) {
    if (!mask[start] || label[start] !== -1) continue;
    let sp = 0;
    stack[sp++] = start;
    label[start] = id;
    let count = 0;
    let sumx = 0, sumy = 0;
    while (sp > 0) {
      const p = stack[--sp];
      count++;
      const x = p % size, y = (p / size) | 0;
      sumx += x; sumy += y;
      for (let k = 0; k < 4; k++) {
        const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0);
        const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
        const np = ny * size + nx;
        if (mask[np] && label[np] === -1) {
          label[np] = id;
          stack[sp++] = np;
        }
      }
    }
    const dist = Math.hypot(sumx / count - cx, sumy / count - cy) / size;
    const weight = count * (1 - clamp01(dist) * 0.75); // 中央寄りを優遇
    if (!best || weight > best.weight) best = { id, weight, count };
    id++;
  }
  if (!best) return mask;
  const out = new Uint8Array(size * size);
  for (let p = 0; p < out.length; p++) out[p] = label[p] === best.id ? 1 : 0;
  return out;
}

/* 穴埋め: 外周から到達できない 0 領域を 1 にする */
function fillHoles(mask, size) {
  const outside = new Uint8Array(size * size);
  const stack = [];
  for (let x = 0; x < size; x++) {
    stack.push(x, (size - 1) * size + x);
  }
  for (let y = 0; y < size; y++) {
    stack.push(y * size, y * size + size - 1);
  }
  while (stack.length) {
    const p = stack.pop();
    if (p < 0 || p >= mask.length || outside[p] || mask[p]) continue;
    outside[p] = 1;
    const x = p % size, y = (p / size) | 0;
    if (x > 0) stack.push(p - 1);
    if (x < size - 1) stack.push(p + 1);
    if (y > 0) stack.push(p - size);
    if (y < size - 1) stack.push(p + size);
  }
  const out = new Uint8Array(mask);
  for (let p = 0; p < out.length; p++) if (!outside[p]) out[p] = 1;
  return out;
}

/* ---------- 2. グリッド縮小 ---------- */

function downsample(data, size, mask, grid) {
  // マスクの外接矩形を正方形に整えてから grid×grid へ
  let minX = size, minY = size, maxX = -1, maxY = -1;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (mask[y * size + x]) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = size - 1; maxY = size - 1; }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const side = Math.max(w, h);
  const ox = minX - (side - w) / 2;
  const oy = minY - (side - h) / 2;

  const cells = new Array(grid * grid);
  const cell = side / grid;
  for (let gy = 0; gy < grid; gy++) {
    for (let gx = 0; gx < grid; gx++) {
      let r = 0, g = 0, b = 0, n = 0, tot = 0;
      const x0 = Math.floor(ox + gx * cell), x1 = Math.ceil(ox + (gx + 1) * cell);
      const y0 = Math.floor(oy + gy * cell), y1 = Math.ceil(oy + (gy + 1) * cell);
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          if (x < 0 || y < 0 || x >= size || y >= size) { tot++; continue; }
          tot++;
          if (!mask[y * size + x]) continue;
          const i = (y * size + x) * 4;
          r += data[i]; g += data[i + 1]; b += data[i + 2];
          n++;
        }
      }
      const cover = tot ? n / tot : 0;
      cells[gy * grid + gx] = n
        ? { r: r / n, g: g / n, b: b / n, cover }
        : { r: 0, g: 0, b: 0, cover: 0 };
    }
  }
  return { cells, bbox: { minX, minY, maxX, maxY, side } };
}

/* ---------- 3. 減色 (k-means) ---------- */

function kmeans(points, k, iterations = 14) {
  if (!points.length) return [];
  k = Math.min(k, points.length);
  // 輝度順に等間隔サンプリングして初期中心を決める(k-means++ の簡易版)
  const sorted = [...points].sort((a, b) => lumaOf(a[0], a[1], a[2]) - lumaOf(b[0], b[1], b[2]));
  const centers = [];
  for (let i = 0; i < k; i++) {
    centers.push([...sorted[Math.floor(((i + 0.5) / k) * (sorted.length - 1))]]);
  }
  const assign = new Int32Array(points.length);
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let p = 0; p < points.length; p++) {
      let bi = 0, bd = Infinity;
      for (let c = 0; c < centers.length; c++) {
        const dr = points[p][0] - centers[c][0];
        const dg = points[p][1] - centers[c][1];
        const db = points[p][2] - centers[c][2];
        const d = dr * dr + dg * dg + db * db;
        if (d < bd) { bd = d; bi = c; }
      }
      if (assign[p] !== bi) { assign[p] = bi; moved = true; }
    }
    const sums = centers.map(() => [0, 0, 0, 0]);
    for (let p = 0; p < points.length; p++) {
      const s = sums[assign[p]];
      s[0] += points[p][0]; s[1] += points[p][1]; s[2] += points[p][2]; s[3]++;
    }
    for (let c = 0; c < centers.length; c++) {
      if (sums[c][3] > 0) {
        centers[c] = [sums[c][0] / sums[c][3], sums[c][1] / sums[c][3], sums[c][2] / sums[c][3]];
      }
    }
    if (!moved && it > 2) break;
  }
  const weights = new Array(centers.length).fill(0);
  for (let p = 0; p < points.length; p++) weights[assign[p]]++;
  return centers.map((c, i) => ({ rgb: c, weight: weights[i] / points.length }));
}

/* 中心色を「ドット絵らしい」色に整える。
 * 元写真の色相は残しつつ、彩度と明度を段階化して情報量を落とす。 */
function stylize(rgb, speciesHue, strength = 0.14) {
  let [h, s, l] = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  // 種の基調色相へ少しだけ引き寄せる(個体差は残す)
  let gap = speciesHue - h;
  if (gap > 180) gap -= 360;
  if (gap < -180) gap += 360;
  h += gap * strength;
  s = clamp01(Math.round(clamp01(s * 1.22) * 6) / 6);
  l = clamp(Math.round(l * 9) / 9, 0.06, 0.95);
  return hslToRgb(h, s, l);
}

const BAYER4 = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5],
];

/* ---------- 4. 個性値の解析 ---------- */

function analyze(cells, grid, species) {
  const inside = [];
  let area = 0, perimeter = 0;
  const rows = new Array(grid).fill(0);
  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const c = cells[y * grid + x];
      if (c.cover < 0.42) continue;
      area++;
      rows[y]++;
      inside.push({ x, y, ...c });
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        const n = nx < 0 || ny < 0 || nx >= grid || ny >= grid ? null : cells[ny * grid + nx];
        if (!n || n.cover < 0.42) perimeter++;
      }
    }
  }
  if (!area) {
    return { raw: {}, hue: speciesHueOf(species), area: 0 };
  }

  const lums = inside.map((c) => lumaOf(c.r, c.g, c.b));
  const meanL = lums.reduce((a, b) => a + b, 0) / lums.length;
  const sd = Math.sqrt(lums.reduce((a, b) => a + (b - meanL) ** 2, 0) / lums.length);

  let hx = 0, hy = 0, satSum = 0;
  let brightPale = 0, highlight = 0;
  for (const c of inside) {
    const [h, s, l] = rgbToHsl(c.r, c.g, c.b);
    hx += Math.cos((h * Math.PI) / 180) * s;
    hy += Math.sin((h * Math.PI) / 180) * s;
    satSum += s;
    if (l > 0.62 && s < 0.24) brightPale++;              // 白粉・粉質
    if (lumaOf(c.r, c.g, c.b) > meanL + sd * 1.05 && s > 0.16) highlight++; // 斑・覆輪
  }
  const meanHue = ((Math.atan2(hy, hx) * 180) / Math.PI + 360) % 360;
  const meanSat = satSum / inside.length;

  // 締まり: 外接円に対する充填率が高いほど「詰まっている」
  const bboxArea = grid * grid;
  const compactness = area / bboxArea;
  // 棘・鋸歯: 面積あたりの輪郭長。ギザギザなほど大きい
  const roughness = perimeter / (4 * Math.sqrt(area));
  // 葉幅: 行ごとの被覆長の平均(幅広ほど大)
  const meanRow = rows.filter((r) => r > 0).reduce((a, b) => a + b, 0) / rows.filter((r) => r > 0).length;
  const leafiness = meanRow / grid;

  const raw = {
    leaf: clamp(leafiness * 150 - 10, 0, 100),
    compact: clamp(compactness * 210, 0, 100),
    spine: clamp((roughness - 1.05) * 118, 0, 100),
    variegation: clamp((highlight / area) * 330, 0, 100),
    bloom: clamp((brightPale / area) * 280, 0, 100),
    vigor: clamp(meanSat * 105 + compactness * 45, 0, 100),
  };
  return { raw, hue: meanHue, area, contrast: sd / 64, meanSat };
}

/* 解析値と種のバイアスを合成して確定した個性値にする */
function mixGenes(raw, species, luck = Math.random) {
  const out = {};
  for (const key of ['leaf', 'compact', 'spine', 'variegation', 'bloom', 'vigor']) {
    const photo = raw && Number.isFinite(raw[key]) ? raw[key] : 50;
    const bias = species.bias[key];
    const jitter = (luck() - 0.5) * 12;
    out[key] = Math.round(clamp(photo * 0.55 + bias * 0.45 + jitter, 1, 100));
  }
  return out;
}

/* ---------- 5. 本体 ---------- */

/**
 * 写真をドット絵スプライトに変換する。
 * @param {HTMLImageElement} img
 * @param {{species: object, grid?: number, colors?: number, dither?: boolean}} opts
 * @returns {{sprite: string, thumb: string, grid: number, analysis: object}}
 */
function pixelizePhoto(img, opts = {}) {
  const species = opts.species || { hue: 150, bias: {} };
  const hue = speciesHueOf(species);
  const grid = opts.grid || 44;
  const colors = opts.colors || 8;
  const dither = opts.dither !== false;

  const imageData = squareCrop(img, WORK);
  const data = imageData.data;

  let { mask } = buildMask(data, WORK);
  mask = morph(mask, WORK, 'dilate', 1);
  mask = morph(mask, WORK, 'erode', 2);
  mask = morph(mask, WORK, 'dilate', 1);
  mask = largestComponent(mask, WORK);
  mask = fillHoles(mask, WORK);

  // マスクが小さすぎる / 大きすぎる場合は主題抽出に失敗しているので中央円にフォールバック
  let covered = 0;
  for (let p = 0; p < mask.length; p++) covered += mask[p];
  const ratio = covered / mask.length;
  if (ratio < 0.045 || ratio > 0.97) {
    mask = new Uint8Array(WORK * WORK);
    const r = WORK * 0.42;
    for (let y = 0; y < WORK; y++) {
      for (let x = 0; x < WORK; x++) {
        if (Math.hypot(x - WORK / 2, y - WORK / 2) <= r) mask[y * WORK + x] = 1;
      }
    }
  }

  const { cells } = downsample(data, WORK, mask, grid);
  const analysis = analyze(cells, grid, species);

  const points = cells.filter((c) => c.cover >= 0.42).map((c) => [c.r, c.g, c.b]);
  const centers = kmeans(points, colors);
  const palette = centers.map((c) => stylize(c.rgb, hue));

  // --- 描画 ---
  const out = makeCanvas(grid, grid);
  const octx = out.getContext('2d', { willReadFrequently: true });
  const outData = octx.createImageData(grid, grid);

  const nearest = (r, g, b) => {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < centers.length; i++) {
      const dr = r - centers[i].rgb[0], dg = g - centers[i].rgb[1], db = b - centers[i].rgb[2];
      const d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  };

  const solid = (x, y) =>
    x >= 0 && y >= 0 && x < grid && y < grid && cells[y * grid + x].cover >= 0.42;

  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const idx = (y * grid + x) * 4;
      const c = cells[y * grid + x];
      if (c.cover < 0.42) {
        // 輪郭: 実体に隣接する空白セルを暗色で縁取る
        const touching = solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1);
        if (touching && c.cover > 0.12) {
          outData.data[idx] = 12;
          outData.data[idx + 1] = 26;
          outData.data[idx + 2] = 20;
          outData.data[idx + 3] = 235;
        } else {
          outData.data[idx + 3] = 0;
        }
        continue;
      }
      let r = c.r, g = c.g, b = c.b;
      if (dither) {
        const t = (BAYER4[y & 3][x & 3] / 16 - 0.5) * 26;
        r += t; g += t; b += t;
      }
      const pi = nearest(r, g, b);
      let [pr, pg, pb] = palette[pi] || [80, 120, 90];

      // 擬似ライティング: 左上から光が当たっている前提で縁を持ち上げ、右下を落とす
      const upLeftOpen = !solid(x - 1, y) || !solid(x, y - 1);
      const downRightOpen = !solid(x + 1, y) || !solid(x, y + 1);
      if (upLeftOpen && !downRightOpen) {
        const [h, s, l] = rgbToHsl(pr, pg, pb);
        [pr, pg, pb] = hslToRgb(h, s * 0.92, clamp01(l + 0.11));
      } else if (downRightOpen && !upLeftOpen) {
        const [h, s, l] = rgbToHsl(pr, pg, pb);
        [pr, pg, pb] = hslToRgb(h, clamp01(s * 1.05), clamp01(l - 0.1));
      }

      outData.data[idx] = pr;
      outData.data[idx + 1] = pg;
      outData.data[idx + 2] = pb;
      outData.data[idx + 3] = 255;
    }
  }
  octx.putImageData(outData, 0, 0);

  // サムネイル(元写真の縮小版。アルバム表示用に 320px の JPEG で保持)
  const thumbSize = 320;
  const tc = makeCanvas(thumbSize, thumbSize);
  const tctx = tc.getContext('2d');
  const side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
  tctx.drawImage(
    img,
    ((img.naturalWidth || img.width) - side) / 2,
    ((img.naturalHeight || img.height) - side) / 2,
    side, side, 0, 0, thumbSize, thumbSize
  );

  return {
    sprite: out.toDataURL('image/png'),
    thumb: tc.toDataURL('image/jpeg', 0.72),
    grid,
    analysis,
    palette: palette.map(([r, g, b]) => `rgb(${r},${g},${b})`),
  };
}

/* 与えられたスプライト dataURL を n 倍に拡大した canvas を返す(共有画像生成用) */
async function scaleSprite(dataUrl, scale) {
  const img = await loadImageFromUrl(dataUrl);
  const c = makeCanvas(img.width * scale, img.height * scale);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

return { loadImageFromFile, loadImageFromUrl, mixGenes, pixelizePhoto, scaleSprite };

      p.album ||= [];
      p.events ||= [];
      p.metrics ||= { diameter: 0, leaves: 0, height: 0 };
      p.nature ||= NATURES[0];
      p.seed ||= p.id;
      if (typeof p.bornDay !== 'number') p.bornDay = 0;
      if (typeof p.lastWaterDay !== 'number') p.lastWaterDay = this.state.clock;
      if (typeof p.lastPhotoDay !== 'number') p.lastPhotoDay = -99;
      p.baseline = { diameter: p.baseline?.diameter || 0, stageAtDay: p.baseline?.stageAtDay ?? 0 };
    }
  }

  save() {
    writeSave(this.state);
    this.emit('change');
  }

  emit(type, detail) {
    this.dispatchEvent(new CustomEvent(type, { detail }));
  }

  /* ---- 時間 ---- */

  get pace() {
    return PACES[this.state.settings.pace] || PACES.normal;
  }
  get msPerGameDay() {
    return this.pace.realMinutesPerDay * 60000;
  }
  get clock() {
    return this.state.clock;
  }
  /** ゲーム日数 → 人間が読める実時間 */
  realTimeText(gameDays) {
    const min = Math.max(0, gameDays) * this.pace.realMinutesPerDay;
    if (min < 1) return 'まもなく';
    if (min < 60) return `約${Math.ceil(min)}分`;
    if (min < 60 * 24) return `約${Math.round(min / 60 * 10) / 10}時間`;
    return `約${Math.round(min / 1440 * 10) / 10}日`;
  }
  season() {
    return seasonAt(this.state.clock);
  }

  /* ---- 参照系 ---- */
  plant(id) { return this.state.plants.find((p) => p.id === id) || null; }
  species(p) { return SPECIES_BY_ID[p.speciesId]; }
  stageInfo(p) { return STAGES[p.stage]; }
  ageDays(p) { return Math.max(0, this.state.clock - p.bornDay); }

  displayName(p) {
    const sp = this.species(p);
    if (p.hybrid) {
      const a = SPECIES_BY_ID[p.hybrid.a]?.ja ?? '?';
      const b = SPECIES_BY_ID[p.hybrid.b]?.ja ?? '?';
      return p.branch ? `${a}×${b}・${BRANCHES[p.branch].ja}` : `${a}×${b}`;
    }
    if (p.branch) return `${sp.ja}・${BRANCHES[p.branch].ja}`;
    return `${sp.ja} ${STAGES[p.stage].ja}`;
  }

  /** その株の現在のタイプ(品種タイプ + 系統タイプ) */
  typesOf(p) {
    const list = [...this.species(p).types];
    if (p.branch && !list.includes(BRANCHES[p.branch].type)) list.push(BRANCHES[p.branch].type);
    return list;
  }

  score(p) {
    const g = p.genes;
    const sp = this.species(p);
    const gene = (g.leaf * 0.9 + g.compact * 1.6 + g.spine * 1.2 + g.variegation * 1.4 +
      g.bloom * 0.7 + g.vigor * 0.9) / 6.7;
    return Math.round(clamp(
      gene * 3.4 + p.stage * 34 + sp.rarity * 12 + Math.min(60, p.album.length * 5) +
      this.careQuality(p) * 0.9 + (p.care.health - 60) * 0.5, 0, 1200));
  }

  careQuality(p) {
    const sp = this.species(p);
    let s = 50;
    const iv = p.waterIntervals.slice(-8);
    if (iv.length >= 2) {
      const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
      const sd = Math.sqrt(iv.reduce((a, b) => a + (b - mean) ** 2, 0) / iv.length);
      s += clamp(22 - Math.abs(mean - sp.water) * 3.4, -18, 22);
      s += clamp(14 - sd * 3.2, -10, 14);
    }
    s += clamp(18 - Math.abs(p.light - sp.light) * 0.55, -20, 18);
    s += (p.care.health - 70) * 0.35;
    s -= p.pest * 0.25;
    s += Math.min(12, p.album.length * 1.5);
    return Math.round(clamp(s, 0, 100));
  }

  avgWaterInterval(p) {
    if (!p.waterIntervals.length) return null;
    const iv = p.waterIntervals.slice(-10);
    return round1(iv.reduce((a, b) => a + b, 0) / iv.length);
  }

  estimatedLux(p) {
    return p.lux || Math.round(p.light * 1180 + 800);
  }

  /* ---- シミュレーション ---- */

  tick(force = false) {
    const now = Date.now();
    const elapsed = (now - this.state.lastRealMs) / this.msPerGameDay;
    if (elapsed <= 0.0008 && !force) return false;
    this.state.clock += Math.max(0, elapsed);
    this.state.lastRealMs = now;
    const season = this.season();

    for (const p of this.state.plants) {
      const sp = this.species(p);
      const gf = growthFactor(sp, season);
      const d = Math.max(0, elapsed);

      const dryRate = (100 / sp.water) * (gf < 0.8 ? 0.6 : 1) * (0.85 + p.light / 220);
      p.care.hydration = clamp(p.care.hydration - dryRate * d, 0, 120);
      p.care.nutrition = clamp(p.care.nutrition - 3.6 * d * (gf < 0.8 ? 0.5 : 1), 0, 100);

      const pestRisk = (p.care.hydration > 88 ? 1.6 : 0.35) *
        (p.light < sp.light - 22 ? 1.9 : 0.7) * (this.state.items.shade > 0 ? 0.7 : 1);
      p.pest = clamp(p.pest + pestRisk * 1.4 * d, 0, 100);

      const over = p.care.hydration > 100 ? (p.care.hydration - 100) * 1.4 : 0;
      const under = p.care.hydration < 12 ? (12 - p.care.hydration) * 2.4 : 0;
      const lightPenalty = Math.abs(p.light - sp.light) * 0.75;
      const target = clamp(100 - over - under - lightPenalty - p.pest * 0.55 +
        (p.care.nutrition > 40 ? 6 : -6), 5, 100);
      p.care.health += (target - p.care.health) * clamp(d * 0.6, 0, 1);
      p.care.health = clamp(p.care.health, 1, 100);

      this.driftGenes(p, sp, d * gf);

      if (p.care.health > 55) {
        p.exp += 18 * d * gf * (this.state.items.pot > 0 ? 1.15 : 1);
      }
    }

    this.checkLogin();
    this.checkQuests();
    writeSave(this.state);
    this.emit('tick');
    return true;
  }

  /* 育て方が姿に出る。性格で伸びやすさが変わる */
  driftGenes(p, sp, days) {
    const g = p.genes, base = p.baseGenes;
    const lightGap = p.light - sp.light;
    const dry = p.care.hydration < 45;
    const move = (key, delta) => {
      let d = delta;
      if (p.nature.up === key) d *= 1.5;
      if (p.nature.down === key) d *= 0.5;
      g[key] = Math.round(clamp(g[key] + d * days, clamp(base[key] - 30, 1, 100), clamp(base[key] + 30, 1, 100)) * 10) / 10;
    };
    if (Math.abs(lightGap) <= 8 && dry) move('compact', 1.4);
    else if (lightGap < -18) move('compact', -1.6);
    else if (lightGap > 18) move('compact', 0.3);
    if (lightGap > -5 && p.care.health > 55) move('spine', 0.6);
    if (p.care.nutrition > 55 && p.care.hydration > 35) { move('vigor', 0.9); move('leaf', 0.5); }
    else if (p.care.nutrition < 15) move('vigor', -0.6);
    if (dry && lightGap > -4) move('bloom', 0.5);
    if (p.pest > 45) { move('leaf', -0.8); move('compact', -0.6); }
  }

  checkLogin() {
    const key = dayKey(Date.now());
    const st = this.state.stats;
    if (st.lastLoginDay !== key) {
      const diff = Math.round((new Date(key) - new Date(st.lastLoginDay)) / 86400000);
      st.streak = diff === 1 ? st.streak + 1 : 1;
      st.lastLoginDay = key;
      const bonus = 30 + Math.min(70, st.streak * 5);
      this.state.coins += bonus;
      this.pushLog(`ログインボーナス +${bonus} コイン(${st.streak}日連続)`);
    }
  }

  pushLog(text) {
    this.state.log.unshift({ t: Date.now(), day: round1(this.state.clock), text });
    this.state.log = this.state.log.slice(0, 60);
  }

  /* ---- ケア ---- */

  water(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const sp = this.species(p);
    const interval = this.state.clock - p.lastWaterDay;
    const over = p.care.hydration > 70;
    if (interval > 0.25) p.waterIntervals = [...p.waterIntervals, round1(interval)].slice(-20);
    p.lastWaterDay = this.state.clock;
    p.care.hydration = over ? clamp(p.care.hydration + 20, 0, 118) : 100;
    let gain = 8, msg = `${p.nickname} に水をやった`, kind = '';
    if (over) {
      p.care.health = clamp(p.care.health - 5, 1, 100);
      p.pest = clamp(p.pest + 7, 0, 100);
      gain = 2;
      msg = '用土がまだ湿っている。根腐れに注意';
      kind = 'bad';
    } else if (Math.abs(interval - sp.water) <= 1.5) {
      gain = 20;
      msg = '完璧なタイミングの潅水！';
      kind = 'gold';
    }
    this.gainExp(p, gain);
    this.state.stats.waterings++;
    this.state.tutorial.water = true;
    this.pushLog(msg);
    this.save();
    return { ok: true, message: `${msg} (+${gain} EXP)`, kind, exp: gain };
  }

  fertilize(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    if (this.state.items.fertilizer <= 0) return { ok: false, message: '活力剤がありません(ショップで購入できます)' };
    this.state.items.fertilizer--;
    p.care.nutrition = clamp(p.care.nutrition + 45, 0, 100);
    this.gainExp(p, 12);
    this.pushLog(`${p.nickname} に活力剤を与えた`);
    this.save();
    return { ok: true, message: '養分 +45 (+12 EXP)' };
  }

  treat(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    if (p.pest < 1) return { ok: false, message: '害虫は見当たりません' };
    if (this.state.items.medicine <= 0) return { ok: false, message: '殺虫剤がありません(ショップで購入できます)' };
    this.state.items.medicine--;
    p.pest = 0;
    p.care.health = clamp(p.care.health + 6, 1, 100);
    this.gainExp(p, 14);
    this.pushLog(`${p.nickname} の害虫を駆除した`);
    this.save();
    return { ok: true, message: '害虫を駆除した (+14 EXP)' };
  }

  setLight(id, value) {
    const p = this.plant(id);
    if (p) { p.light = clamp(Math.round(value), 0, 100); this.save(); }
  }

  setLightMeasure(id, { lux, hours }) {
    const p = this.plant(id);
    if (!p) return;
    if (Number.isFinite(lux)) p.lux = Math.max(0, Math.round(lux));
    if (Number.isFinite(hours)) p.lightHours = clamp(hours, 0, 24);
    this.gainExp(p, 6);
    this.save();
  }

  addPhoto(id, { photoId, spriteId, analysis, note }) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    p.album.unshift({
      id: uid('al'), t: Date.now(), day: round1(this.state.clock),
      photoId, spriteId, note: note || '', stage: p.stage, metrics: { ...p.metrics },
    });
    p.photoId = photoId;
    p.spriteId = spriteId;
    p.lastPhotoDay = this.state.clock;
    if (analysis && analysis.raw) {
      for (const k of GENE_KEYS) {
        if (!Number.isFinite(analysis.raw[k])) continue;
        p.genes[k] = Math.round(clamp(p.genes[k] * 0.78 + analysis.raw[k] * 0.22, 1, 100));
      }
    }
    this.state.stats.photos++;
    this.state.tutorial.photo = true;
    this.gainExp(p, 30);
    this.registerDex(p);
    this.pushLog(`${p.nickname} の写真を記録した (${p.album.length}枚目)`);
    this.checkQuests();
    this.save();
    return { ok: true };
  }

  measure(id, { diameter, leaves, height }) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const prev = { ...p.metrics };
    if (Number.isFinite(diameter) && diameter > 0) p.metrics.diameter = diameter;
    if (Number.isFinite(leaves) && leaves > 0) p.metrics.leaves = Math.round(leaves);
    if (Number.isFinite(height) && height > 0) p.metrics.height = height;
    if (!p.baseline.diameter) p.baseline.diameter = p.metrics.diameter;
    const grew = Math.max(0, (p.metrics.diameter || 0) - (prev.diameter || 0));
    const gain = 18 + Math.round(grew * 14);
    this.gainExp(p, gain);
    this.state.stats.measures++;
    p.events.unshift({
      t: Date.now(), day: round1(this.state.clock), type: 'measure',
      text: `実測 幅 ${p.metrics.diameter}cm / 葉 ${p.metrics.leaves}枚${grew ? ` (+${round1(grew)}cm)` : ''}`,
    });
    this.checkQuests();
    this.save();
    return { ok: true, exp: gain, grew };
  }

  gainExp(p, amount) {
    p.exp = Math.round(p.exp + amount * (this.state.items.pot > 0 ? 1.15 : 1));
  }

  /* ---- 進化 ---- */

  evolveCheck(p) {
    if (p.stage >= 4) return { ok: false, done: true, missing: [] };
    const req = STAGE_REQUIREMENTS[p.stage + 1];
    const days = this.ageDays(p);
    const missing = [];
    if (p.exp < req.exp) missing.push({ key: 'exp', label: '経験値', have: Math.floor(p.exp), need: req.exp });
    if (days < req.days) missing.push({ key: 'days', label: '育成日数', have: round1(days), need: req.days, unit: '日' });
    if (p.album.length < req.photos) {
      missing.push({ key: 'photos', label: '記録写真', have: p.album.length, need: req.photos, unit: '枚' });
    }
    if (p.care.health < 50) missing.push({ key: 'health', label: '健康', have: Math.round(p.care.health), need: 50 });
    return { ok: missing.length === 0, done: false, missing, req };
  }

  /** 次の進化までの見込み。実時間の目安つき */
  evolveEta(p) {
    const c = this.evolveCheck(p);
    if (c.done || c.ok) return null;
    let days = 0;
    for (const m of c.missing) {
      if (m.key === 'days') days = Math.max(days, m.need - m.have);
      if (m.key === 'exp') {
        // 健康なら概ね 1 ゲーム日で 18 EXP + 世話の分
        days = Math.max(days, (m.need - m.have) / 24);
      }
    }
    const blockers = c.missing.filter((m) => m.key === 'photos' || m.key === 'health');
    return { days: round1(days), real: this.realTimeText(days), blockers };
  }

  decideBranch(p) {
    const g = p.genes, base = p.baseGenes, care = this.careQuality(p);
    const cand = {
      compact: g.compact + (g.compact - base.compact) * 2.4 + (care > 70 ? 12 : 0),
      nishiki: g.variegation * 1.2 + (g.bloom - 50) * 0.3,
      fang: g.spine + (g.spine - base.spine) * 2.2,
      titan: g.vigor + (g.leaf - 50) * 0.6 + (p.metrics.diameter || 0) * 1.2,
    };
    return Object.entries(cand).sort((a, b) => b[1] - a[1])[0][0];
  }

  branchLean(p) {
    const g = p.genes, base = p.baseGenes, care = this.careQuality(p);
    const raw = {
      compact: g.compact + (g.compact - base.compact) * 2.4 + (care > 70 ? 12 : 0),
      nishiki: g.variegation * 1.2 + (g.bloom - 50) * 0.3,
      fang: g.spine + (g.spine - base.spine) * 2.2,
      titan: g.vigor + (g.leaf - 50) * 0.6 + (p.metrics.diameter || 0) * 1.2,
    };
    const total = Object.values(raw).reduce((a, b) => a + Math.max(1, b), 0);
    return Object.fromEntries(Object.entries(raw).map(([k, v]) => [k, Math.round((Math.max(1, v) / total) * 100)]));
  }

  evolve(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const check = this.evolveCheck(p);
    if (!check.ok) return { ok: false, message: '進化条件を満たしていません', missing: check.missing };
    const before = this.displayName(p);
    p.stage += 1;
    let branch = null;
    if (p.stage >= 3 && !p.branch) {
      p.branch = this.decideBranch(p);
      branch = BRANCHES[p.branch];
      p.genes[branch.stat] = Math.round(clamp(p.genes[branch.stat] + 16, 1, 100));
      p.baseGenes[branch.stat] = p.genes[branch.stat];
    }
    p.baseline = { diameter: p.metrics.diameter, stageAtDay: this.state.clock };
    p.events.unshift({
      t: Date.now(), day: round1(this.state.clock), type: 'evolve',
      text: `${before} → ${this.displayName(p)}`,
    });
    this.state.stats.evolutions++;
    this.state.tutorial.evolve = true;
    this.state.coins += 120 + p.stage * 60;
    this.registerDex(p);
    this.pushLog(`${this.displayName(p)} に進化！`);
    this.checkQuests();
    this.save();
    return { ok: true, plant: p, before, after: this.displayName(p), branch };
  }

  /* ---- 図鑑 ---- */

  registerDex(p) {
    const d = (this.state.dex[p.speciesId] ||= { seen: 1, forms: {}, stages: {}, firstAt: Date.now() });
    d.stages[p.stage] = true;
    if (p.branch) d.forms[p.branch] = true;
  }

  dexProgress() {
    const seen = Object.keys(this.state.dex).length;
    const forms = Object.values(this.state.dex).reduce((a, d) => a + Object.keys(d.forms || {}).length, 0);
    return {
      total: SPECIES.length, seen, forms,
      maxForms: SPECIES.length * BRANCH_KEYS.length,
      percent: Math.round((seen / SPECIES.length) * 100),
    };
  }

  /* ---- 導線: 次にやること ---- */

  nextAction() {
    const s = this.state;
    if (!s.plants.length) {
      return {
        step: 1, title: 'まずは株を1つ迎えよう',
        body: '無償で迎えられる品種が4つあります。棚に置いた瞬間から育成が始まります。',
        cta: { label: '株を迎える', action: 'adopt' },
      };
    }
    const byUrgency = [...s.plants].sort((a, b) => this.urgency(b) - this.urgency(a));
    const worst = byUrgency[0];

    if (worst.pest > 45) {
      return {
        step: null, title: `${worst.nickname} に害虫が出ている`,
        body: '放っておくと葉幅と締まりが削られます。殺虫剤で駆除してください。',
        cta: { label: '個体を開く', action: 'plant', param: worst.id }, tone: 'danger',
      };
    }
    if (worst.care.hydration < 15) {
      return {
        step: null, title: `${worst.nickname} が乾いている`,
        body: '適正間隔に近いタイミングで水をやると経験値が多くもらえます。',
        cta: { label: '水をやる', action: 'water', param: worst.id }, tone: 'warn',
      };
    }
    const evolvable = s.plants.find((p) => this.evolveCheck(p).ok);
    if (evolvable) {
      return {
        step: null, title: `${evolvable.nickname} が進化できる！`,
        body: `${STAGES[evolvable.stage + 1].ja} へ進化します。${evolvable.stage + 1 >= 3 && !evolvable.branch ? 'ここで系統が確定します。' : ''}`,
        cta: { label: '進化させる', action: 'evolve', param: evolvable.id }, tone: 'gold',
      };
    }
    const noPhoto = s.plants.find((p) => !p.album.length);
    if (noPhoto) {
      return {
        step: 2, title: `${noPhoto.nickname} の写真を記録しよう`,
        body: '実物の写真を1枚入れると、背景を落としてドット絵になり、その株の個性値が写真から決まります。',
        cta: { label: '写真を記録', action: 'photo', param: noPhoto.id },
      };
    }
    // 進化に写真が足りない株
    for (const p of s.plants) {
      const c = this.evolveCheck(p);
      const need = c.missing.find((m) => m.key === 'photos');
      if (need) {
        return {
          step: null, title: `${p.nickname} は写真があと ${need.need - need.have} 枚`,
          body: '成長の記録を残すほど早く進化します。',
          cta: { label: '写真を記録', action: 'photo', param: p.id },
        };
      }
    }
    // 待ち時間の案内
    const withEta = s.plants
      .map((p) => ({ p, eta: this.evolveEta(p) }))
      .filter((x) => x.eta)
      .sort((a, b) => a.eta.days - b.eta.days)[0];
    if (withEta) {
      return {
        step: null, title: `${withEta.p.nickname} の進化まであと ${withEta.eta.days} 日`,
        body: `実時間で ${withEta.eta.real}。水やりや実測で経験値を足すと、その分だけ早まります。`,
        cta: { label: '個体を開く', action: 'plant', param: withEta.p.id },
      };
    }
    return {
      step: null, title: '棚は落ち着いています',
      body: '品評会に出したり、ラボで交配したり、図鑑の空欄を埋めにいきましょう。',
      cta: { label: '品評会へ', action: 'nav', param: 'contest' },
    };
  }

  urgency(p) {
    return (p.care.hydration < 15 ? 3 : 0) + (p.pest > 45 ? 3 : 0) +
      (p.care.health < 50 ? 2 : 0) + (this.evolveCheck(p).ok ? 1 : 0);
  }

  /* ---- コミュニティ(端末内生成の推定値) ---- */

  communityFor(speciesId) {
    const sp = SPECIES_BY_ID[speciesId];
    const rnd = seededRandom(`${speciesId}:${Math.floor(Date.now() / (86400000 * 7))}`);
    const mine = this.state.plants.filter((p) => p.speciesId === speciesId);
    const myWater = mine.map((p) => this.avgWaterInterval(p)).filter(Boolean);
    return {
      growers: 40 + Math.round((rnd() * 900) / sp.rarity),
      waterMean: round1(sp.water + (rnd() - 0.5) * 2.2),
      luxMean: Math.round(sp.light * 1150 + (rnd() - 0.5) * 12000),
      hoursMean: round1(6 + (sp.light / 100) * 7 + (rnd() - 0.5) * 1.6),
      myWater: myWater.length ? round1(myWater.reduce((a, b) => a + b, 0) / myWater.length) : null,
    };
  }

  communityTotals() {
    const rnd = seededRandom(`totals:${Math.floor(Date.now() / (86400000 * 7))}`);
    const trainers = 4200 + Math.round(rnd() * 900);
    return {
      species: SPECIES.length, trainers,
      photos: trainers * 23 + this.state.stats.photos,
      mySpecies: Object.keys(this.state.dex).length,
      myPhotos: this.state.stats.photos,
    };
  }

  /* ---- 品評会 ---- */

  makeRival(league, salt = '') {
    const lg = this.LEAGUES[league];
    const rnd = seededRandom(`rival:${league}:${salt}`);
    const sp = SPECIES[Math.floor(rnd() * SPECIES.length)];
    const target = lg.min + 110 + rnd() * 170;
    const genes = {};
    for (const k of GENE_KEYS) {
      genes[k] = Math.round(clamp(sp.bias[k] * (0.7 + target / 900) + (rnd() - 0.5) * 20, 5, 100));
    }
    return {
      name: `${RIVAL_PREFIX[Math.floor(rnd() * RIVAL_PREFIX.length)]}の${sp.ja}`,
      speciesId: sp.id, genes, types: sp.types,
      stage: clamp(2 + Math.floor(league / 2), 0, 4),
      score: Math.round(target),
    };
  }

  /** タイプ相性: 審査員の好みに合うと加点、苦手だと減点 */
  typeBonus(types, judgeLikes) {
    if (types.includes(judgeLikes)) return 1.35;
    const like = TYPES[judgeLikes];
    if (like && types.some((t) => like.strong.includes(t))) return 0.78;
    if (like && types.some((t) => like.weak.includes(t))) return 1.12;
    return 1;
  }

  contest(id, league) {
    const p = this.plant(id);
    const lg = this.LEAGUES[league];
    if (!p || !lg) return { ok: false };
    if (this.score(p) < lg.min) return { ok: false, message: `${lg.ja} は総合スコア ${lg.min} 以上が必要です` };

    const salt = `${p.id}:${this.state.stats.contests}`;
    const rnd = seededRandom(`judge:${salt}`);
    const judge = JUDGES[Math.floor(rnd() * JUDGES.length)];
    const rival = this.makeRival(league, salt);
    const myBonus = this.typeBonus(this.typesOf(p), judge.likes);
    const rivalBonus = this.typeBonus(rival.types, judge.likes);
    const g = p.genes;

    const categories = [
      { ja: '姿', mine: (g.compact * 1.4 + g.leaf * 0.6) / 2, theirs: (rival.genes.compact * 1.4 + rival.genes.leaf * 0.6) / 2 },
      { ja: '気迫', mine: g.spine, theirs: rival.genes.spine },
      { ja: '色', mine: (g.variegation + g.bloom) / 2, theirs: (rival.genes.variegation + rival.genes.bloom) / 2 },
      { ja: '貫禄', mine: g.vigor * 0.6 + p.stage * 14, theirs: rival.genes.vigor * 0.6 + rival.stage * 14 },
      { ja: '管理', mine: this.careQuality(p), theirs: 45 + league * 9 },
    ].map((c) => {
      const mine = Math.round(c.mine * myBonus);
      const theirs = Math.round(c.theirs * rivalBonus);
      return { ja: c.ja, mine, theirs, win: mine >= theirs };
    });

    const wins = categories.filter((c) => c.win).length;
    const won = wins >= 3;
    const reward = won ? lg.reward : Math.round(lg.reward * 0.25);
    this.state.coins += reward;
    this.state.stats.contests++;
    if (won) {
      this.state.stats.contestWins++;
      this.state.stats.league = Math.max(this.state.stats.league, Math.min(league + 1, this.LEAGUES.length - 1));
      this.gainExp(p, 60 + league * 40);
    }
    p.events.unshift({
      t: Date.now(), day: round1(this.state.clock), type: 'contest',
      text: `${lg.ja} ${won ? '優勝' : `${wins}/5部門`}(審査員: ${judge.ja})`,
    });
    this.pushLog(`${lg.ja}: ${won ? '優勝' : '入賞ならず'} — ${p.nickname}`);
    this.checkQuests();
    this.save();
    return { ok: true, won, wins, categories, rival, reward, league: lg, judge, myBonus };
  }

  /* ---- ラボ ---- */

  cross(idA, idB) {
    const a = this.plant(idA), b = this.plant(idB);
    if (!a || !b || a.id === b.id) return { ok: false, message: '異なる2株を選んでください' };
    if (a.stage < 3 || b.stage < 3) return { ok: false, message: '交配には成株以上が2株必要です' };
    if (this.state.items.seed <= 0) return { ok: false, message: '交配用種子がありません(ショップで購入できます)' };
    this.state.items.seed--;

    const rnd = seededRandom(`cross:${a.id}:${b.id}:${Date.now()}`);
    const genes = {};
    for (const k of GENE_KEYS) {
      genes[k] = Math.round(clamp((a.genes[k] + b.genes[k]) / 2 + (rnd() - 0.5) * 22, 1, 100));
    }
    let mutation = null;
    const roll = rnd();
    if (roll < 0.09) { genes.variegation = clamp(genes.variegation + 38, 1, 100); mutation = '斑入りが覚醒した'; }
    else if (roll < 0.15) { genes.vigor = clamp(genes.vigor + 30, 1, 100); genes.leaf = clamp(genes.leaf + 16, 1, 100); mutation = '巨大化の素質が出た'; }
    else if (roll < 0.2) { genes.compact = clamp(genes.compact + 32, 1, 100); mutation = '極端な矮性が出た'; }

    const child = createPlant(rnd() < 0.5 ? a.speciesId : b.speciesId, {
      genes, clock: this.state.clock,
      nickname: `${SPECIES_BY_ID[a.speciesId].ja}×${SPECIES_BY_ID[b.speciesId].ja}`,
      parents: [
        { id: a.id, name: this.displayName(a), speciesId: a.speciesId },
        { id: b.id, name: this.displayName(b), speciesId: b.speciesId },
      ],
      hybrid: { a: a.speciesId, b: b.speciesId },
      gen: Math.max(a.gen, b.gen) + 1,
    });
    if (mutation) child.events.unshift({ t: Date.now(), day: round1(this.state.clock), type: 'mutation', text: mutation });
    this.state.plants.push(child);
    this.registerDex(child);
    this.pushLog(`交配成功: ${child.nickname}${mutation ? ` — ${mutation}` : ''}`);
    this.checkQuests();
    this.save();
    return { ok: true, child, mutation };
  }

  /* ---- 経済 ---- */

  buy(itemId) {
    const item = SHOP.find((i) => i.id === itemId);
    if (!item) return { ok: false };
    if (this.state.coins < item.price) return { ok: false, message: 'コインが足りません' };
    this.state.coins -= item.price;
    this.state.items[item.id] = (this.state.items[item.id] || 0) + 1;
    this.save();
    return { ok: true, message: `${item.ja} を購入しました` };
  }

  sell(id) {
    const p = this.plant(id);
    if (!p) return { ok: false };
    const price = Math.round(this.score(p) * 1.1 + this.species(p).rarity * 40);
    this.state.coins += price;
    this.state.plants = this.state.plants.filter((x) => x.id !== id);
    this.pushLog(`${this.displayName(p)} を ${price} コインで譲渡した`);
    this.save();
    return { ok: true, price };
  }

  adopt(speciesId) {
    const p = createPlant(speciesId, { clock: this.state.clock });
    this.state.plants.push(p);
    this.state.tutorial.adopt = true;
    this.registerDex(p);
    this.pushLog(`${SPECIES_BY_ID[speciesId].ja} を迎えた`);
    this.checkQuests();
    this.save();
    return p;
  }

  rename(id, name) {
    const p = this.plant(id);
    if (p) { p.nickname = String(name).slice(0, 24) || p.nickname; this.save(); }
  }

  /* ---- クエスト ---- */

  checkQuests() {
    const done = [];
    let earned = 0;
    for (const q of QUESTS) {
      if (this.state.quests[q.id]) continue;
      let ok = false;
      try { ok = q.check(this.state); } catch { ok = false; }
      if (ok) {
        this.state.quests[q.id] = { at: Date.now() };
        this.state.coins += q.reward;
        earned += q.reward;
        done.push(q);
      }
    }
    if (done.length) this.emit('quest', { done, earned });
    return done;
  }

  /* ---- 助言 ---- */

  advice(p) {
    const sp = this.species(p);
    const season = this.season();
    const out = [];
    if (p.pest > 35) out.push({ level: 'danger', text: `害虫レベル ${Math.round(p.pest)}。放置すると葉幅と締まりが削られます。` });
    if (p.care.hydration < 12) out.push({ level: 'warn', text: '完全に乾いています。いま水をやると経験値が多く入ります。' });
    else if (p.care.hydration > 102) out.push({ level: 'warn', text: '過湿ぎみ。根腐れと害虫のリスクが上がっています。' });
    if (p.light < sp.light - 20) out.push({ level: 'warn', text: `日照不足。徒長して締まりが落ちています(適正 ${sp.light})。` });
    if (p.light > sp.light + 20) out.push({ level: 'warn', text: `日照が強すぎます。葉焼けの恐れ(適正 ${sp.light})。` });
    if (p.care.nutrition < 18) out.push({ level: 'info', text: '養分が切れかけています。活力剤で成長力の伸びを支えられます。' });
    if (isSlowSeason(sp, season)) out.push({ level: 'info', text: `いまは${season.ja}。${sp.ja}にとっては成長が緩む時期です(あと ${season.daysLeft} 日)。` });
    if (!p.album.length) out.push({ level: 'info', text: '写真を1枚入れると、ドット絵と個性値が実物に同期します。' });
    if (this.evolveCheck(p).ok) out.push({ level: 'good', text: '進化条件を満たしています。' });
    return out;
  }

  /* ---- 体験用 ---- */
  warp(days) {
    this.state.clock += days;
    this.state.lastRealMs = Date.now();
    this.tick(true);
    this.pushLog(`時間を ${days} ゲーム日進めた`);
    this.save();
  }

  setPace(key) {
    if (!PACES[key]) return;
    this.state.settings.pace = key;
    this.state.lastRealMs = Date.now();
    this.save();
  }

  reset() {
    this.state = freshState();
    this.save();
  }
}

const game = new Game();


return { seasonAt, growthFactor, isSlowSeason, createPlant, game, SPECIES, SPECIES_BY_ID, STAGES, STAGE_REQUIREMENTS, BRANCHES, BRANCH_KEYS, SHOP, QUESTS, STARTERS, PACES, NATURES, TYPES, JUDGES };
})();

/* PIXAGAVE — Creator
 * 育成データからそのまま共有画像を書き出す。
 * ピクセルアート / 個体カード / ストーリー(9:16) / コレクションカバー / 成長ストリップ
 * すべて canvas 描画。フォントは端末内蔵のみを使う。
 */






const JP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,monospace';

const INK = '#e8f6ec';
const DIM = '#7fa694';
const BG0 = '#061410';
const BG1 = '#0d2119';

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function backdrop(ctx, w, h, accent) {
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, BG0);
  g.addColorStop(0.55, BG1);
  g.addColorStop(1, '#08190f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 目に見えるか見えないかの方眼(標本台紙のイメージ)
  ctx.strokeStyle = '#ffffff08';
  ctx.lineWidth = 1;
  const step = Math.round(w / 26);
  for (let x = step; x < w; x += step) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
  }
  for (let y = step; y < h; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
  }
  // 上端のスペクトル帯
  const bar = ctx.createLinearGradient(0, 0, w, 0);
  bar.addColorStop(0, accent);
  bar.addColorStop(0.5, '#ffd166');
  bar.addColorStop(1, '#f28fb0');
  ctx.fillStyle = bar;
  ctx.fillRect(0, 0, w, Math.max(4, Math.round(h / 190)));
}

function label(ctx, text, x, y, { size = 22, color = DIM, font = MONO, align = 'left', spacing = 0 } = {}) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = spacing ? 'left' : align;
  ctx.textBaseline = 'alphabetic';
  if (spacing) {
    let cx = x;
    if (align === 'center') {
      const total = [...text].reduce((a, ch) => a + ctx.measureText(ch).width + spacing, -spacing);
      cx = x - total / 2;
    } else if (align === 'right') {
      const total = [...text].reduce((a, ch) => a + ctx.measureText(ch).width + spacing, -spacing);
      cx = x - total;
    }
    for (const ch of text) {
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + spacing;
    }
  } else {
    ctx.fillText(text, x, y);
  }
  ctx.restore();
}

function panel(ctx, x, y, w, h, accent = '#5fe3c0') {
  ctx.fillStyle = '#0c1f18cc';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ffffff14';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = accent;
  ctx.fillRect(x, y, 4, h);
}

function drawSprite(ctx, img, cx, cy, size, accent) {
  const glow = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.72);
  glow.addColorStop(0, `${accent}33`);
  glow.addColorStop(1, '#00000000');
  ctx.fillStyle = glow;
  ctx.fillRect(cx - size, cy - size, size * 2, size * 2);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
  ctx.imageSmoothingEnabled = true;
}

function radar(ctx, cx, cy, r, genes, accent) {
  const keys = GENE_KEYS;
  const n = keys.length;
  const pt = (i, v) => {
    const a = (-Math.PI / 2) + (i / n) * Math.PI * 2;
    return [cx + Math.cos(a) * r * v, cy + Math.sin(a) * r * v];
  };
  ctx.strokeStyle = '#ffffff18';
  ctx.lineWidth = 1.5;
  for (const ring of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const [x, y] = pt(i % n, ring);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, Math.max(0.06, genes[keys[i]] / 100));
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = `${accent}44`;
  ctx.fill();
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, 1.2);
    label(ctx, GENES[keys[i]].ja, x, y + 6, { size: r * 0.15, color: DIM, font: JP, align: 'center' });
  }
}

function statRow(ctx, x, y, w, name, value, accent) {
  label(ctx, name, x, y, { size: 22, color: DIM, font: JP });
  label(ctx, value, x + w, y, { size: 26, color: INK, font: MONO, align: 'right' });
  ctx.fillStyle = '#ffffff12';
  ctx.fillRect(x, y + 12, w, 1);
}

async function spriteImage(plant, override) {
  let data = override || (plant.spriteId ? await getImage(plant.spriteId) : null);
  if (!data) {
    // 写真がまだ無い株は手続き生成のドット絵で代用する
    const sp = SPECIES_BY_ID[plant.speciesId];
    if (!sp) return null;
    data = proceduralSprite(sp, plant.genes, plant.seed || plant.id, plant.stage);
  }
  return loadImageFromUrl(data);
}

  label(ctx, `${plants.length} SPECIMENS`, W - 60, 90, { size: 28, color: '#5fe3c0', align: 'right', spacing: 5 });

  const list = plants.slice(0, 8);
  const cols = Math.min(4, Math.max(1, list.length));
  const rows = Math.ceil(list.length / cols);
  const cw = (W - 120) / cols;
  const chh = (H - 220) / rows;

  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const sp = SPECIES_BY_ID[p.speciesId];
    const accent = p.branch ? BRANCHES[p.branch].color : WORLDS[sp.world].color;
    const x = 60 + (i % cols) * cw;
    const y = 150 + Math.floor(i / cols) * chh;
    panel(ctx, x + 8, y, cw - 16, chh - 16, accent);
    const img = await spriteImage(p);
    if (img) drawSprite(ctx, img, x + cw / 2, y + chh * 0.42, Math.min(cw, chh) * 0.62, accent);
    label(ctx, game.displayName(p), x + cw / 2, y + chh - 52, {
      size: 26, color: INK, font: JP, align: 'center',
    });
    label(ctx, `${game.score(p)} pts`, x + cw / 2, y + chh - 26, {
      size: 20, color: DIM, align: 'center', spacing: 2,
    });
  }
  label(ctx, new Date().toISOString().slice(0, 10), W / 2, H - 34, {
    size: 22, color: DIM, align: 'center', spacing: 3,
  });
  return c.toDataURL('image/png');
}

/* ---------- 5. 成長ストリップ(タイムラプス) ---------- */

async function exportGrowthStrip(game, plant) {
  const entries = [...plant.album].reverse().slice(0, 8);
  if (!entries.length) throw new Error('記録がありません');
  const cell = 300;
  const W = Math.max(900, cell * entries.length + 80);
  const H = 560;
  const c = canvas(W, H);
  const ctx = c.getContext('2d');
  const sp = SPECIES_BY_ID[plant.speciesId];
  const accent = plant.branch ? BRANCHES[plant.branch].color : WORLDS[sp.world].color;
  backdrop(ctx, W, H, accent);

  label(ctx, `GROWTH LOG / ${game.displayName(plant)}`, 44, 78, { size: 26, color: INK, font: JP });
  label(ctx, `${entries.length} RECORDS`, W - 44, 78, { size: 22, color: DIM, align: 'right', spacing: 3 });

  const t0 = entries[0].t;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const x = 40 + i * cell;
    panel(ctx, x, 120, cell - 20, 380, accent);
    const spriteData = e.spriteId ? await getImage(e.spriteId) : null;
    if (spriteData) {
      const img = await loadImageFromUrl(spriteData);
      drawSprite(ctx, img, x + (cell - 20) / 2, 270, 210, accent);
    }
    const dayN = Math.max(0, Math.round((e.t - t0) / 86400000));
    label(ctx, `DAY ${dayN}`, x + (cell - 20) / 2, 430, { size: 24, color: INK, align: 'center', spacing: 3 });
    label(ctx, new Date(e.t).toISOString().slice(0, 10), x + (cell - 20) / 2, 462, {
      size: 19, color: DIM, align: 'center', spacing: 1,
    });
    if (e.metrics && e.metrics.diameter) {
      label(ctx, `${e.metrics.diameter}cm`, x + (cell - 20) / 2, 488, { size: 19, color: accent, align: 'center' });
    }
    if (i > 0) {
      label(ctx, '›', x - 12, 285, { size: 40, color: DIM, align: 'center' });
    }
  }
  label(ctx, 'PIXAGAVE', W / 2, H - 24, { size: 22, color: DIM, align: 'center', spacing: 6 });
  return c.toDataURL('image/png');
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const pct = (v, max = 100) => `${clamp((v / max) * 100, 0, 100).toFixed(1)}%`;

function t(key) {

}

function toast(message, kind = '') {

  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = message;
